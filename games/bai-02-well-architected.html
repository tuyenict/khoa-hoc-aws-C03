  <!-- Dữ liệu trò chơi, rút từ lessons/bai-02-well-architected.html (định dạng: xem assets/games.js) -->
  <script>
  window.DECK = {
    topics: [
      { id: "fw", name: "Framework & quy trình review" },
      { id: "gen", name: "6 trụ cột & nguyên tắc chung" },
      { id: "oesec", name: "Operational Excellence & Security" },
      { id: "relperf", name: "Reliability & Performance Efficiency" },
      { id: "costsus", name: "Cost Optimization & Sustainability" },
      { id: "tool", name: "WA Tool & Trusted Advisor" },
      { id: "kw", name: "Từ khóa đề ⇒ đáp án" }
    ],

    cards: [
      // ---- Framework & review
      { t: "fw", f: "AWS Well-Architected Framework dùng để làm gì?", b: "Giúp hiểu <b>ưu và nhược điểm của các quyết định kiến trúc</b>; đúc kết best practices để thiết kế workload <b>secure, reliable, efficient, cost-effective, sustainable</b>.", x: "Có bộ foundational questions kèm hướng khắc phục (remediation)." },
      { t: "fw", f: "Review theo Well-Architected có phải là audit không?", b: "<b>Không.</b> Là <b>cuộc trao đổi mang tính xây dựng</b> (not an audit mechanism), blame-free.", x: "Đề có thể dùng chữ “audit” làm phương án gây nhiễu." },
      { t: "fw", f: "Phân biệt <i>Component</i> và <i>Workload</i>.", b: "<b>Component</b>: code, cấu hình, tài nguyên AWS cùng đáp ứng <b>một yêu cầu</b>; đơn vị sở hữu kỹ thuật.<br><b>Workload</b>: tập component cùng mang lại <b>giá trị kinh doanh</b>." },
      { t: "fw", f: "<i>Technology portfolio</i> là gì?", b: "Tập hợp các <b>workload</b> cần thiết để doanh nghiệp vận hành.", x: "Portfolio ⊃ Workload ⊃ Component." },
      { t: "fw", f: "<i>Architecture</i> theo định nghĩa của Framework?", b: "Cách các component trong một workload <b>giao tiếp và tương tác</b> với nhau (thường thể hiện bằng sơ đồ)." },
      { t: "fw", f: "<i>Milestones</i> trong vòng đời sản phẩm gồm những mốc nào?", b: "<b>Design, implementation, testing, go live, in production</b>." },
      { t: "fw", f: "<i>Level of effort</i> High / Medium / Low tương ứng bao lâu?", b: "<b>High</b>: nhiều tuần – nhiều tháng<br><b>Medium</b>: nhiều ngày – nhiều tuần<br><b>Low</b>: nhiều giờ – nhiều ngày" },
      { t: "fw", f: "AWS giảm rủi ro của việc phân tán năng lực kiến trúc vào từng đội bằng 2 cách nào?", b: "<b>Practices</b> (quy trình, tiêu chuẩn) và <b>mechanisms</b> (cơ chế kiểm tra tự động).", x: "“Good intentions never work, you need good mechanisms…” – Jeff Bezos." },
      { t: "fw", f: "Một buổi review Well-Architected nên kéo dài bao lâu?", b: "<b>Gọn nhẹ: tính bằng giờ</b>, không phải ngày.", x: "AWS khuyến nghị đội tự review liên tục thay vì chỉ họp chính thức." },
      { t: "fw", f: "Khi nào nên thực hiện Well-Architected review?", b: "<b>Sớm ở giai đoạn thiết kế</b> (tránh one-way doors), <b>trước go-live</b>, và <b>mỗi khi có thay đổi kiến trúc đáng kể</b> trong production." },
      { t: "fw", f: "Phân biệt <i>one-way door</i> và <i>two-way door</i>.", b: "<b>One-way door</b>: khó/không thể đảo ngược ⇒ xem xét kỹ, review sớm.<br><b>Two-way door</b>: đảo ngược được ⇒ quy trình gọn, quyết nhanh." },
      { t: "fw", f: "Hai trụ cột nào thường <b>không</b> bị đem ra đánh đổi?", b: "<b>Security</b> và <b>Operational Excellence</b>.", x: "“Security and operational excellence are generally not traded-off against the other pillars.”" },
      { t: "fw", f: "Ví dụ đánh đổi giữa các trụ cột theo bối cảnh?", b: "<b>Dev</b>: ưu tiên cost/sustainability, hy sinh reliability (single-AZ, Spot).<br><b>Mission-critical</b>: ưu tiên reliability, chấp nhận tốn hơn.<br><b>E-commerce</b>: ưu tiên performance vì ảnh hưởng doanh thu." },

      // ---- 6 trụ cột & nguyên tắc chung
      { t: "gen", f: "Kể tên 6 trụ cột của Well-Architected Framework.", b: "<b>Operational Excellence · Security · Reliability · Performance Efficiency · Cost Optimization · Sustainability</b>." },
      { t: "gen", f: "Trụ cột nào được bổ sung muộn nhất, năm nào?", b: "<b>Sustainability</b>, năm <b>2021</b>.", x: "Tài liệu cũ nói “5 pillars”; SAA-C03 hiện dùng 6." },
      { t: "gen", f: "4 trụ cột nào khớp với 4 domain của SAA-C03?", b: "Security ⇒ <b>D1 (30%)</b> · Reliability ⇒ <b>D2 (26%)</b> · Performance Efficiency ⇒ <b>D3 (24%)</b> · Cost Optimization ⇒ <b>D4 (20%)</b>.", x: "OE và Sustainability “lồng” trong câu hỏi qua cụm LEAST operational overhead, reduce idle resources…" },
      { t: "gen", f: "Định nghĩa trụ cột <b>Reliability</b>?", b: "Khả năng workload thực hiện <b>đúng chức năng, nhất quán, khi được kỳ vọng</b> – trong suốt vòng đời." },
      { t: "gen", f: "Định nghĩa trụ cột <b>Cost Optimization</b>?", b: "Vận hành hệ thống mang lại giá trị kinh doanh ở <b>mức giá thấp nhất</b>." },
      { t: "gen", f: "6 general design principles là gì?", b: "<b>Stop guessing capacity</b> · <b>Test at production scale</b> · <b>Automate for experimentation</b> · <b>Evolutionary architectures</b> · <b>Drive architectures using data</b> · <b>Improve through game days</b>." },
      { t: "gen", f: "Nguyên tắc <i>Stop guessing your capacity needs</i> nói gì?", b: "Đoán sai capacity ⇒ hoặc tài nguyên nhàn rỗi đắt đỏ, hoặc thiếu capacity. Trên cloud: <b>scale in/out tự động</b>.", x: "Đáp án “mua server lớn hơn để phòng đỉnh tải” thường sai." },
      { t: "gen", f: "Nguyên tắc <i>Test systems at production scale</i> nói gì?", b: "Tạo môi trường test <b>quy mô production theo yêu cầu, test xong thì xóa</b>; chỉ trả tiền khi đang chạy." },
      { t: "gen", f: "<i>Consider evolutionary architectures</i> khác tư duy truyền thống thế nào?", b: "Truyền thống: kiến trúc là quyết định <b>tĩnh, một lần</b>. Cloud: tự động hóa + test giảm rủi ro thay đổi ⇒ hệ thống <b>tiến hóa theo thời gian</b>." },
      { t: "gen", f: "<i>Game day</i> là gì?", b: "Buổi <b>diễn tập mô phỏng sự kiện production</b> định kỳ để tìm điểm cần cải thiện và tích lũy kinh nghiệm xử lý sự cố." },

      // ---- OE & Security
      { t: "oesec", f: "Operational Excellence có bao nhiêu design principles và best practice areas?", b: "<b>8 design principles</b> / <b>4 areas</b>: Organization → Prepare → Operate → Evolve.", x: "Câu hỏi của trụ cột có tiền tố OPS." },
      { t: "oesec", f: "Nguyên tắc OE <i>Make frequent, small, reversible changes</i> mang lại lợi ích gì?", b: "Giảm <b>blast radius</b> và <b>rollback nhanh</b>; cần thiết kế scalable, loosely coupled, triển khai tự động." },
      { t: "oesec", f: "Nguyên tắc OE <i>Safely automate where possible</i> gồm những gì?", b: "Định nghĩa workload và vận hành <b>dưới dạng code</b>, tự động phản ứng theo sự kiện, đặt <b>guardrails</b> (rate control, ngưỡng lỗi, phê duyệt)." },
      { t: "oesec", f: "Dịch vụ AWS điển hình cho Operational Excellence?", b: "<b>CloudFormation</b> (IaC), <b>CloudWatch</b> (observability), <b>Systems Manager</b> (tự động hóa vận hành), <b>X-Ray</b> (truy vết), <b>CodePipeline</b> (CI/CD), <b>AWS Config</b> (theo dõi cấu hình)." },
      { t: "oesec", f: "Security có bao nhiêu design principles và best practice areas?", b: "<b>7 / 7</b>." },
      { t: "oesec", f: "Nguyên tắc <i>Implement a strong identity foundation</i> gồm gì?", b: "<b>Least privilege</b>, <b>separation of duties</b>, quản lý định danh tập trung, <b>loại bỏ long-term static credentials</b>." },
      { t: "oesec", f: "<i>Apply security at all layers</i> nghĩa là gì?", b: "<b>Defense in depth</b>: kiểm soát ở edge, VPC, load balancer, mọi instance/compute, OS, ứng dụng, code." },
      { t: "oesec", f: "Nguyên tắc <i>Keep people away from data</i>?", b: "Giảm/loại bỏ <b>truy cập trực tiếp hoặc xử lý thủ công</b> dữ liệu ⇒ giảm rủi ro sai sót, sửa đổi." },
      { t: "oesec", f: "7 best practice areas của Security?", b: "Security foundations · Identity and access management · <b>Detection</b> · Infrastructure protection · Data protection · Incident response · Application security." },
      { t: "oesec", f: "Dịch vụ cho best practice area <b>Detection</b>?", b: "<b>CloudTrail, AWS Config, GuardDuty, Security Hub, CloudWatch</b>." },
      { t: "oesec", f: "Dịch vụ cho best practice area <b>Data protection</b>?", b: "<b>KMS, CloudHSM, ACM, Macie, S3 Object Lock, AWS Backup</b>." },
      { t: "oesec", f: "Lưu access key của IAM user trong file cấu hình trên EC2 – sửa thế nào?", b: "Tạo <b>IAM role</b> least privilege, gắn qua <b>instance profile</b>, xóa access key.", x: "Mã hóa file bằng KMS hay xoay key bằng cron vẫn là long-term credentials ⇒ sai." },

      // ---- Reliability & Performance
      { t: "relperf", f: "5 design principles của Reliability?", b: "<b>Automatically recover from failure</b> · <b>Test recovery procedures</b> · <b>Scale horizontally</b> · <b>Stop guessing capacity</b> · <b>Manage change through automation</b>." },
      { t: "relperf", f: "4 best practice areas của Reliability?", b: "<b>Foundations</b> (Service Quotas, network topology) · <b>Workload architecture</b> · <b>Change management</b> · <b>Failure management</b> (self-heal)." },
      { t: "relperf", f: "<i>Automatically recover from failure</i>: nên giám sát KPI loại gì?", b: "KPI đo <b>giá trị kinh doanh</b>, không phải khía cạnh kỹ thuật; vượt ngưỡng thì tự động thông báo và khôi phục." },
      { t: "relperf", f: "Vì sao <i>scale horizontally</i> tăng availability?", b: "Thay <b>một tài nguyên lớn bằng nhiều tài nguyên nhỏ</b> ⇒ một lỗi đơn lẻ ảnh hưởng ít, không chung điểm lỗi." },
      { t: "relperf", f: "Nâng EC2 lên instance type lớn hơn có làm hệ thống highly available không?", b: "<b>Không.</b> Scale vertically cải thiện hiệu năng nhưng vẫn là <b>single point of failure</b>.", x: "HA ⇒ nhiều instance trên nhiều AZ sau load balancer." },
      { t: "relperf", f: "<i>Resource saturation</i> là gì và liên quan nguyên tắc nào?", b: "Nhu cầu <b>vượt capacity</b> – nguyên nhân lỗi phổ biến on-premises (mục tiêu của DoS). Liên quan <b>Stop guessing capacity</b>; vẫn phải quản lý <b>Service Quotas</b>." },
      { t: "relperf", f: "Performance Efficiency có bao nhiêu design principles? Kể tên.", b: "<b>5</b>: Democratize advanced technologies · Go global in minutes · Use serverless architectures · Experiment more often · Consider mechanical sympathy." },
      { t: "relperf", f: "<i>Democratize advanced technologies</i> – ví dụ?", b: "Dùng công nghệ <b>dưới dạng dịch vụ</b>: DynamoDB thay tự dựng Cassandra; Amazon Rekognition thay tự train model." },
      { t: "relperf", f: "<i>Consider mechanical sympathy</i> – ví dụ?", b: "Chọn theo <b>data access pattern</b>: key-value ⇒ <b>DynamoDB</b>; join phức tạp ⇒ <b>RDS/Aurora</b>; phân tích cột ⇒ <b>Redshift</b>." },
      { t: "relperf", f: "<i>Go global in minutes</i> – dịch vụ ví dụ?", b: "<b>CloudFront, Global Accelerator, DynamoDB global tables, Aurora Global Database</b>." },
      { t: "relperf", f: "5 best practice areas của Performance Efficiency?", b: "Architecture selection · Compute and hardware · Data management · Networking and content delivery · Process and culture.", x: "Đánh đổi để tăng hiệu năng: compression, caching, nới lỏng consistency." },

      // ---- Cost & Sustainability
      { t: "costsus", f: "5 design principles của Cost Optimization?", b: "<b>Implement Cloud Financial Management</b> · <b>Adopt a consumption model</b> · <b>Measure overall efficiency</b> · <b>Stop spending money on undifferentiated heavy lifting</b> · <b>Analyze and attribute expenditure</b>." },
      { t: "costsus", f: "Tắt môi trường dev/test ngoài giờ tiết kiệm bao nhiêu? Vì sao?", b: "Tới <b>~75%</b>: chỉ dùng <b>40 giờ</b> trên <b>168 giờ</b>/tuần.", x: "Nguyên tắc Adopt a consumption model." },
      { t: "costsus", f: "Dev/test chỉ chạy giờ hành chính – mua RI 3 năm có đúng không?", b: "<b>Sai.</b> RI/Savings Plans tính phí cam kết cả <b>24/7</b>. Đúng: <b>lên lịch tắt/bật</b> (EventBridge Scheduler + Lambda/Systems Manager, Instance Scheduler) hoặc serverless." },
      { t: "costsus", f: "<i>Undifferentiated heavy lifting</i> là gì?", b: "Việc nặng nhọc <b>không tạo khác biệt</b>: racking, stacking, cấp điện server, quản lý OS… ⇒ để AWS/managed services lo." },
      { t: "costsus", f: "Phân bổ chi phí cho từng chủ sở hữu workload bằng gì?", b: "<b>Cost allocation tags</b> (nguyên tắc Analyze and attribute expenditure); dữ liệu chi tiết nhất: <b>Cost and Usage Report</b>." },
      { t: "costsus", f: "Phân biệt Cost Explorer, Budgets, Compute Optimizer.", b: "<b>Cost Explorer</b>: phân tích, dự báo chi phí.<br><b>Budgets</b>: đặt ngân sách, cảnh báo vượt ngưỡng.<br><b>Compute Optimizer</b>: đề xuất right-sizing từ metrics." },
      { t: "costsus", f: "Khi nào dùng Savings Plans/RI, khi nào dùng Spot?", b: "<b>Savings Plans/RI</b>: cam kết 1 hoặc 3 năm cho <b>tải ổn định</b>.<br><b>Spot</b>: tải <b>chịu được gián đoạn</b> (batch, xử lý linh hoạt)." },
      { t: "costsus", f: "Sustainability có bao nhiêu design principles và best practice areas?", b: "<b>6 / 6</b>. Areas: Region selection · Alignment to demand · Software and architecture · Data management · Hardware and services · Process and culture." },
      { t: "costsus", f: "Ví dụ “Maximize utilization” của AWS?", b: "<b>1 host chạy 60%</b> hiệu quả hơn <b>2 host chạy 30%</b> vì mỗi host có mức điện năng nền cố định." },
      { t: "costsus", f: "Shared responsibility trong Sustainability?", b: "AWS: sustainability <b>OF</b> the cloud (hạ tầng, data center, nguồn điện).<br>Khách hàng: sustainability <b>IN</b> the cloud (workload, dữ liệu, mức sử dụng)." },
      { t: "costsus", f: "Managed services AWS nêu làm ví dụ cho Sustainability?", b: "<b>AWS Fargate</b>, <b>S3 Lifecycle</b> (chuyển dữ liệu ít truy cập sang cold storage), <b>EC2 Auto Scaling</b>." },

      // ---- WA Tool & Trusted Advisor
      { t: "tool", f: "AWS Well-Architected Tool có tốn phí không?", b: "<b>Miễn phí</b> (no charge), dùng trên console." },
      { t: "tool", f: "<i>Lens</i> trong WA Tool là gì? Có mấy loại?", b: "Bộ câu hỏi, best practices, improvement plan riêng. <b>Lens Catalog</b> (AWS tạo, duy trì) và <b>Custom lenses</b> (tự tạo, share được).", x: "Framework Lens được áp dụng tự động khi tạo workload." },
      { t: "tool", f: "Giới hạn lens trong WA Tool?", b: "Thêm tối đa <b>5 lens mỗi lần</b>; tối đa <b>20 lens</b> cho 1 workload.", x: "Gỡ lens thì dữ liệu vẫn được giữ, thêm lại sẽ khôi phục." },
      { t: "tool", f: "Phân biệt HRI và MRI.", b: "<b>HRI</b>: lựa chọn có thể gây tác động tiêu cực <b>đáng kể</b>.<br><b>MRI</b>: cũng tiêu cực nhưng <b>mức thấp hơn</b>." },
      { t: "tool", f: "<i>Milestone</i> trong WA Tool là gì?", b: "<b>Ảnh chụp trạng thái workload</b> tại một thời điểm; lưu sau lần trả lời đầu và mỗi lần cải tiến để đo tiến độ." },
      { t: "tool", f: "Các trạng thái của improvement plan?", b: "<b>None, Not Started, In Progress, Complete, Risk Acknowledged</b>." },
      { t: "tool", f: "Ai xóa được workload trong WA Tool?", b: "<b>Chỉ owner</b>; xóa là <b>không hoàn tác</b>, mất cả milestones.", x: "Workload có thể share cho account, user, Organization hoặc OU." },
      { t: "tool", f: "6 nhóm check của AWS Trusted Advisor?", b: "<b>Cost optimization, Performance, Security, Fault tolerance, Service limits, Operational excellence</b>." },
      { t: "tool", f: "Basic Support được dùng những check Trusted Advisor nào?", b: "<b>Tất cả check Service Limits</b> + <b>một số check chọn lọc</b> Security và Fault tolerance (refresh thủ công).", x: "Toàn bộ check + Trusted Advisor API cần gói cao hơn (Business Support+, Enterprise, Unified Operations)." },
      { t: "tool", f: "WA Tool khác Trusted Advisor thế nào?", b: "<b>WA Tool</b>: bạn <b>trả lời câu hỏi</b> về kiến trúc, quy trình, con người ⇒ HRI/MRI, milestones.<br><b>Trusted Advisor</b>: <b>tự động quét</b> tài nguyên ⇒ check đỏ/vàng/xanh." },

      // ---- Từ khóa
      { t: "kw", f: "Đề có “<i>evaluate workloads against Well-Architected</i>”, “<i>high-risk issues</i>”, “<i>save milestones</i>” ⇒ ?", b: "<b>AWS Well-Architected Tool</b>." },
      { t: "kw", f: "Đề có “<i>idle resources</i>”, “<i>service limits</i>”, “<i>unrestricted security group ports</i>” (khuyến nghị tự động) ⇒ ?", b: "<b>AWS Trusted Advisor</b>." },
      { t: "kw", f: "Đề có “<i>Who made this change?</i>” ⇒ ? Còn “<i>What did the configuration look like?</i>” ⇒ ?", b: "<b>CloudTrail</b> ⇒ ai làm gì. <b>AWS Config</b> ⇒ lịch sử cấu hình." },
      { t: "kw", f: "Đề có “<i>rotate database credentials automatically</i>” ⇒ ?", b: "<b>AWS Secrets Manager</b>." },
      { t: "kw", f: "Đề có tải “<i>unpredictable</i>”, “<i>spiky</i>”, “<i>varies throughout the day</i>” ⇒ ?", b: "<b>Auto Scaling</b>, serverless (<b>Lambda, DynamoDB on-demand, Aurora Serverless</b>)." },
      { t: "kw", f: "Đề có “<i>simulate failures</i>”, “<i>chaos engineering</i>”, “<i>test recovery procedures</i>” ⇒ ?", b: "<b>AWS Fault Injection Service</b> (tên cũ Fault Injection Simulator)." },
      { t: "kw", f: "Đề có “<i>automatically replace unhealthy instances</i>” ⇒ ?", b: "<b>EC2 Auto Scaling + ELB health checks</b>." },
