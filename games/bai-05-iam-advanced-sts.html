  <!-- Dữ liệu trò chơi, rút từ lessons/bai-05-iam-advanced-sts.html (định dạng: xem assets/games.js) -->
  <script>
  window.DECK = {
    topics: [
      { id: "eval", name: "Policy evaluation logic" },
      { id: "xacct", name: "Resource-based & cross-account" },
      { id: "bound", name: "Permissions boundary & session policy" },
      { id: "sts", name: "AWS STS & AssumeRole" },
      { id: "fed", name: "Identity federation" },
      { id: "aa", name: "IAM Access Analyzer" },
      { id: "kw", name: "Từ khóa đề ⇒ đáp án" }
    ],

    cards: [
      // ---- Evaluation logic
      { t: "eval", f: "Ba nguyên tắc nền tảng của policy evaluation?", b: "1. Mặc định <b>implicit deny</b> (trừ root user có full access)<br>2. Chỉ được phép khi có <b>Allow tường minh</b><br>3. <b>Explicit deny luôn ghi đè</b> explicit allow." },
      { t: "eval", f: "Thứ tự đánh giá của enforcement code?", b: "<b>Explicit Deny</b> (mọi policy) → <b>RCP</b> → <b>SCP</b> → <b>resource-based</b> → <b>identity-based</b> → <b>permissions boundary</b> → <b>session policy</b>." },
      { t: "eval", f: "Bước “Deny evaluation” làm gì?", b: "Quét <b>tất cả</b> policy áp dụng (SCP, RCP, resource-based, identity-based, boundary, session) tìm statement <b>Deny</b> khớp. Thấy dù chỉ một ⇒ <b>Deny cuối cùng</b>." },
      { t: "eval", f: "Ba bước AWS xử lý một request?", b: "1. <b>Authentication</b> (S3 cho phép request ẩn danh nên có thể bỏ qua)<br>2. <b>Processing the request context</b><br>3. <b>Enforcement code</b> đánh giá policy ra quyết định." },
      { t: "eval", f: "Khi bật RCP, vì sao vẫn luôn có một Allow mặc định?", b: "AWS tự gắn <b>RCPFullAWSAccess</b> (không gỡ được) vào root, mọi OU và account." },
      { t: "eval", f: "SCP áp dụng cho gì, RCP áp dụng cho gì?", b: "<b>SCP</b>: <b>principals</b> của account được gắn.<br><b>RCP</b>: <b>resources</b> của account được gắn." },
      { t: "eval", f: "Identity-based + resource-based (cùng account) kết hợp kiểu gì?", b: "<b>Hợp (union)</b>: Allow ở một bên hoặc cả hai ⇒ được phép. Explicit deny ở bất kỳ bên nào ghi đè." },
      { t: "eval", f: "Identity-based kết hợp với boundary / SCP / RCP / session policy kiểu gì?", b: "<b>Giao (intersection)</b>: action phải được <b>tất cả</b> cùng cho phép." },
      { t: "eval", f: "Policy nào <b>không bao giờ cấp quyền</b>, chỉ đặt quyền tối đa?", b: "<b>SCP, RCP, permissions boundary, session policy</b>.", x: "“Attach an SCP that allows S3 to grant the user access” là sai nếu user chưa có identity-based policy." },
      { t: "eval", f: "Root user của member account trong Organizations có bị SCP giới hạn không?", b: "<b>Có.</b> Root của tài khoản standalone có full access; root của <b>member account</b> vẫn bị <b>SCP/RCP</b> giới hạn." },
      { t: "eval", f: "Session policy cho kết quả gì khi principal <b>không</b> phải session principal?", b: "<b>Allow</b> (bước session policy được bỏ qua). Session principal = role session hoặc STS federated user session." },
      { t: "eval", f: "Session principal không truyền session policy thì sao?", b: "AWS tạo <b>session policy mặc định</b> ⇒ Allow ở bước này." },

      // ---- Resource-based & cross-account
      { t: "xacct", f: "Cùng account: resource policy ghi principal là <b>IAM user</b> ⇒ có bị implicit deny ở identity/boundary giới hạn không?", b: "<b>Không.</b> Allow trong resource policy là đủ." },
      { t: "xacct", f: "Cùng account: resource policy ghi principal là <b>IAM role ARN</b> ⇒ sao?", b: "<b>Có bị giới hạn</b> bởi implicit deny trong permissions boundary hoặc session policy (principal thật gửi request là role session)." },
      { t: "xacct", f: "Cùng account: resource policy ghi <b>role session ARN</b> ⇒ sao?", b: "<b>Không bị giới hạn</b>: quyền cấp trực tiếp cho session.", x: "Dạng <code>arn:aws:sts::acct:assumed-role/role/session</code>." },
      { t: "xacct", f: "Hai ngoại lệ phải <b>Allow tường minh</b> cho principal dù cùng account?", b: "<b>IAM role trust policy</b> và <b>AWS KMS key policy</b>.", x: "Có <code>sts:AssumeRole</code> hay <code>kms:Decrypt</code> trong identity policy là chưa đủ." },
      { t: "xacct", f: "Ví dụ Nikhil: boundary Deny bucket logs, bucket policy cho PutObject vào logs ⇒ ?", b: "<b>Vẫn bị từ chối</b>: explicit deny thắng." },
      { t: "xacct", f: "Ví dụ Nikhil: boundary không nhắc Secrets Manager, resource policy của secret cho GetSecretValue ⇒ ?", b: "<b>Lấy được secret</b>: implicit deny trong boundary không giới hạn resource-based policy cấp cho IAM user." },
      { t: "xacct", f: "<i>Trusted account</i> và <i>trusting account</i> là gì?", b: "<b>Trusted</b>: chứa <b>principal</b>.<br><b>Trusting</b>: chứa <b>tài nguyên</b>." },
      { t: "xacct", f: "Cross-account evaluation diễn ra thế nào?", b: "<b>Hai lần đánh giá</b>: ở trusted account (identity policy + boundary/session/SCP) và ở trusting account (resource policy + RCP). Chỉ Allow khi <b>cả hai Allow</b>." },
      { t: "xacct", f: "Resource-based policy vs cross-account role: khác nhau về quyền gốc?", b: "<b>Resource-based</b>: principal <b>giữ nguyên quyền</b> của mình (đọc bucket B, ghi bucket A cùng lúc).<br><b>Role</b>: principal <b>tạm bỏ quyền gốc</b> khi dùng role." },
      { t: "xacct", f: "Hạn chế của cách cấp cross-account bằng resource-based policy?", b: "Chỉ dùng được với dịch vụ <b>hỗ trợ resource-based policy</b> (S3, SQS, SNS, KMS, Lambda, Secrets Manager…)." },
      { t: "xacct", f: "Đọc object SSE-KMS ở account khác cần gì?", b: "Quyền trên <b>KMS key policy</b> (Allow tường minh) + <b>kms:Decrypt</b> trong identity policy (cùng quyền S3)." },

      // ---- Boundary & session policy
      { t: "bound", f: "Permissions boundary là gì?", b: "<b>Managed policy</b> đặt <b>quyền tối đa</b> mà identity-based policy có thể cấp cho một <b>IAM user hoặc role</b>." },
      { t: "bound", f: "Đặt permissions boundary được cho những gì?", b: "<b>Chỉ IAM user và IAM role</b>.", x: "Không cho group, không cho root user." },
      { t: "bound", f: "Boundary có dùng inline policy được không?", b: "<b>Không.</b> Phải là <b>managed policy</b> (AWS managed hoặc customer managed)." },
      { t: "bound", f: "Ví dụ Shirley: boundary <code>s3:*, cloudwatch:*, ec2:*</code> + identity policy chỉ có <code>iam:CreateUser</code> ⇒ làm được gì?", b: "<b>Không làm được gì cả</b>: phần giao của hai policy rỗng." },
      { t: "bound", f: "Use case chính của boundary trong đề thi?", b: "<b>Ủy quyền quản trị IAM</b> (cho người khác tạo user/role) mà <b>không leo thang đặc quyền</b>." },
      { t: "bound", f: "Ủy quyền tạo user an toàn (María & Zhang) cần những gì?", b: "Allow <code>iam:CreateUser</code>… chỉ khi condition <b>iam:PermissionsBoundary</b> = ARN boundary + <b>Deny sửa/xóa policy boundary</b> + <b>Deny iam:DeleteUserPermissionsBoundary</b>.", x: "Quên hai Deny ⇒ người được ủy quyền tự nới trần quyền." },
      { t: "bound", f: "Zhang tạo user Nikhil mà quên chọn boundary ⇒ ?", b: "<b>Access denied</b>: condition iam:PermissionsBoundary không khớp." },
      { t: "bound", f: "Vì sao không dùng resource policy <code>NotPrincipal</code> + Deny với principal có boundary?", b: "Nó <b>luôn deny</b> mọi principal có boundary, bất kể NotPrincipal. Dùng <b>ArnNotEquals</b> với <code>aws:PrincipalArn</code>." },
      { t: "bound", f: "Boundary khác SCP về phạm vi?", b: "<b>Boundary</b>: <b>một entity</b>, trong một tài khoản.<br><b>SCP</b>: toàn bộ <b>account/OU</b>, kể cả root của member account." },
      { t: "bound", f: "Session policy là gì?", b: "Policy truyền <b>như tham số</b> khi tạo phiên tạm thời cho role / STS federated user. Quyền phiên = <b>giao</b> với identity-based policy (và boundary)." },
      { t: "bound", f: "API nào hỗ trợ session policy, API nào không?", b: "Có: <b>AssumeRole, AssumeRoleWithSAML, AssumeRoleWithWebIdentity, GetFederationToken</b>.<br>Không: <b>GetSessionToken</b>." },
      { t: "bound", f: "Truyền được bao nhiêu session policy?", b: "<b>1 inline JSON policy</b> + tối đa <b>10 managed policy ARN</b>." },
      { t: "bound", f: "Use case điển hình của session policy?", b: "Ứng dụng <b>dùng chung một role</b> nhưng thu hẹp quyền theo từng phiên, vd chỉ prefix <code>s3://bucket/userA/</code>." },

      // ---- STS
      { t: "sts", f: "Temporary credentials của STS gồm những gì?", b: "<b>Access key ID + secret access key + session token</b>." },
      { t: "sts", f: "Temporary credentials khác access key dài hạn ở hai điểm nào?", b: "<b>Ngắn hạn</b> (vài phút–vài giờ) và <b>sinh động khi được yêu cầu</b>, không lưu cùng user." },
      { t: "sts", f: "Thời lượng tối thiểu của mọi STS credentials?", b: "<b>15 phút</b> (DurationSeconds ≥ 900)." },
      { t: "sts", f: "Thời lượng AssumeRole* mặc định và tối đa?", b: "Mặc định <b>1 giờ</b>; tối đa = <b>maximum session duration</b> của role (<b>≤ 12 giờ</b>)." },
      { t: "sts", f: "GetFederationToken / GetSessionToken: thời lượng tối đa?", b: "IAM user: tối đa <b>36 giờ</b> (mặc định 12 giờ).<br>Root: tối đa <b>1 giờ</b>." },
      { t: "sts", f: "Role chaining giới hạn session bao lâu?", b: "Tối đa <b>1 giờ</b>." },
      { t: "sts", f: "STS API nào hỗ trợ MFA?", b: "<b>AssumeRole</b> và <b>GetSessionToken</b>.", x: "AssumeRoleWithSAML, AssumeRoleWithWebIdentity, GetFederationToken không hỗ trợ MFA." },
      { t: "sts", f: "GetFederationToken dùng làm gì? Hạn chế?", b: "<b>Custom identity broker</b>, cho phép <b>SSO vào console</b>. Không gọi IAM API; không gọi STS trừ GetCallerIdentity." },
      { t: "sts", f: "GetSessionToken dùng làm gì?", b: "Bảo vệ API bằng <b>MFA</b> cho IAM user. Không session policy, không SSO console; IAM API chỉ khi kèm MFA." },
      { t: "sts", f: "<code>sts:GetCallerIdentity</code> có gì đặc biệt?", b: "<b>Không cần quyền</b>: kể cả có explicit Deny vẫn gọi được. Lệnh debug “Tôi là ai?”." },
      { t: "sts", f: "STS endpoint: global hay regional?", b: "Mặc định global <code>https://sts.amazonaws.com</code>, có thêm <b>Regional endpoints</b> (giảm độ trễ, dự phòng). Credentials lấy ở Region nào cũng <b>dùng được mọi Region</b>." },
      { t: "sts", f: "AssumeRole cross-account cần hai “nửa” nào?", b: "Identity policy ở <b>Account A</b> Allow <code>sts:AssumeRole</code> trên ARN role + <b>trust policy</b> của role ở <b>Account B</b> tin principal/Account A." },
      { t: "sts", f: "Trust policy có <code>Principal: arn:aws:iam::111122223333:root</code> nghĩa là gì?", b: "Tin <b>cả tài khoản</b> 111122223333 (không chỉ root user); admin của tài khoản đó quyết định ai được AssumeRole bằng identity policy." },
      { t: "sts", f: "Ứng dụng trên EC2 lấy credentials thế nào?", b: "<b>Role gắn qua instance profile</b>; credentials tạm thời có sẵn cho ứng dụng, không lưu key dài hạn." },
      { t: "sts", f: "Vendor SaaS bên thứ ba cần truy cập tài khoản ⇒ ?", b: "<b>Cross-account role + External ID</b> (condition <code>sts:ExternalId</code>) chống <i>confused deputy</i>." },
      { t: "sts", f: "Credentials của role bị lộ ⇒ xử lý thế nào?", b: "<b>Revoke active sessions</b>: gắn inline policy Deny mọi request có <code>aws:TokenIssueTime</code> cũ hơn thời điểm thu hồi.", x: "Credentials đã cấp vẫn hợp lệ tới khi hết hạn nếu chỉ sửa permissions/trust policy." },

      // ---- Federation
      { t: "fed", f: "Best practice cho người dùng là con người truy cập AWS?", b: "<b>Federation với identity provider (IdP)</b> thay vì tạo IAM user riêng lẻ." },
      { t: "fed", f: "IAM Identity Center phù hợp khi nào?", b: "<b>Workforce</b> truy cập <b>nhiều account trong AWS Organizations</b>. Identity source: SAML 2.0, Managed AD, Identity Center directory." },
      { t: "fed", f: "Federation với IAM (IAM identity provider) phù hợp khi nào?", b: "<b>Một account độc lập</b>, triển khai ngắn hạn/quy mô nhỏ, hoặc <b>machine users</b>. Hỗ trợ SAML 2.0, OIDC." },
      { t: "fed", f: "Amazon Cognito identity pools dùng cho ai?", b: "<b>Người dùng ứng dụng</b> cần IAM authorization; hỗ trợ SAML, OIDC, social (Facebook, Google, Amazon), <b>guest</b>." },
      { t: "fed", f: "Cognito user pool khác identity pool?", b: "<b>User pool</b>: sign-up/sign-in.<br><b>Identity pool</b>: đổi token lấy <b>IAM credentials</b> (qua AssumeRoleWithWebIdentity)." },
      { t: "fed", f: "Trust policy của role SAML có Principal và Action gì?", b: "<code>Principal: {“Federated”: “arn:aws:iam::acct:saml-provider/name”}</code>, action <b>sts:AssumeRoleWithSAML</b>.", x: "SAML IdP trong trust policy phải cùng tài khoản với role." },
      { t: "fed", f: "<code>saml:aud</code> là gì? AWS khuyến nghị gì?", b: "URL <b>sign-in endpoint</b>, phải khớp recipient của IdP. Dùng <b>Regional sign-in endpoint</b> (nhiều endpoint) để chịu lỗi." },
      { t: "fed", f: "Tạo thư mục S3 riêng cho từng người dùng SAML dùng biến nào?", b: "<code>${saml:namequalifier}</code> + <code>${saml:sub}</code>, kèm <code>saml:sub_type = persistent</code>.", x: "Giá trị transient đổi mỗi phiên, không dùng làm định danh." },
      { t: "fed", f: "Encrypted SAML assertion được hỗ trợ ở đâu?", b: "<b>IAM SAML federation</b> có. IAM Identity Center và Cognito <b>không</b> hỗ trợ encrypted assertion từ IAM SAML IdP." },
      { t: "fed", f: "OIDC federation: GitHub Actions lấy credentials thế nào?", b: "Nhận <b>JWT</b> từ OIDC IdP ⇒ <b>AssumeRoleWithWebIdentity</b> ⇒ temporary credentials của role least-privilege." },
      { t: "fed", f: "IAM chấp nhận JWT quá hạn thêm bao lâu?", b: "<b>5 phút</b> sau claim <code>exp</code> để bù lệch đồng hồ (clock skew)." },
      { t: "fed", f: "Custom identity broker làm gì?", b: "Tự xác thực người dùng, gọi STS rồi gọi <code>https://signin.aws.amazon.com/federation</code> tạo <b>URL đăng nhập console</b> không cần mật khẩu." },
      { t: "fed", f: "IAM Roles Anywhere dùng khi nào?", b: "Máy <b>ngoài AWS</b> lấy temporary credentials bằng <b>chứng chỉ X.509</b> (PKI có sẵn)." },

      // ---- Access Analyzer
      { t: "aa", f: "<i>Zone of trust</i> trong IAM Access Analyzer là gì?", b: "<b>Organization hoặc account</b> chọn khi tạo analyzer; truy cập từ principal trong đó được coi là tin cậy." },
      { t: "aa", f: "External access analyzer làm gì?", b: "Tìm tài nguyên <b>chia sẻ ra ngoài zone of trust</b> (account khác, public). Mỗi tài nguyên ⇒ một finding." },
      { t: "aa", f: "External access analyzer là Regional hay global?", b: "<b>Regional</b>: phải tạo ở <b>mỗi Region</b> có tài nguyên.", x: "Unused access analyzer thì không phụ thuộc Region." },
      { t: "aa", f: "Internal access analyzer làm gì?", b: "Với tài nguyên quan trọng được chọn (S3, RDS snapshot, DynamoDB…), cho biết <b>principal nào trong org/account</b> truy cập được." },
      { t: "aa", f: "Unused access analyzer tìm gì? Tính phí ra sao?", b: "<b>Unused roles, access keys, passwords</b>, dịch vụ/action không dùng. Phí theo <b>số role/user</b> mỗi tháng." },
      { t: "aa", f: "Policy generation hoạt động thế nào?", b: "Phân tích <b>CloudTrail logs</b> để sinh policy chỉ gồm action thực sự dùng ⇒ least privilege." },
      { t: "aa", f: "Custom policy checks dùng làm gì?", b: "Kiểm tra policy mới có <b>cấp thêm quyền</b> so với bản cũ (<b>CheckNoNewAccess</b>) hoặc cho phép action nhạy cảm." },
      { t: "aa", f: "Policy mới/sửa được Access Analyzer phân tích trong bao lâu?", b: "Khoảng <b>30 phút</b>; quét định kỳ trong <b>24 giờ</b>; có thể Rescan (<code>StartResourceScan</code>)." },

      // ---- Từ khóa
      { t: "kw", f: "Đề có “<i>allowed by IAM policy but still AccessDenied</i>” ⇒ ?", b: "Tìm <b>explicit Deny</b>, hoặc <b>SCP / boundary / session policy</b> thiếu Allow." },
      { t: "kw", f: "Đề có “<i>delegate IAM administration without privilege escalation</i>” ⇒ ?", b: "<b>Permissions boundary</b> + condition <b>iam:PermissionsBoundary</b>." },
      { t: "kw", f: "Đề có “<i>limit an assumed-role session to a subset of the role's permissions</i>” ⇒ ?", b: "<b>Session policy</b>." },
      { t: "kw", f: "Đề có “<i>corporate Active Directory, SSO, multiple accounts</i>” ⇒ ?", b: "<b>IAM Identity Center</b>." },
      { t: "kw", f: "Đề có “<i>SAML 2.0 IdP, single account</i>” ⇒ ?", b: "<b>IAM SAML provider + AssumeRoleWithSAML</b>." },
      { t: "kw", f: "Đề có “<i>GitHub Actions / external CI without long-term keys</i>” ⇒ ?", b: "<b>IAM OIDC provider + AssumeRoleWithWebIdentity</b>." },
      { t: "kw", f: "Đề có “<i>mobile app, social identity providers, guest users</i>” ⇒ ?", b: "<b>Amazon Cognito identity pools</b>." },
      { t: "kw", f: "Đề có “<i>require MFA for CLI/API calls by IAM users</i>” ⇒ ?", b: "<b>GetSessionToken</b> kèm MFA + condition <code>aws:MultiFactorAuthPresent</code>." },
      { t: "kw", f: "Đề có “<i>allow all accounts in our organization, without listing each account ID</i>” ⇒ ?", b: "Bucket policy với condition <b>aws:PrincipalOrgID</b>." },
      { t: "kw", f: "Đề có “<i>resources shared outside the organization/account</i>” ⇒ ?", b: "<b>IAM Access Analyzer external access</b> (bật ở mọi Region)." },
      { t: "kw", f: "Đề có “<i>least-privilege policy based on the role's activity over the last 90 days</i>” ⇒ ?", b: "<b>Policy generation</b> từ CloudTrail." },
      { t: "kw", f: "Đề có “<i>maximum permissions</i>”, “<i>guardrail</i>”, “<i>cannot exceed</i>” ⇒ nghĩ tới gì?", b: "<b>Boundary / SCP / RCP / session policy</b> (không cấp quyền).", x: "Thấy “grant”, “allow access” ⇒ phải có identity-based hoặc resource-based policy." }
    ],

    pairs: [
      ["Implicit deny", "Không có Allow ⇒ mặc định từ chối"],
