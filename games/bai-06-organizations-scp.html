  <!-- Dữ liệu trò chơi, rút từ lessons/bai-06-organizations-scp.html (định dạng: xem assets/games.js) -->
  <script>
  window.DECK = {
    topics: [
      { id: "org", name: "Multi-account & Organizations" },
      { id: "struct", name: "Cấu trúc & quota" },
      { id: "bill", name: "Consolidated billing" },
      { id: "scp", name: "Service control policy (SCP)" },
      { id: "pol", name: "Policy khác & dịch vụ tích hợp" },
      { id: "ct", name: "AWS Control Tower" },
      { id: "idc", name: "IAM Identity Center" },
      { id: "kw", name: "Từ khóa đề ⇒ đáp án" }
    ],

    cards: [
      // ---- Multi-account & Organizations
      { t: "org", f: "Vì sao AWS khuyến nghị multi-account environment?", b: "AWS account là <b>ranh giới tự nhiên</b> cho quyền, bảo mật, chi phí, workload:<br>• <b>billing boundary</b> rõ ràng<br>• <b>cô lập tài nguyên</b>, giảm <i>blast radius</i><br>• linh hoạt cho đội nhóm" },
      { t: "org", f: "AWS account khác IAM user thế nào?", b: "<b>Account</b> = container chứa tài nguyên, có quản trị truy cập + billing.<br><b>User</b> = định danh tạo bằng IAM (IAM user hoặc IAM role). Một account chứa nhiều user/role." },
      { t: "org", f: "AWS Organizations là dịch vụ global hay regional?", b: "<b>Global</b>, vật lý đặt tại <b>us-east-1</b> (N. Virginia)." },
      { t: "org", f: "Một member account có thể thuộc mấy organization cùng lúc?", b: "<b>Một</b> organization tại một thời điểm." },
      { t: "org", f: "Tạo account bằng lập trình và cấp sẵn tài nguyên cho account mới bằng gì?", b: "Tạo bằng <b>CLI/SDK/API</b> (CreateAccount); cấp tài nguyên, quyền khuyến nghị bằng <b>CloudFormation StackSets</b>." },
      { t: "org", f: "Tách dev/test/prod để giới hạn blast radius: nhiều VPC trong một account hay nhiều account?", b: "<b>Nhiều AWS account</b> trong cùng organization.", x: "Nhiều VPC hay nhiều IAM group trong một account không phải đáp án." },

      // ---- Cấu trúc
      { t: "struct", f: "Một organization gồm những thành phần nào?", b: "<b>1 management account</b>, 0+ member account, 0+ OU, 0+ policy; xếp theo cây <b>root → OU → account</b>." },
      { t: "struct", f: "Root (Organizations) là gì? Có bao nhiêu root?", b: "Container cao nhất của cây, nằm trong management account. <b>Đúng 1 root</b>, tạo tự động.", x: "Không nhầm với root user của account." },
      { t: "struct", f: "OU lồng tối đa mấy cấp? Tối đa bao nhiêu OU?", b: "<b>5 cấp</b> dưới root · <b>2.000 OU</b>/organization." },
      { t: "struct", f: "Management account có vai trò gì?", b: "Tạo organization, là <b>payer account</b>, “chủ sở hữu cuối cùng”; <b>chỉ nó</b> tạo account mới và mời account khác.", x: "Không đổi được account nào là management account." },
      { t: "struct", f: "Delegated administrator là gì? Có mấy loại?", b: "<b>Member account</b> được management account ủy quyền.<br>2 loại: cho <b>Organizations</b> (quản lý/gắn policy) và cho <b>một AWS service</b> (GuardDuty, Security Hub, IAM Access Analyzer…)." },
      { t: "struct", f: "Vì sao không nên đặt workload trong management account?", b: "Vì <b>SCP không giới hạn</b> bất kỳ user/role nào trong management account.", x: "Chuyển workload ra member account, dùng delegated administrator cho dịch vụ bảo mật." },
      { t: "struct", f: "Hai feature set của Organizations?", b: "<b>Consolidated billing</b>: chỉ thanh toán chung, không có SCP/RCP.<br><b>All features</b> (mặc định, khuyến nghị): billing + policy + tích hợp dịch vụ." },
      { t: "struct", f: "Nâng cấp từ Consolidated billing lên All features cần gì?", b: "Mọi <b>invited member account phải chấp nhận</b> (handshake ENABLE_ALL_FEATURES, hết hạn sau <b>90 ngày</b>)." },
      { t: "struct", f: "Account tạo mới từ Organizations có sẵn role nào?", b: "<b>OrganizationAccountAccessRole</b>: role quản trị tin cậy management account, admin truy cập bằng AssumeRole.", x: "Account được MỜI vào thì không tự có role này." },
      { t: "struct", f: "Lời mời (INVITE) hết hạn sau bao lâu?", b: "<b>15 ngày</b>. Tối đa <b>20 lời mời</b>/24 giờ (hoặc bằng max account nếu lớn hơn)." },
      { t: "struct", f: "Quota mặc định số account trong organization?", b: "<b>10</b>, adjustable qua Service Quotas (chỉ management account yêu cầu).", x: "Lời mời đang chờ cũng tính vào quota." },
      { t: "struct", f: "Account tạo trong organization phải tồn tại bao lâu mới gỡ ra được?", b: "Tối thiểu <b>4 ngày</b>. Tạo đồng thời tối đa <b>5 account</b>." },
      { t: "struct", f: "Nên thiết kế OU theo tiêu chí nào?", b: "Theo <b>chức năng / mức kiểm soát</b> (Security, Infrastructure, Workloads-Prod, Workloads-NonProd, Sandbox, Suspended…), <b>không</b> theo sơ đồ nhân sự.", x: "Policy gắn theo OU ⇒ account cần cùng bộ control thì để cùng OU." },

      // ---- Billing
      { t: "bill", f: "4 lợi ích của consolidated billing?", b: "<b>One bill</b> · <b>Easy tracking</b> · <b>Combined usage</b> (volume discount, RI, Savings Plans) · <b>No extra fee</b>." },
      { t: "bill", f: "Combined usage giúp giảm chi phí thế nào?", b: "Coi cả organization như <b>một account</b> khi tính bậc giá theo khối lượng; discount <b>RI/Savings Plans</b> của account này áp được cho account khác." },
      { t: "bill", f: "Khi nào consolidated billing ra nhiều hóa đơn?", b: "Khi các account thuộc nhiều <b>seller of record (SOR)</b>: mỗi SOR một hóa đơn." },
      { t: "bill", f: "Một business unit không được chia sẻ RI discount với đơn vị khác ⇒ làm gì?", b: "Management account <b>tắt RI/Savings Plans discount sharing</b> cho account đó trong Billing preferences." },
      { t: "bill", f: "Member account rời organization thì dữ liệu Cost Explorer thời gian trong tổ chức ra sao?", b: "Member <b>không còn xem được</b>; dữ liệu <b>không bị xóa</b>, management account vẫn xem được." },

      // ---- SCP
      { t: "scp", f: "SCP là gì?", b: "Organization policy đặt <b>trần quyền tối đa</b> (permission guardrail) cho IAM user/role trong organization.", x: "SCP <b>không cấp quyền</b>." },
      { t: "scp", f: "Điều kiện để dùng SCP?", b: "Organization bật <b>All features</b> và <b>enable policy type SCP</b>." },
      { t: "scp", f: "SCP ảnh hưởng tới ai?", b: "Mọi IAM user/role của <b>member account</b>, <b>root user</b> của member account, member làm delegated admin, kể cả user có <b>AdministratorAccess</b>." },
      { t: "scp", f: "SCP KHÔNG ảnh hưởng tới ai?", b: "• <b>Management account</b><br>• <b>Service-linked role</b><br>• Principal <b>ngoài organization</b> (kể cả qua resource-based policy ⇒ dùng RCP)<br>• vài tác vụ đặc biệt của root (Enterprise Support…)" },
      { t: "scp", f: "Effective permissions khi có SCP?", b: "<b>Giao</b> giữa những gì SCP + RCP cho phép và những gì identity-based/resource-based policy cho phép." },
      { t: "scp", f: "Quy tắc kế thừa Allow của SCP qua cây?", b: "Allow phải có <b>ở MỌI cấp</b> trên đường đi root → OU → account (deny-by-default)." },
      { t: "scp", f: "Quy tắc kế thừa Deny của SCP qua cây?", b: "Chỉ cần <b>MỘT cấp</b> Deny là chặn mọi OU/account bên dưới, bất kể cấp dưới Allow gì." },
      { t: "scp", f: "FullAWSAccess là gì?", b: "SCP AWS managed <b>Allow mọi dịch vụ, mọi action</b>, tự gắn vào mọi root/OU/account khi bật SCP." },
      { t: "scp", f: "Gỡ FullAWSAccess mà không thay bằng SCP có Allow thì sao?", b: "<b>Mọi action</b> từ member account bên dưới đều <b>thất bại</b>." },
      { t: "scp", f: "Giới hạn kích thước và số lượng SCP?", b: "<b>10.240 ký tự</b>/SCP · tối thiểu 1, tối đa <b>10 SCP gắn trực tiếp</b> mỗi root/OU/account · <b>10.000 SCP</b>/organization.", x: "Policy kế thừa không tính vào giới hạn 10; không gỡ được SCP cuối cùng." },
      { t: "scp", f: "SCP gắn được vào đâu?", b: "Chỉ <b>root, OU, account</b>.", x: "Không gắn được vào IAM user/group/role." },
      { t: "scp", f: "Deny list strategy khác allow list strategy thế nào?", b: "<b>Deny list</b>: giữ FullAWSAccess + thêm Deny; dịch vụ mới tự được phép, ít bảo trì.<br><b>Allow list</b>: thay FullAWSAccess bằng Allow tập dịch vụ duyệt; dịch vụ mới bị chặn, chặt hơn." },
      { t: "scp", f: "Mẫu SCP chặn Region ngoài danh sách duyệt?", b: "<b>Deny</b> + <code>NotAction</code> các dịch vụ global (iam, organizations, route53, cloudfront, sts…) + <code>StringNotEquals aws:RequestedRegion</code>." },
      { t: "scp", f: "Tắt policy type SCP ở root rồi bật lại thì sao?", b: "Tắt ⇒ mọi SCP tự <b>detach</b>. Bật lại ⇒ chỉ còn <b>FullAWSAccess</b>, attachment cũ <b>không tự khôi phục</b>." },
      { t: "scp", f: "Cách an toàn để triển khai SCP mới?", b: "Tạo <b>OU thử nghiệm</b>, chuyển dần account vào; dùng <b>service last accessed data</b> hoặc CloudTrail để biết dịch vụ đang dùng." },
      { t: "scp", f: "Root: FullAWSAccess + Deny S3; OU Test chỉ “Allow S3”. Account trong OU Test có quyền gì?", b: "<b>Không có quyền gì</b>: S3 bị root Deny, dịch vụ khác không được OU Test Allow (Scenario 6)." },
      { t: "scp", f: "Root chỉ có SCP Deny, không có FullAWSAccess ⇒ kết quả?", b: "Mọi member account <b>không truy cập được dịch vụ nào</b> (Scenario 3)." },

      // ---- Policy khác
      { t: "pol", f: "Hai nhóm organization policy?", b: "<b>Authorization</b>: SCP, RCP (bảo mật).<br><b>Declarative</b>: tag, backup, AI opt-out, EC2 declarative, chat applications… (cấu hình dịch vụ)." },
      { t: "pol", f: "RCP khác SCP thế nào?", b: "<b>SCP</b>: trần quyền <i>principal-centric</i>.<br><b>RCP</b>: trần quyền <i>resource-centric</i>, vd chỉ identity trong tổ chức truy cập tài nguyên.", x: "Bật RCP ⇒ RCPFullAWSAccess tự gắn, không gỡ được. RCP tối đa 5.120 ký tự, 5 RCP/entity." },
      { t: "pol", f: "Declarative policy kế thừa có giống SCP không?", b: "<b>Không.</b> Có cơ chế kế thừa riêng; và gắn ở root thì <b>áp cả management account</b>." },
      { t: "pol", f: "Organization trail của CloudTrail có đặc điểm gì?", b: "Ghi log hoạt động <b>mọi account</b>; member account <b>không tắt hay sửa được</b>." },
      { t: "pol", f: "AWS RAM dùng để làm gì trong organization?", b: "<b>Chia sẻ tài nguyên</b> giữa các account, vd tạo VPC subnet một lần rồi share cho cả tổ chức." },
      { t: "pol", f: "Trusted access là gì?", b: "Cho phép dịch vụ AWS (CloudTrail, Config, Backup, RAM, GuardDuty…) <b>làm việc trên mọi account</b> của tổ chức." },

      // ---- Control Tower
      { t: "ct", f: "AWS Control Tower là gì?", b: "Cách đơn giản để <b>dựng và quản trị môi trường multi-account</b> theo best practice prescriptive; điều phối <b>Organizations, Service Catalog, IAM Identity Center</b>.", x: "Dựng landing zone trong chưa tới một giờ." },
      { t: "ct", f: "4 thành phần chính của Control Tower?", b: "<b>Landing zone</b> · <b>Controls (guardrails)</b> · <b>Account Factory</b> · <b>Dashboard</b>." },
      { t: "ct", f: "Account Factory là gì?", b: "“<b>Vending machine</b>” cấp account theo mẫu cấu hình đã duyệt, xây trên <b>AWS Service Catalog</b>." },
      { t: "ct", f: "Khi dựng landing zone, Control Tower tạo gì?", b: "<b>Security OU</b> (Log Archive + Audit account ở v3.3 trở về trước), Sandbox OU (tùy chọn), directory trong <b>IAM Identity Center</b>, áp mọi <b>mandatory</b> preventive & detective controls." },
      { t: "ct", f: "3 loại control và cơ chế bên dưới?", b: "<b>Preventive</b> ⇒ SCP/RCP<br><b>Detective</b> ⇒ AWS Config rules<br><b>Proactive</b> ⇒ CloudFormation hooks" },
      { t: "ct", f: "3 mức hướng dẫn của control?", b: "<b>Mandatory</b> (luôn bật, không tắt được) · <b>Strongly recommended</b> · <b>Elective</b> (tùy chọn, bật/tắt được)." },
      { t: "ct", f: "Control Tower triển khai tài nguyên vào account bằng gì?", b: "<b>CloudFormation StackSets</b>: một stack instance cho mỗi account và Region." },
      { t: "ct", f: "Preventive control có áp cho management account không?", b: "<b>Không.</b> Ngoài management account, control áp cho toàn tổ chức." },

      // ---- Identity Center
      { t: "idc", f: "AWS IAM Identity Center là gì? Tên cũ?", b: "Kết nối <b>workforce users</b> với AWS account và AWS managed application. Tên cũ <b>AWS Single Sign-On</b> (đổi 26/7/2022).", x: "CLI vẫn giữ namespace <code>sso</code>, <code>aws configure sso</code>." },
      { t: "idc", f: "Organization instance khác account instance thế nào?", b: "<b>Organization instance</b>: ở management account, <b>duy nhất</b> quản lý được truy cập AWS accounts.<br><b>Account instance</b>: chỉ cho một số AWS managed application, không quản lý multi-account." },
      { t: "idc", f: "3 lựa chọn identity source?", b: "<b>Identity Center directory</b> (mặc định) · <b>Active Directory</b> (AWS Managed Microsoft AD / AD Connector) · <b>External IdP</b> (Okta, Entra ID; SAML 2.0 + SCIM).", x: "Mỗi organization chỉ 1 identity source; Simple AD không được hỗ trợ." },
      { t: "idc", f: "Permission set là gì?", b: "<b>Template</b> tập IAM policy; gán cho user/group trên account ⇒ Identity Center <b>tạo IAM role</b> trong mỗi account đó." },
      { t: "idc", f: "Account assignment gồm những gì?", b: "<b>(User hoặc group) + permission set + AWS account</b>." },
      { t: "idc", f: "Session duration của permission set?", b: "Mặc định <b>1 giờ</b>, tối đa <b>12 giờ</b>. Phiên access portal mặc định <b>8 giờ</b> (tối đa 90 ngày)." },
      { t: "idc", f: "Role do Identity Center tạo có bị SCP giới hạn không?", b: "<b>Có.</b> Permission set không “miễn” SCP." },

      // ---- Từ khóa
      { t: "kw", f: "Đề có “<i>centrally manage multiple AWS accounts</i>”, “<i>single bill</i>” ⇒ ?", b: "<b>AWS Organizations</b> (consolidated billing)." },
      { t: "kw", f: "Đề có “<i>share a VPC subnet / Transit Gateway with other accounts</i>” ⇒ ?", b: "<b>AWS Resource Access Manager (RAM)</b>." },
      { t: "kw", f: "Đề có “<i>prevent ANY user, including the root user, in member accounts</i>” ⇒ ?", b: "<b>SCP Deny</b> gắn ở OU/root." },
      { t: "kw", f: "Đề có “<i>restrict all accounts to specific AWS Regions</i>” ⇒ ?", b: "<b>SCP Deny + aws:RequestedRegion</b> (NotAction dịch vụ global)." },
      { t: "kw", f: "Đề có “<i>developers have AdministratorAccess but cannot do X in production</i>” ⇒ ?", b: "<b>SCP Deny ở OU Production</b>: SCP đè lên cả AdministratorAccess." },
      { t: "kw", f: "Đề có “<i>administrator needs access to a newly created member account</i>” ⇒ ?", b: "Assume <b>OrganizationAccountAccessRole</b> từ management account." },
      { t: "kw", f: "Đề có “<i>company acquired another company, wants one bill</i>” ⇒ ?", b: "<b>Mời</b> các account vào organization (invitation); tài nguyên giữ nguyên." },
      { t: "kw", f: "Đề có “<i>centralize CloudTrail logs, member accounts must not disable</i>” ⇒ ?", b: "<b>Organization trail</b> ghi về S3 ở account Log Archive." },
      { t: "kw", f: "Đề có “<i>only identities in our organization can access our S3 buckets, across all accounts</i>” ⇒ ?", b: "<b>RCP</b> (hoặc bucket policy với <code>aws:PrincipalOrgID</code> từng bucket)." },
      { t: "kw", f: "Đề có “<i>security team manages GuardDuty for all accounts without the management account</i>” ⇒ ?", b: "<b>Delegated administrator</b>." },
      { t: "kw", f: "Đề có “<i>multi-account setup following best practices QUICKLY, LEAST operational overhead</i>” ⇒ ?", b: "<b>AWS Control Tower</b> (landing zone)." },
      { t: "kw", f: "Đề có “<i>self-service account vending with pre-approved configurations</i>” ⇒ ?", b: "<b>Account Factory</b> (Control Tower)." },
      { t: "kw", f: "Đề có “<i>detect</i>” / “<i>prevent</i>” / “<i>block before CloudFormation creates</i>” ⇒ ?", b: "<b>Detective</b> (Config) / <b>Preventive</b> (SCP) / <b>Proactive</b> (CloudFormation hooks)." },
      { t: "kw", f: "Đề có “<i>employees sign in once with corporate credentials, access multiple AWS accounts</i>” ⇒ ?", b: "<b>IAM Identity Center</b> + identity source AD/IdP + permission sets." },
      { t: "kw", f: "Đề có “<i>users of a mobile/web application (customers) sign in</i>” ⇒ ?", b: "<b>Amazon Cognito</b> (Bài 7), không phải Identity Center.", x: "Identity Center dành cho workforce." },
      { t: "kw", f: "Đề có “<i>enforce consistent tags</i>” / “<i>enforce backup plans</i>” across accounts ⇒ ?", b: "<b>Tag policies</b> / <b>Backup policies</b>." }
    ],

    pairs: [
      ["AWS Organizations", "Quản lý tập trung account, policy, billing"],
      ["Root (Organizations)", "Container cao nhất của cây, mỗi org đúng một"],
      ["Organizational unit (OU)", "Nhóm account/OU con, tối đa 5 cấp dưới root"],
      ["Management account", "Tạo org, payer, không bị SCP giới hạn"],
      ["Member account", "Mọi account khác trong organization"],
      ["Delegated administrator", "Member account được ủy quyền quản lý dịch vụ/policy"],
      ["Consolidated billing", "Một hóa đơn, gộp usage, chia sẻ discount"],
      ["All features", "Feature set đầy đủ: billing + policy + tích hợp"],
      ["Handshake", "Cơ chế trao đổi an toàn giữa hai account"],
      ["OrganizationAccountAccessRole", "Role quản trị trong account tạo mới"],
      ["Service control policy (SCP)", "Trần quyền cho principal của member account"],
      ["Resource control policy (RCP)", "Trần quyền resource-centric cho tài nguyên"],
      ["FullAWSAccess", "SCP managed cho phép tất cả, tự gắn khi bật SCP"],
      ["Permission guardrail", "Giới hạn quyền tối đa, không cấp quyền"],
