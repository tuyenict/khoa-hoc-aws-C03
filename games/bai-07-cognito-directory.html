  <!-- Dữ liệu trò chơi, rút từ lessons/bai-07-cognito-directory.html (định dạng: xem assets/games.js) -->
  <script>
  window.DECK = {
    topics: [
      { id: "big", name: "Ai đăng nhập, vào đâu?" },
      { id: "up", name: "Cognito user pool" },
      { id: "use", name: "API Gateway · ALB · AppSync · M2M" },
      { id: "ip", name: "Cognito identity pool" },
      { id: "mad", name: "AWS Managed Microsoft AD" },
      { id: "adc", name: "AD Connector & Simple AD" },
      { id: "kw", name: "Từ khóa đề ⇒ đáp án" }
    ],

    cards: [
      // ---- Bức tranh tổng thể
      { t: "big", f: "Ba “thế giới định danh” mà đề SAA-C03 hay trộn lẫn?", b: "<b>Workforce vào AWS account</b> ⇒ IAM Identity Center<br><b>Customer / app users</b> ⇒ Amazon Cognito<br><b>Windows/AD workloads</b> ⇒ AWS Directory Service" },
      { t: "big", f: "Amazon Cognito phục vụ ai? (CIAM là gì?)", b: "Người dùng của <b>web &amp; mobile app</b> – <b>CIAM</b> (Customer identity and access management), scale tới hàng triệu, hỗ trợ social login." },
      { t: "big", f: "Có nên tạo IAM user cho khách hàng của ứng dụng?", b: "<b>Không bao giờ.</b> IAM user dành cho định danh quản trị AWS; khách hàng dùng Cognito.", x: "“Create an IAM user per customer”, “embed access keys in the app” ⇒ loại ngay." },
      { t: "big", f: "Cognito khác IAM Identity Center thế nào?", b: "<b>Cognito</b>: người dùng của <b>ứng dụng</b> (CIAM).<br><b>IAM Identity Center</b>: <b>nhân sự</b> truy cập nhiều AWS account / ứng dụng doanh nghiệp.", x: "Cả hai đều “SSO” và nối được SAML IdP – đừng để bị lừa." },
      { t: "big", f: "Theo tài liệu Directory Service, SaaS app scale lớn cần social identity nên dùng gì?", b: "<b>Amazon Cognito</b>, không phải Directory Service." },

      // ---- User pool
      { t: "up", f: "Cognito user pool là gì?", b: "<b>User directory</b> dựa trên chuẩn <b>OpenID Connect (OIDC)</b>, xác thực người dùng và cấp <b>JWT</b> cho app/API (<i>authentication</i>)." },
      { t: "up", f: "Hai vai trò user pool có thể đóng cùng lúc?", b: "<b>Standalone OIDC IdP</b>: lưu local users (nguồn authoritative).<br><b>Service provider / relying party</b> tới IdP bên thứ ba (Google, Facebook, Apple, Amazon, SAML, OIDC) – gom về một định dạng JWT của riêng bạn." },
      { t: "up", f: "Ba loại token của user pool?", b: "<b>ID token</b>: danh tính (username, email…).<br><b>Access token</b>: scope để gọi API.<br><b>Refresh token</b>: lấy ID + access token mới; opaque, thu hồi được." },
      { t: "up", f: "Thời hạn refresh token mặc định và khoảng cấu hình?", b: "Mặc định <b>30 ngày</b>, chỉnh từ <b>60 phút đến 10 năm</b>." },
      { t: "up", f: "Thời hạn ID/access token mặc định?", b: "Mặc định <b>1 giờ</b> (cấu hình <b>5 phút – 1 ngày</b>).", x: "Khuyến nghị dùng ~75% thời gian sống rồi mới lấy token mới và cache token." },
      { t: "up", f: "Refresh token rotation hoạt động thế nào?", b: "Mỗi lần refresh trả <b>refresh token mới</b>, token cũ vô hiệu (grace period tối đa <b>60 giây</b>).", x: "Rotation KHÔNG kéo dài thời hạn gốc của phiên." },
      { t: "up", f: "Đăng xuất người dùng khỏi mọi thiết bị bằng API nào?", b: "<code>GlobalSignOut</code> / <code>AdminUserGlobalSignOut</code>. Revoke một refresh token = đăng xuất một phiên." },
      { t: "up", f: "Ba feature plan của user pool?", b: "<b>Lite</b>: cơ bản, chi phí thấp.<br><b>Essentials</b> (<b>mặc định</b>): managed login, passwordless, passkey, email MFA, tùy biến access token.<br><b>Plus</b>: Essentials + <b>threat protection</b>." },
      { t: "up", f: "Cognito tính phí theo gì?", b: "<b>Monthly active users (MAU)</b> và tính năng dùng. Plan áp cho cả user pool, đổi được bất cứ lúc nào." },
      { t: "up", f: "Plus plan (threat protection) thêm gì?", b: "Phát hiện <b>compromised credentials</b>, đăng nhập bất thường – <b>adaptive authentication</b>; log/export hoạt động kèm <b>risk score</b>.", x: "Tên cũ: advanced security features." },
      { t: "up", f: "Lambda trigger của Cognito phải trả lời trong bao lâu?", b: "<b>5 giây</b> (không đổi được). Hàm trả lỗi ⇒ bước đó thất bại – cách chặn có chủ đích." },
      { t: "up", f: "Chỉ cho đăng ký bằng email công ty ⇒ trigger nào?", b: "<b>Pre sign-up</b> Lambda trigger (cũng dùng để auto-confirm)." },
      { t: "up", f: "Thêm/sửa/ẩn claim trong token ⇒ trigger nào?", b: "<b>Pre token generation</b>.", x: "Tùy biến access token cần plan khác Lite." },
      { t: "up", f: "Di chuyển user cũ sang user pool mà giữ nguyên mật khẩu?", b: "<b>Migrate user</b> Lambda trigger – just-in-time migration khi sign-in/quên mật khẩu.", x: "Import CSV KHÔNG mang theo mật khẩu ⇒ user phải reset." },
      { t: "up", f: "Tự xây CAPTCHA / câu hỏi bí mật khi đăng nhập ⇒ trigger nào?", b: "<b>Define / Create / Verify auth challenge</b> (custom authentication flow)." },
      { t: "up", f: "MFA, threat protection có áp dụng cho federated users không?", b: "<b>Không.</b> Federated users được IdP gốc (Google, Okta…) xác thực." },
      { t: "up", f: "Các phương thức MFA của user pool?", b: "<b>SMS, TOTP</b> (authenticator app), <b>email OTP</b> hoặc thiết bị của user.", x: "Email MFA cần Essentials trở lên." },
      { t: "up", f: "Token user pool có phải AWS credentials không?", b: "<b>Không.</b> Là JWT. Muốn gọi S3/DynamoDB bằng SigV4 phải đổi qua <b>identity pool</b>." },

      // ---- Dùng token
      { t: "use", f: "Bảo vệ REST API trên API Gateway bằng user pool thế nào?", b: "<b>Cognito user pool authorizer</b>: API Gateway tự xác minh JWT, kiểm tra scope; thiếu/sai token ⇒ <b>401</b>, back end không cần code kiểm tra." },
      { t: "use", f: "ALB xác thực người dùng bằng action nào?", b: "<code>authenticate-cognito</code> (user pool) hoặc <code>authenticate-oidc</code> (IdP OIDC bất kỳ).", x: "Chỉ hỗ trợ trên <b>HTTPS listener</b>; không có trên NLB." },
      { t: "use", f: "Yêu cầu với app client khi dùng ALB authenticate-cognito?", b: "Có <b>client secret</b>, dùng <b>authorization code grant</b>, scope trả về ID token (vd <code>openid</code>)." },
      { t: "use", f: "Cookie và thời hạn phiên của ALB authenticate?", b: "Cookie <b>AWSELB</b>; SessionTimeout mặc định <b>7 ngày</b>. Phải đăng nhập xong trong <b>15 phút</b>, nếu không ⇒ 401." },
      { t: "use", f: "ALB chuyển claim người dùng tới target qua header nào?", b: "<code>x-amzn-oidc-data</code> (JWT ký ES256), <code>x-amzn-oidc-accesstoken</code>, <code>x-amzn-oidc-identity</code>." },
      { t: "use", f: "Ba giá trị OnUnauthenticatedRequest của ALB?", b: "<b>authenticate</b> (mặc định, chuyển tới IdP) · <b>allow</b> (cho qua, không claim) · <b>deny</b> (trả 401, hợp SPA gọi AJAX)." },
      { t: "use", f: "AppSync dùng Cognito theo hai chế độ nào?", b: "<code>AMAZON_COGNITO_USER_POOLS</code> (token user pool) hoặc <code>AWS_IAM</code> (credentials từ identity pool)." },
      { t: "use", f: "M2M trong user pool hoạt động thế nào?", b: "App client có client secret + grant <b>client_credentials</b>; Cognito chỉ cấp <b>access token</b> (không ID, không refresh), mang <b>custom scopes</b> của resource server.", x: "Lưu lượng lớn ⇒ cache token để tránh chạm quota token endpoint." },

      // ---- Identity pool
      { t: "ip", f: "Cognito identity pool làm gì?", b: "Đổi token đáng tin cậy (user pool, social, SAML, OIDC) lấy <b>temporary AWS credentials</b> qua <b>STS</b> để app gọi trực tiếp S3, DynamoDB… (<i>authorization</i>)." },
      { t: "ip", f: "Identity pool có bắt buộc đi cùng user pool không?", b: "<b>Không.</b> Hai thành phần độc lập; identity pool nhận token trực tiếp từ Google/SAML/OIDC được." },
      { t: "ip", f: "Unauthenticated (guest) identity là gì?", b: "Khách chưa đăng nhập vẫn nhận identity ID + credentials giới hạn. Phải bật <b>Guest access</b> và gán <b>unauthenticated role</b> quyền rất hẹp." },
      { t: "ip", f: "Developer-authenticated identities là gì?", b: "Authenticated identity do <b>back end xác thực của riêng bạn</b> (developer provider)." },
      { t: "ip", f: "Role-based access control trong identity pool chọn role thế nào?", b: "<b>Default role</b>; <b>role theo rule</b> (so khớp claim, tối đa <b>25 rule/provider</b>); hoặc <b>role theo group</b> (<code>cognito:preferred_role</code>)." },
      { t: "ip", f: "ABAC trong identity pool hoạt động thế nào?", b: "Ánh xạ attribute trong claim thành <b>principal tags</b> của phiên STS; policy dùng điều kiện <code>aws:PrincipalTag</code>. Mặc định map <code>sub</code> và <code>aud</code>." },
      { t: "ip", f: "Mỗi user chỉ truy cập prefix S3 của riêng mình ⇒ policy variable nào?", b: "<code>${cognito-identity.amazonaws.com:sub}</code> trong policy của <b>authenticated role</b> (hoặc ABAC principal tags)." },
      { t: "ip", f: "Trust policy của role cho identity pool cần gì?", b: "Principal <code>cognito-identity.amazonaws.com</code>, action <code>sts:AssumeRoleWithWebIdentity</code>, điều kiện <code>aud</code> = đúng identity pool, <code>amr</code> = authenticated." },
      { t: "ip", f: "Enhanced flow khác basic (classic) flow?", b: "<b>Enhanced</b> (mặc định): identity pool chọn role.<br><b>Basic</b>: bỏ qua lựa chọn role, app tự gọi <code>AssumeRoleWithWebIdentity</code>; phải chủ động bật." },
      { t: "ip", f: "Quy tắc nhớ user pool vs identity pool?", b: "<b>Authentication</b> ⇒ user pool.<br><b>Authorization tới tài nguyên AWS</b> ⇒ identity pool." },
      { t: "ip", f: "Khi nào chỉ cần user pool, không cần identity pool?", b: "App chỉ gọi <b>API của bạn</b> (API Gateway, ALB, AppSync, back end) – các dịch vụ này hiểu JWT." },
      { t: "ip", f: "Khi nào dùng cả user pool lẫn identity pool?", b: "App vừa <b>đăng nhập người dùng</b> vừa cần <b>truy cập trực tiếp</b> S3/DynamoDB/IoT/Kinesis." },

      // ---- Managed Microsoft AD
      { t: "mad", f: "AWS Managed Microsoft AD là gì?", b: "<b>Microsoft AD thật</b> (Windows Server 2019) do AWS vận hành, chạy trong VPC của bạn; AWS lo giám sát, replicate, snapshot hằng ngày, vá phần mềm." },
      { t: "mad", f: "Managed Microsoft AD triển khai tối thiểu bao nhiêu DC?", b: "<b>2 domain controller</b> ở <b>2 AZ khác nhau</b>; thêm DC để scale." },
      { t: "mad", f: "Standard vs Enterprise Edition?", b: "<b>Standard</b>: tới ~5.000 nhân viên, ~<b>30.000</b> objects.<br><b>Enterprise</b>: ~<b>500.000</b> objects, hỗ trợ <b>multi-Region replication</b>." },
      { t: "mad", f: "Hybrid Edition dùng để làm gì?", b: "Mở rộng <b>AD self-managed hiện có</b> lên AWS, không đồng bộ định danh, dùng credentials hiện có." },
      { t: "mad", f: "Managed Microsoft AD hỗ trợ những loại trust nào?", b: "<b>External</b> và <b>forest</b>, theo <b>one-way incoming / outgoing</b> và <b>two-way</b>." },
      { t: "mad", f: "Dịch vụ nào bắt buộc two-way trust?", b: "AWS Enterprise Apps: <b>WorkSpaces, QuickSight, Chime, Connect, WorkDocs, WorkMail, IAM Identity Center, Management Console</b>.", x: "EC2, RDS, FSx chạy được với one-way hoặc two-way." },
      { t: "mad", f: "Điều kiện để lập trust với AD on-premises?", b: "Kết nối <b>VPN / Direct Connect</b>, mở port AD, bật Kerberos pre-authentication, DNS conditional forwarder hai phía, NetBIOS/domain name khác nhau." },
      { t: "mad", f: "Resource forest là mô hình gì?", b: "Định danh ở lại AD hiện có; forest trên AWS quản lý tài nguyên AWS – cô lập vận hành mà vẫn SSO." },
      { t: "mad", f: "Multi-Region replication của Managed AD có đặc điểm gì?", b: "Chỉ <b>Enterprise</b>; replicate toàn bộ (user, group, GPO, trust, schema), mỗi Region mới có <b>2 DC</b>, giữ nguyên <b>directory_id</b>." },
      { t: "mad", f: "Directory sharing cho phép gì?", b: "Chia sẻ Managed AD cho <b>AWS account khác</b> để domain join EC2 từ nhiều account.", x: "AD Connector KHÔNG chia sẻ được." },
      { t: "mad", f: "RDS for SQL Server / FSx for Windows cần Windows Authentication ⇒ directory nào?", b: "<b>AWS Managed Microsoft AD</b>. AD Connector và Simple AD không tương thích RDS SQL Server." },

      // ---- AD Connector & Simple AD
      { t: "adc", f: "AD Connector là gì?", b: "<b>Directory gateway (proxy)</b> chuyển yêu cầu về AD on-premises, <b>không cache</b> thông tin nào trên cloud; chỉ cần một service account." },
      { t: "adc", f: "Mất kết nối tới on-premises thì AD Connector ra sao?", b: "<b>Không xác thực được</b> – vì không có bản sao trên cloud." },
      { t: "adc", f: "Giới hạn chính của AD Connector?", b: "Không transitive trust; <b>1-1 với domain</b>; không chia sẻ cho account khác; <b>không multi-VPC aware</b>; không tương thích RDS SQL Server." },
      { t: "adc", f: "Kích thước AD Connector và giới hạn user?", b: "<b>Small</b> / <b>Large</b>; không giới hạn số user hay connection – muốn tăng hiệu năng thì dàn tải qua nhiều AD Connector." },
      { t: "adc", f: "MFA với AD Connector?", b: "Tích hợp hạ tầng MFA <b>RADIUS</b> hiện có ở on-premises." },
      { t: "adc", f: "Simple AD là gì?", b: "Thư mục độc lập do AWS quản lý, chạy <b>Samba 4</b>, chi phí thấp, tính năng AD cơ bản.", x: "Không còn mở cho khách hàng mới." },
      { t: "adc", f: "Kích thước Simple AD?", b: "<b>Small</b>: tới 500 user (~2.000 objects).<br><b>Large</b>: tới 5.000 user (~20.000 objects)." },
      { t: "adc", f: "Simple AD KHÔNG có gì?", b: "<b>MFA, trust</b>, schema extension, LDAPS, PowerShell AD cmdlets; không hỗ trợ RDS SQL Server, FSx, IAM Identity Center." },

      // ---- Từ khóa
      { t: "kw", f: "Đề có “<i>mobile app users, sign-up/sign-in, social identity providers, millions of users</i>” ⇒ ?", b: "<b>Amazon Cognito user pool</b> (+ managed login)." },
      { t: "kw", f: "Đề có “<i>upload directly to S3 with temporary credentials</i>”, “<i>guest access</i>” ⇒ ?", b: "<b>Cognito identity pool</b>." },
      { t: "kw", f: "Đề có “<i>employees, multiple AWS accounts, SSO to console</i>” ⇒ ?", b: "<b>IAM Identity Center</b>, không phải Cognito." },
      { t: "kw", f: "Đề có “<i>detect compromised credentials, adaptive authentication</i>” ⇒ ?", b: "<b>Plus plan</b> / threat protection." },
      { t: "kw", f: "Đề có “<i>add authentication to a web app behind an ALB without changing code</i>” ⇒ ?", b: "ALB <b>authenticate-cognito / authenticate-oidc</b> trên <b>HTTPS listener</b>." },
      { t: "kw", f: "Đề có “<i>IoT devices / microservices call an API without a human user</i>” ⇒ ?", b: "User pool <b>M2M – client credentials grant</b>." },
      { t: "kw", f: "Đề có “<i>migrate SharePoint / .NET / SQL Server apps needing AD, fully managed, highly available</i>” ⇒ ?", b: "<b>AWS Managed Microsoft AD</b>.", x: "Tự dựng DC trên EC2 = overhead cao." },
      { t: "kw", f: "Đề có “<i>keep identities on-premises; AWS workloads keep working if the link is down</i>” ⇒ ?", b: "<b>Managed Microsoft AD + forest trust</b>." },
      { t: "kw", f: "Đề có “<i>existing on-premises AD credentials for WorkSpaces; do not store or sync directory data in the cloud</i>” ⇒ ?", b: "<b>AD Connector</b>." },
      { t: "kw", f: "Đề có “<i>small, low-cost directory, basic AD compatibility</i>” ⇒ ?", b: "<b>Simple AD</b>." },
      { t: "kw", f: "Đề có “<i>AD-aware applications in multiple Regions with low latency</i>” ⇒ ?", b: "<b>Enterprise Edition + multi-Region replication</b>." }
    ],
