  <script>
  window.DECK = {

    ],

    cards: [
      // ---- Bucket policy
      { t: "pol", f: "Mặc định bucket và object S3 có public không?", b: "<b>Không</b> – mặc định <b>private</b>, chỉ chủ sở hữu truy cập được." },
      { t: "pol", f: "Bucket policy khác IAM policy thế nào?", b: "<b>Bucket policy</b>: resource-based, có <b>Principal</b>, cấp được cross-account, service principal.<br><b>IAM policy</b>: gắn user/role, không có Principal." },
      { t: "pol", f: "S3 Object Ownership mặc định là gì?", b: "<b>Bucket owner enforced</b>: mọi ACL bị vô hiệu, bucket owner sở hữu mọi object, quyền chỉ dựa trên policy." },
      { t: "pol", f: "Sau khi tắt ACL, PUT kèm ACL khác bucket-owner-full-control thì sao?", b: "Lỗi <b>400 AccessControlListNotSupported</b>." },
      { t: "pol", f: "Bucket policy ép HTTPS dùng điều kiện gì?", b: "<b>Deny</b> khi <code>aws:SecureTransport</code> = <b>false</b>.", x: "Kiểm tra liên tục bằng Config rule s3-bucket-ssl-requests-only." },
      { t: "pol", f: "Chỉ cho principal trong AWS Organization truy cập bucket?", b: "Điều kiện <code>aws:PrincipalOrgID</code> – tự áp dụng cho account mới, không phải liệt kê account ID." },
      { t: "pol", f: "Chỉ cho truy cập qua VPC endpoint?", b: "Deny khi <code>aws:SourceVpce</code> (endpoint cụ thể) hoặc <code>aws:SourceVpc</code> không khớp.", x: "aws:SourceIp không dùng được với traffic qua VPC endpoint (IP private)." },
      { t: "pol", f: "Lỗi Resource kinh điển trong bucket policy?", b: "<code>arn:aws:s3:::bucket</code> cho <b>s3:ListBucket</b>; <code>arn:aws:s3:::bucket/*</code> cho <b>GetObject/PutObject</b>." },
      { t: "pol", f: "Account B muốn đọc bucket SSE-KMS của account A cần gì?", b: "<b>Bucket policy</b> của A + <b>IAM policy</b> trong B + <b>key policy</b> KMS cho B." },
      { t: "pol", f: "Serve nội dung S3 private chỉ qua CloudFront?", b: "<b>Origin Access Control (OAC)</b> + bucket policy cho service principal CloudFront, giữ Block Public Access bật.", x: "OAI là cách cũ, migrate sang OAC." },
      { t: "pol", f: "Cross-account upload khi bucket còn bật ACL – bucket owner phải có toàn quyền?", b: "Điều kiện <code>s3:x-amz-acl</code> = <b>bucket-owner-full-control</b>. Bucket owner enforced thì không cần." },

      // ---- BPA
      { t: "bpa", f: "4 thiết lập của S3 Block Public Access?", b: "<b>BlockPublicAcls</b> · <b>IgnorePublicAcls</b> · <b>BlockPublicPolicy</b> · <b>RestrictPublicBuckets</b>." },
      { t: "bpa", f: "BPA áp dụng ở những cấp nào?", b: "<b>Organization</b> · <b>account</b> · <b>bucket</b> · <b>access point</b>. Không có cấp từng object." },
      { t: "bpa", f: "Các cấp BPA xung đột thì sao?", b: "S3 áp dụng <b>tổ hợp chặt chẽ nhất</b>: chỉ cần một cấp bật là được bảo vệ." },
      { t: "bpa", f: "BlockPublicAcls khác IgnorePublicAcls thế nào?", b: "<b>BlockPublicAcls</b>: chặn đặt ACL public mới, không sửa ACL cũ.<br><b>IgnorePublicAcls</b>: bỏ qua ngay mọi ACL public đang có (không xóa chúng)." },
      { t: "bpa", f: "BlockPublicPolicy làm gì? Nên bật ở cấp nào?", b: "Từ chối PutBucketPolicy nếu policy public. Nên bật ở <b>cấp account</b> – người sửa được bucket policy có thể tự tắt BPA cấp bucket." },
      { t: "bpa", f: "RestrictPublicBuckets làm gì?", b: "Bucket có policy public ⇒ chỉ AWS service principal và user trong account owner truy cập; <b>chặn ngay mọi cross-account</b>." },
      { t: "bpa", f: "Organization-level BPA có lợi gì?", b: "Gắn ở root/OU, account thành viên <b>tự kế thừa (cả account mới)</b>, ghi đè setting cấp account; thay cho SCP phức tạp." },
      { t: "bpa", f: "Gỡ một setting BPA thì bucket có policy public ra sao?", b: "<b>Public trở lại</b> – BPA không sửa policy/ACL gốc." },
      { t: "bpa", f: "ACL nào bị S3 coi là public?", b: "Cấp quyền cho <b>AllUsers</b> hoặc <b>AuthenticatedUsers</b> (mọi account AWS)." },
      { t: "bpa", f: "Điều kiện <code>aws:SourceVpc</code> = “vpc-*” (StringLike) có làm policy non-public không?", b: "<b>Không</b> – wildcard vẫn public. Phải StringEquals với giá trị cố định." },
      { t: "bpa", f: "Website tĩnh qua website endpoint S3 cần gì về BPA?", b: "Tắt <b>BlockPublicPolicy</b> và <b>RestrictPublicBuckets</b> cho bucket đó. An toàn hơn: <b>CloudFront + OAC</b>, giữ bucket private." },

      // ---- Mã hóa
      { t: "enc", f: "Từ khi nào mọi object mới tự động mã hóa? Bằng gì?", b: "Từ <b>05/01/2023</b>, bằng <b>SSE-S3</b> – không thêm phí." },
      { t: "enc", f: "Header x-amz-server-side-encryption của SSE-S3, SSE-KMS, DSSE-KMS?", b: "SSE-S3 <b>AES256</b> · SSE-KMS <b>aws:kms</b> · DSSE-KMS <b>aws:kms:dsse</b>." },
      { t: "enc", f: "Lựa chọn mã hóa nào cho audit việc dùng key qua CloudTrail?", b: "<b>SSE-KMS</b> (và DSSE-KMS). SSE-S3, SSE-C không có audit key riêng." },
      { t: "enc", f: "Envelope encryption của SSE-KMS hoạt động thế nào?", b: "Dữ liệu mã hóa bằng <b>data key</b>, data key mã hóa bằng <b>KMS key</b>. Upload cần <b>kms:GenerateDataKey</b>, download cần <b>kms:Decrypt</b>." },
      { t: "enc", f: "Chia sẻ object SSE-KMS sang account khác phải dùng loại key nào?", b: "<b>Customer managed key</b> + key policy; AWS managed key <b>aws/s3</b> không chia sẻ cross-account được." },
      { t: "enc", f: "Ràng buộc của KMS key dùng cho S3?", b: "<b>Cùng Region</b> với bucket và phải <b>symmetric</b>." },
      { t: "enc", f: "S3 Bucket Keys giải quyết vấn đề gì?", b: "Giảm tới <b>99% chi phí request KMS</b> và tránh KMS throttling; chỉ áp dụng object mới.", x: "Không hỗ trợ DSSE-KMS; CloudTrail ghi ARN bucket thay vì ARN object." },
      { t: "enc", f: "DSSE-KMS là gì? Khi nào dùng?", b: "<b>Hai lớp AES-256</b> độc lập (KMS data key + key do S3 quản lý). Khi compliance yêu cầu <b>mã hóa nhiều lớp</b>." },
      { t: "enc", f: "SSE-C có đặc điểm gì?", b: "Khách hàng gửi key <b>mỗi request</b>, S3 không lưu key; <b>bắt buộc HTTPS</b>; console không hỗ trợ; mất key = mất dữ liệu." },
      { t: "enc", f: "Thay đổi về SSE-C từ 04/2026?", b: "SSE-C bị <b>chặn mặc định</b> cho bucket mới (và bucket chưa từng có object SSE-C); muốn dùng phải bật bằng PutBucketEncryption." },
      { t: "enc", f: "Khi nào chọn client-side encryption?", b: "Khi dữ liệu phải mã hóa <b>trước khi rời on-premises</b> hoặc <b>AWS không bao giờ thấy plaintext/key</b>." },
      { t: "enc", f: "Đổi default encryption sang SSE-KMS có mã hóa lại object cũ không?", b: "<b>Không.</b> Dùng <b>S3 Batch Operations – Copy</b> (dựa trên S3 Inventory)." },
      { t: "enc", f: "User có s3:GetObject vẫn bị AccessDenied với object SSE-KMS ⇒ ?", b: "Thiếu <b>kms:Decrypt</b> trên key." },
      { t: "enc", f: "Bucket đích của server access logging nên dùng mã hóa gì?", b: "<b>SSE-S3</b> – SSE-KMS có thể mã hóa log bằng key bạn không truy cập được." },

      // ---- Object Lock
      { t: "lock", f: "S3 Object Lock là gì?", b: "Lưu trữ <b>WORM</b>: ngăn object version bị xóa/ghi đè trong thời hạn; đánh giá cho SEC 17a-4, CFTC, FINRA." },
      { t: "lock", f: "Điều kiện và tính chất khi bật Object Lock?", b: "Bucket phải bật <b>Versioning</b>; bật rồi <b>không tắt được</b>, không suspend versioning được." },
      { t: "lock", f: "Governance mode khác Compliance mode thế nào?", b: "<b>Governance</b>: user có <code>s3:BypassGovernanceRetention</code> + header bypass vượt được.<br><b>Compliance</b>: <b>không ai</b>, kể cả root, xóa được; chỉ kéo dài retention." },
      { t: "lock", f: "Cách duy nhất xóa object Compliance mode trước hạn?", b: "<b>Xóa luôn AWS account.</b>" },
      { t: "lock", f: "DELETE không version ID lên object bị khóa thì sao?", b: "<b>200 OK</b>, S3 chèn delete marker; version bị khóa vẫn còn. DELETE kèm version ID ⇒ <b>403</b>." },
      { t: "lock", f: "Legal hold khác retention period thế nào?", b: "Legal hold <b>không có ngày hết hạn</b>, tồn tại tới khi gỡ (quyền s3:PutObjectLegalHold); <b>độc lập</b> với retention." },
      { t: "lock", f: "Variable retention (event hold) dùng khi nào?", b: "Chưa biết ngày hết hạn lúc ghi: thời hạn tính từ <b>sự kiện</b> (hết hợp đồng, đóng tài khoản). Release ⇒ retain-until = lúc release + duration." },
      { t: "lock", f: "Các bước Glacier Vault Lock?", b: "<b>Initiate</b> (nhận lock ID) ⇒ <b>kiểm thử trong 24 giờ</b> ⇒ <b>Complete</b> ⇒ policy bất biến." },
      { t: "lock", f: "MFA Delete có phải WORM không?", b: "<b>Không</b> – chỉ thêm MFA khi xóa version, không có thời hạn lưu giữ." },

      // ---- Presigned URL
      { t: "url", f: "Presigned URL là gì?", b: "URL cấp quyền <b>có thời hạn</b> cho một object cụ thể (GET/PUT/HEAD…), dùng <b>credential của người ký</b>; người dùng không cần credential AWS." },
      { t: "url", f: "Thời hạn tối đa của presigned URL?", b: "Console <b>12 giờ</b> · CLI/SDK (SigV4, IAM user) <b>7 ngày</b> (604800 giây)." },
      { t: "url", f: "Presigned URL ký bằng IAM role / instance profile hết hạn khi nào?", b: "Khi <b>credential tạm hết hạn</b> (instance profile ~6 giờ, AssumeRole mặc định 1 giờ), dù đặt expiration dài hơn." },
      { t: "url", f: "Người tạo URL không có quyền s3:GetObject thì sao?", b: "URL tạo được nhưng dùng sẽ bị <b>403</b>." },
      { t: "url", f: "Hạn chế rủi ro presigned URL bằng gì?", b: "<code>s3:signatureAge</code>, giới hạn mạng (<code>aws:SourceIp</code>, <code>aws:SourceVpc/Vpce</code>), expiration ngắn, role quyền tối thiểu." },
      { t: "url", f: "Thu hồi presigned URL sớm thế nào?", b: "<b>Revoke/vô hiệu credential</b> đã ký (hoặc session của role)." },

      // ---- Access Points & CORS
      { t: "ap", f: "S3 Access Points giải quyết vấn đề gì?", b: "Mỗi ứng dụng/nhóm một <b>endpoint + policy riêng</b> thay vì một bucket policy khổng lồ." },
      { t: "ap", f: "Quota và giới hạn của access point?", b: "<b>10.000</b>/account/Region · policy <b>20 KB</b> · tên 3–50 ký tự · 1 bucket mỗi AP, không đổi được." },
      { t: "ap", f: "Để access point policy có hiệu lực, bucket policy cần gì?", b: "Ủy quyền cho access point bằng điều kiện <code>s3:DataAccessPointAccount</code> (khuyến nghị) hoặc lặp lại quyền." },
      { t: "ap", f: "Network origin của access point?", b: "<b>VPC</b> hoặc <b>Internet</b>, không đổi sau khi tạo. AP VPC origin luôn non-public." },
      { t: "ap", f: "S3 Object Lambda Access Point dùng để làm gì?", b: "Chạy Lambda <b>biến đổi dữ liệu khi GET</b>, vd che PII, không lưu bản sao thứ hai." },
      { t: "ap", f: "CORS cấu hình trên bucket nào?", b: "Trên bucket <b>chứa tài nguyên bị gọi tới</b> (bucket đích), không phải bucket chứa trang web." },
      { t: "ap", f: "Các phần tử của CORS rule?", b: "AllowedOrigins, AllowedMethods (GET/PUT/POST/DELETE/HEAD), AllowedHeaders, ExposeHeaders, MaxAgeSeconds. Tối đa <b>100 rule</b>." },

      // ---- Giám sát
      { t: "mon", f: "Amazon Macie dùng để làm gì?", b: "Phát hiện <b>dữ liệu nhạy cảm (PII, tài chính, credential)</b> trong object S3 bằng ML + pattern matching." },
      { t: "mon", f: "GuardDuty S3 Protection dùng để làm gì?", b: "Phát hiện <b>mối đe dọa</b>, truy cập bất thường/exfiltration từ CloudTrail management + data events." },
      { t: "mon", f: "IAM Access Analyzer for S3 dùng để làm gì?", b: "Tìm bucket <b>public</b> hoặc <b>chia sẻ với account ngoài</b>; block public một click." },
      { t: "mon", f: "CloudTrail data events của S3 có bật sẵn không?", b: "<b>Không</b> – management events có sẵn; data events (GetObject, PutObject, DeleteObject) phải bật trên trail." },
      { t: "mon", f: "Kiểm tra liên tục bucket có SSL-only, versioning, không public và tự khắc phục?", b: "<b>AWS Config rules</b> + remediation (SSM Automation)." },

      { t: "kw", f: "Đề có “<i>objects uploaded by partner accounts cannot be read by the bucket owner</i>” ⇒ ?", b: "Object Ownership = <b>Bucket owner enforced</b> (tắt ACL)." },

      { t: "kw", f: "Đề có “<i>dual-layer encryption required</i>” ⇒ ?", b: "<b>DSSE-KMS</b>." },

      { t: "kw", f: "Đề có “<i>users without AWS credentials download a private object for a limited time</i>” ⇒ ?", b: "<b>Presigned URL</b>." },
      { t: "kw", f: "Đề có “<i>hundreds of teams share one bucket; policy too complex</i>” ⇒ ?", b: "<b>S3 Access Points</b>." },
      { t: "kw", f: "Đề có “<i>browser shows No Access-Control-Allow-Origin header</i>” ⇒ ?", b: "Thêm <b>CORS configuration</b> trên bucket bị gọi tới." },
      { t: "kw", f: "Đề có “<i>discover PII / credit card numbers in S3</i>” ⇒ ?", b: "<b>Amazon Macie</b>." },
      { t: "kw", f: "Đề có “<i>who deleted this object and when?</i>” ⇒ ?", b: "<b>CloudTrail data events</b> (hoặc server access logs)." }
    ],
