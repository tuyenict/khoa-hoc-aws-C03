      { t: "ov", f: "Đường truyền 1 Gbps dùng hết 100% chuyển được khoảng bao nhiêu dữ liệu mỗi ngày?", b: "Khoảng <b>10,8 TB/ngày</b> (1 Gbit/s × 86.400 s ÷ 8).", x: "100 Mbps ≈ 1 TB/ngày · 10 Gbps ≈ 108 TB/ngày." },

      { t: "ov", f: "Storage Gateway, DataSync, Snowball, Transfer Family khác nhau về bản chất?", b: "<b>Storage Gateway</b>: hybrid storage lâu dài.<br><b>DataSync</b>: migrate/sync online.<br><b>Snowball Edge</b>: migrate offline + edge.<br><b>Transfer Family</b>: endpoint trao đổi file B2B." },

      // ---- Storage Gateway chung + S3 File Gateway

      { t: "sgw", f: "Có thể triển khai Storage Gateway ở đâu?", b: "<b>VM</b> (VMware ESXi, Hyper-V, Linux KVM, Nutanix AHV) · <b>hardware appliance</b> (qua đại lý) · <b>Amazon EC2</b> / VMware Cloud on AWS." },
      { t: "sgw", f: "Khi nào chạy Storage Gateway trên EC2?", b: "Cho <b>disaster recovery</b>, data mirroring, hoặc cấp storage cho ứng dụng chạy trên EC2." },
      { t: "sgw", f: "Cache storage và upload buffer khác nhau thế nào?", b: "<b>Cache storage</b>: giữ dữ liệu chờ upload + dữ liệu vừa truy cập để đọc nhanh.<br><b>Upload buffer</b>: vùng staging trước khi gửi lên AWS qua SSL/TLS.", x: "S3 File Gateway chỉ dùng cache." },
      { t: "sgw", f: "Vì sao ứng dụng thấy Storage Gateway nhanh như storage local?", b: "Gateway <b>xác nhận ghi ngay khi dữ liệu nằm trên đĩa local</b>, rồi <b>upload bất đồng bộ</b> lên AWS." },
      { t: "sgw", f: "S3 File Gateway hỗ trợ giao thức nào?", b: "<b>NFS v3 / v4.1</b> và <b>SMB v2 / v3</b>; SMB có thể join Microsoft AD." },
      { t: "sgw", f: "S3 File Gateway lưu file thế nào trong S3?", b: "<b>1 file = 1 object</b>, đường dẫn file = <b>object key</b>; metadata file lưu thành metadata object; mã hóa mặc định <b>SSE-S3</b> (có thể KMS)." },
      { t: "sgw", f: "Thao tác file nào trên S3 File Gateway sinh object mới?", b: "<b>Đổi tên file/thư mục, đổi quyền, đổi owner, append</b>.", x: "Đổi tên thư mục lớn = ghi lại hàng triệu object ⇒ tốn PUT, có thể phí xóa sớm nếu ở IA/Glacier." },
      { t: "sgw", f: "Object ghi thẳng vào bucket không hiện trên share S3 File Gateway ⇒ làm gì?", b: "Chạy <b>RefreshCache</b> (theo lịch hoặc kích hoạt bằng S3 event).", x: "Không phải lỗi quyền, không phải do kích thước cache." },
      { t: "sgw", f: "S3 File Gateway ghi được vào những storage class nào?", b: "S3 Standard, Standard-IA, One Zone-IA, Intelligent-Tiering. Muốn xuống Glacier ⇒ dùng <b>S3 Lifecycle</b>." },
      { t: "sgw", f: "Với S3 Versioning, ghi một file mới qua S3 File Gateway tạo bao nhiêu phiên bản?", b: "Ít nhất <b>2 phiên bản</b>: upload dữ liệu trước, metadata sau. File lớn có thể nhiều hơn.", x: "Đặt lifecycle expiration cho noncurrent version." },
