      { t: "peer", f: "Vì sao VPC peering không có điểm lỗi đơn hay nút thắt băng thông?", b: "Peering dùng chính hạ tầng sẵn có của VPC: <b>không phải gateway, không phải VPN</b>, không dựa vào phần cứng riêng." },

      { t: "peer", f: "<i>Edge-to-edge routing</i> qua VPC peer – những gì KHÔNG được dùng nhờ?", b: "IGW, <b>NAT device</b>, <b>VPN</b>, <b>Direct Connect</b> và <b>gateway endpoint</b> (S3) của VPC peer.", x: "Muốn dùng chung NAT/egress ⇒ Transit Gateway + egress VPC." },
      { t: "peer", f: "Hai VPC có CIDR chồng lấn có peer được không?", b: "<b>Không</b> – kể cả khi VPC có nhiều CIDR và bạn chỉ định dùng phần không chồng lấn." },
      { t: "peer", f: "Khi nào tham chiếu được security group của VPC peer?", b: "Chỉ khi hai VPC <b>cùng Region</b>. Inter-Region peering <b>không</b> tham chiếu được SG." },
      { t: "peer", f: "Bật DNS resolution cho peering để làm gì?", b: "Để public DNS hostname của instance bên kia phân giải ra <b>IP private</b> (mặc định ra IP public)." },
      { t: "peer", f: "Chi phí VPC peering?", b: "<b>Tạo miễn phí</b>, không phí giờ, không phí xử lý dữ liệu. Data transfer <b>trong cùng AZ miễn phí</b>; qua AZ khác/Region khác thì tính phí." },

      { t: "peer", f: "Trong Shared VPC, ai được tạo/accept/xóa peering?", b: "Chỉ <b>chủ VPC</b> (owner); participant không thao tác được." },

      { t: "gw", f: "Gateway endpoint hỗ trợ những dịch vụ nào?", b: "Chỉ <b>Amazon S3</b> và <b>DynamoDB</b>.", x: "SQS, KMS, Secrets Manager… không có gateway endpoint." },

      { t: "gw", f: "VPC endpoint policy là gì? Mặc định ra sao?", b: "IAM <b>resource policy</b> gắn vào endpoint, quyết định ai làm gì trên tài nguyên nào qua endpoint. Mặc định <b>cho phép tất cả</b>.", x: "Dùng để chỉ cho truy cập bucket của công ty, chống rò rỉ dữ liệu." },

      { t: "svc", f: "Endpoint service sẵn sàng ở những AZ nào?", b: "Chỉ các AZ mà <b>NLB của provider được bật</b>; nên bật ≥ 2 AZ, có target ở mỗi AZ." },
