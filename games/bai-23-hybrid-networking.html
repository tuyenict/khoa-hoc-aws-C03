    cards: [
      // ---- Site-to-Site VPN
      { t: "s2s", f: "AWS Site-to-Site VPN là gì?", b: "Đường hầm <b>IPsec mã hóa</b> qua <b>internet công cộng</b>, nối cả một mạng (data center, chi nhánh) với VPC. Dựng trong <b>vài phút</b>, chi phí thấp." },
      { t: "s2s", f: "Mỗi Site-to-Site VPN connection có bao nhiêu tunnel?", b: "<b>2 tunnel</b> tới hai endpoint khác nhau phía AWS, dùng đồng thời được để HA.", x: "AWS bảo trì một endpoint ⇒ traffic chuyển sang tunnel còn lại; nên cấu hình cả hai tunnel." },
      { t: "s2s", f: "Phân biệt <b>customer gateway</b> và <b>customer gateway device</b>.", b: "<b>Customer gateway</b>: <b>tài nguyên trong AWS</b> mô tả thiết bị phía bạn (IP, BGP ASN, chứng chỉ).<br><b>Customer gateway device</b>: router/firewall <b>thật ở on-premises</b>.", x: "Đề hay tráo tên các thành phần này." },

      { t: "s2s", f: "<i>Target gateway</i> của Site-to-Site VPN có thể là gì?", b: "<b>Virtual private gateway</b>, <b>transit gateway</b> (hoặc Cloud WAN core network)." },
      { t: "s2s", f: "Băng thông và MTU của một VPN tunnel chuẩn?", b: "<b>1,25 Gbps</b> mỗi tunnel (~140.000 pps) · MTU <b>1446 byte</b> (MSS 1406), không jumbo frame." },
      { t: "s2s", f: "Static routing hay dynamic routing (BGP) – AWS khuyến nghị gì?", b: "<b>BGP</b>: phát hiện liveness mạnh, failover sang tunnel thứ hai. Static chỉ dùng khi thiết bị không hỗ trợ BGP.", x: "BGP bắt buộc cho VPN CloudHub và ECMP trên TGW." },
      { t: "s2s", f: "Trong route table VPC, route propagated từ VPN chồng lấn route local – route nào thắng?", b: "<b>Local luôn thắng</b>, kể cả khi route propagated cụ thể hơn. Cùng CIDR với route static ⇒ <b>static thắng</b>." },
      { t: "s2s", f: "Thứ tự ưu tiên route trong VGW khi cùng prefix?", b: "1. <b>DX BGP</b><br>2. <b>VPN static</b><br>3. <b>VPN BGP</b><br>4. AS PATH ngắn hơn<br>5. MED thấp hơn", x: "Giải thích vì sao DX chính + VPN dự phòng chạy tự nhiên." },
      { t: "s2s", f: "Muốn ép traffic ưu tiên một đường cụ thể – AWS khuyến nghị gì?", b: "Quảng bá <b>prefix cụ thể hơn</b> (longest prefix match)." },
      { t: "s2s", f: "VPN đã UP nhưng instance không tới được on-premises – vì sao?", b: "Thiếu <b>route</b> tới CIDR on-premises (target <code>vgw-…</code>) hoặc chưa bật <b>route propagation</b>; hoặc <b>SG/NACL</b> chưa mở." },
      { t: "s2s", f: "VGW có hỗ trợ IPv6 qua VPN không?", b: "<b>Không.</b> Muốn IPv6 phải dùng <b>transit gateway</b> (hoặc Cloud WAN). Một VPN không chở đồng thời IPv4 và IPv6." },
      { t: "s2s", f: "Một VPC gắn được bao nhiêu virtual private gateway?", b: "<b>Một</b> tại một thời điểm. Một VPN phục vụ nhiều VPC ⇒ <b>transit gateway</b>." },
      { t: "s2s", f: "ECMP trên Transit Gateway dùng để làm gì? Điều kiện?", b: "Gộp nhiều tunnel VPN để <b>tăng băng thông vượt 1,25 Gbps</b>. Yêu cầu <b>BGP</b>.", x: "VGW không hỗ trợ ECMP – chỉ một tunnel được chọn làm đường ra." },

      { t: "s2s", f: "Quota Site-to-Site VPN cần nhớ?", b: "<b>10</b> VPN connection mỗi VGW · <b>5</b> VGW / <b>50</b> customer gateway mỗi Region · tối đa <b>100</b> static route và <b>100</b> route BGP trên VGW (<b>1.000</b> route BGP nếu VPN gắn TGW)." },

      { t: "hub", f: "3 điều kiện của VPN CloudHub?", b: "<b>Một VGW</b> chung · VPN <b>BGP</b> (dynamic) · mỗi customer gateway <b>ASN riêng</b>; CIDR các site <b>không chồng lấn</b>." },
      { t: "hub", f: "Site dùng Direct Connect có tham gia CloudHub được không?", b: "<b>Có</b> – nếu DX tới <b>cùng VGW</b> (vd trụ sở New York dùng DX, LA và Miami dùng VPN)." },
      { t: "hub", f: "Chi phí VPN CloudHub tính thế nào?", b: "Giá VPN connection-giờ cho mỗi VPN gắn VGW. Dữ liệu site → VGW <b>miễn phí</b>; VGW chuyển ra site đích tính data transfer chuẩn." },

      { t: "cvpn", f: "Các thành phần chính của Client VPN?", b: "<b>Client VPN endpoint</b> · <b>target network</b> (subnet / TGW) · <b>route</b> · <b>authorization rule</b> · <b>client CIDR range</b> · connection logging." },

      { t: "cvpn", f: "Traffic IPv4 từ client vào VPC hiện IP nào ở phía đích?", b: "IP của <b>Client VPN network interface</b> (SNAT). IPv6 thì không NAT." },
      { t: "cvpn", f: "Chi phí Client VPN?", b: "Phí giờ mỗi <b>endpoint association</b> + phí giờ mỗi <b>kết nối VPN</b> + data transfer out." },

      { t: "dx", f: "Dedicated connection: tốc độ và cách đặt?", b: "<b>1, 10, 100, 400 Gbps</b>; tự yêu cầu qua console/CLI/API; AWS cấp <b>LOA-CFA</b>; tới 50 private/public VIF + tối đa 4 transit VIF (tổng 51).", x: "Không đổi tốc độ được – phải tạo connection mới." },

      { t: "dx", f: "Giới hạn route trên private/transit VIF?", b: "Mặc định <b>100 route</b> mỗi phiên BGP (tăng tới 1.000); vượt quá ⇒ phiên BGP chuyển idle (DOWN)." },
