  <script>
  window.DECK = {
    topics: [
      { id: "core", name: "Khái niệm & kiến trúc serverless" },
      { id: "type", name: "REST · HTTP · WebSocket API" },
      { id: "endp", name: "Endpoint type & custom domain" },
      { id: "integ", name: "Integration · Stage · Canary" },
      { id: "thr", name: "Throttling & usage plan" },
      { id: "cache", name: "API caching" },
      { id: "auth", name: "Authorizer & bảo mật" },

    ],

    cards: [
      // ---- Khái niệm & kiến trúc
      { t: "core", f: "Vai trò của Amazon API Gateway trong kiến trúc serverless?", b: "<b>Front door</b> cho REST, HTTP, WebSocket API: quản lý lưu lượng, ủy quyền, giám sát, quản lý phiên bản. Cùng Lambda tạo phần <b>app-facing</b> của serverless." },
      { t: "core", f: "Resource, method, integration trong API Gateway là gì?", b: "<b>Resource</b>: đường dẫn (/pets/{id}).<br><b>Method</b>: động từ HTTP (GET, POST…).<br><b>Integration</b>: back end xử lý (Lambda, HTTP, dịch vụ AWS, VPC link, mock)." },
      { t: "core", f: "Deployment và stage khác nhau thế nào?", b: "<b>Deployment</b>: snapshot của API tại một thời điểm.<br><b>Stage</b>: tên tham chiếu tới một deployment (dev, prod) – nơi đặt cache, throttling, WAF, log." },
      { t: "core", f: "Resource <code>{proxy+}</code> dùng để làm gì?", b: "Bắt <b>mọi đường dẫn con</b> – giảm số resource (quota 300 resource/API)." },
      { t: "core", f: "Phân biệt CloudTrail, CloudWatch access log, X-Ray với API Gateway.", b: "<b>CloudTrail</b>: ai thay đổi cấu hình API.<br><b>Access log</b>: từng request của client.<br><b>X-Ray</b>: truy vết độ trễ end-to-end." },
      { t: "core", f: "Kiến trúc web serverless “least operational overhead” điển hình?", b: "<b>S3 + CloudFront</b> (front end) → <b>API Gateway</b> → <b>Lambda</b> → <b>DynamoDB</b>, đăng nhập bằng <b>Cognito</b>." },
      { t: "core", f: "API nhận đột biến, không được mất request, xử lý được bất đồng bộ ⇒ mẫu nào?", b: "<b>API Gateway → SQS → Lambda</b> (AWS service integration ghi thẳng vào SQS, Lambda đọc theo batch)." },
      { t: "core", f: "Upload file lớn qua API serverless thế nào?", b: "API → Lambda sinh <b>S3 presigned URL</b> → client upload thẳng lên S3 → S3 event kích hoạt Lambda.", x: "Tránh giới hạn 10 MB của API Gateway và 6 MB của Lambda." },
      { t: "core", f: "Khi nào chọn Lambda function URL thay vì API Gateway?", b: "Webhook, công cụ nội bộ đơn giản, <b>chi phí thấp nhất</b>; không cần throttling theo client, caching, API key. Xác thực chỉ IAM hoặc NONE." },

      // ---- Loại API
      { t: "type", f: "Câu chốt của tài liệu về REST API vs HTTP API?", b: "REST API <b>nhiều tính năng hơn</b>; HTTP API <b>tối giản, giá rẻ hơn</b>. Chọn REST nếu cần <b>API key, per-client throttling, request validation, WAF, private endpoint</b>." },
      { t: "type", f: "Những tính năng CHỈ REST API có?", b: "API key, usage plan, <b>caching</b>, request validation, <b>AWS WAF</b>, <b>resource policy</b>, <b>private</b> & <b>edge-optimized</b> endpoint, canary, X-Ray, mapping template." },
      { t: "type", f: "Những tính năng HTTP API có mà REST API không có?", b: "<b>JWT authorizer native</b>, <b>automatic deployment</b>, private integration với <b>AWS Cloud Map</b>." },
      { t: "type", f: "HTTP API hỗ trợ endpoint type nào?", b: "Chỉ <b>Regional</b>." },
      { t: "type", f: "WebSocket API phù hợp với ứng dụng nào?", b: "Giao tiếp <b>hai chiều, stateful</b>: chat, dashboard thời gian thực, game, thông báo trực tiếp – back end chủ động đẩy message." },
      { t: "type", f: "3 route định sẵn của WebSocket API?", b: "<b>$connect</b> (mở kết nối, lưu connection ID) · <b>$disconnect</b> · <b>$default</b> (không khớp route nào)." },
      { t: "type", f: "Back end gửi message tới client WebSocket bằng cách nào?", b: "Route response, hoặc <b>POST tới <code>@connections</code> API</b> kèm connection ID." },
      { t: "type", f: "Giới hạn thời gian kết nối WebSocket API?", b: "Sống tối đa <b>2 giờ</b>, idle <b>10 phút</b> (mã đóng 1001)." },
      { t: "type", f: "Integration timeout của REST, HTTP, WebSocket API?", b: "REST: <b>50 ms – 29 giây</b> (Regional/private xin tăng được).<br>HTTP API: tối đa <b>30 giây</b>.<br>WebSocket: <b>29 giây</b>." },
      { t: "type", f: "Payload tối đa của REST/HTTP API và WebSocket?", b: "REST &amp; HTTP: <b>10 MB</b>. WebSocket: message <b>128 KB</b>, frame 32 KB." },

      // ---- Endpoint
      { t: "endp", f: "Edge-optimized endpoint hoạt động thế nào?", b: "Request vào <b>CloudFront POP gần client nhất</b> rồi đi về Region của API. <b>Mặc định của REST API</b>, chỉ REST.", x: "Distribution do API Gateway quản lý, bạn không cấu hình được." },
      { t: "endp", f: "Khi nào chọn Regional endpoint?", b: "Client <b>cùng Region</b>, hoặc muốn <b>tự đặt CloudFront</b> phía trước, hoặc API <b>multi-Region</b> với Route 53." },
      { t: "endp", f: "Private API gọi được từ đâu?", b: "Chỉ từ <b>trong VPC</b> qua <b>interface VPC endpoint</b> (execute-api, PrivateLink); on-premises qua Direct Connect/VPN vào VPC.", x: "Chỉ REST API, cần resource policy." },
      { t: "endp", f: "Private API cần resource policy với điều kiện gì?", b: "<b><code>aws:SourceVpc</code></b> / <b><code>aws:SourceVpce</code></b>." },
      { t: "endp", f: "Có gateway VPC endpoint cho API Gateway không?", b: "<b>Không.</b> Gateway endpoint chỉ có cho S3 và DynamoDB; API Gateway dùng <b>interface endpoint</b>." },
      { t: "endp", f: "Certificate ACM cho custom domain edge-optimized phải ở Region nào?", b: "<b>us-east-1</b> (giống CloudFront)." },
      { t: "endp", f: "API multi-Region active-active cùng domain ⇒ thiết kế gì?", b: "<b>Regional API</b> ở mỗi Region + <b>custom domain</b> + <b>Route 53 latency / failover routing</b>." },
      { t: "endp", f: "Tắt endpoint mặc định execute-api có tác dụng gì?", b: "Buộc client đi qua <b>custom domain</b>; gọi endpoint mặc định nhận <b>403</b>." },
      { t: "endp", f: "Base path mapping là gì?", b: "Ánh xạ đường dẫn của custom domain tới API + stage, vd api.example.com/orders → API orders stage prod." },

      // ---- Integration
      { t: "integ", f: "Lambda proxy integration (<code>AWS_PROXY</code>) là gì?", b: "Chuyển <b>nguyên request</b> cho Lambda; Lambda trả về theo định dạng chuẩn (statusCode, headers, body). <b>Cách khuyến nghị</b> để gọi Lambda." },
      { t: "integ", f: "AWS service integration (type <code>AWS</code>) dùng khi nào?", b: "Gọi <b>trực tiếp action dịch vụ AWS</b> (SQS SendMessage, DynamoDB PutItem, Kinesis PutRecord, StartExecution) bằng IAM role + mapping template ⇒ <b>bỏ Lambda trung gian</b>." },
      { t: "integ", f: "HTTP_PROXY integration dùng khi nào?", b: "Đặt API Gateway trước một <b>back end HTTP có sẵn</b> (EC2, on-premises, SaaS), chuyển nguyên request/response." },
      { t: "integ", f: "Mock integration dùng để làm gì?", b: "API Gateway <b>tự trả response</b>, không gọi back end: test, phát triển song song, trả header CORS cho OPTIONS." },
      { t: "integ", f: "VPC link dùng để làm gì?", b: "Private integration tới tài nguyên private sau <b>NLB / ALB</b> (HTTP API thêm <b>Cloud Map</b>)." },
      { t: "integ", f: "Quyền để API Gateway gọi Lambda nằm ở đâu?", b: "<b>Resource-based policy của function</b> (lambda:InvokeFunction cho apigateway.amazonaws.com). Gọi dịch vụ khác ⇒ IAM role." },
      { t: "integ", f: "Stage variables là gì?", b: "Cặp key/value theo stage (≤ 100), như biến môi trường – vd stage dev trỏ Lambda alias DEV, prod trỏ PROD." },
      { t: "integ", f: "Canary release deployment hoạt động thế nào?", b: "Trên <b>cùng một stage</b>, chia % traffic giữa production release và canary release; tốt thì <b>promote</b>, xấu thì tắt (rollback). Chỉ REST API." },
      { t: "integ", f: "HTTP API có automatic deployment, còn REST API thì sao?", b: "REST API: sửa xong phải <b>deploy</b> thì client mới thấy thay đổi." },

      // ---- Throttling
      { t: "thr", f: "API Gateway throttle bằng thuật toán gì?", b: "<b>Token bucket</b>: <b>rate</b> = tốc độ nạp token mỗi giây, <b>burst</b> = sức chứa bucket. Mỗi request tiêu một token." },
      { t: "thr", f: "Throttle mặc định mỗi account mỗi Region?", b: "<b>10.000 RPS</b>, burst <b>5.000</b> (gộp REST, HTTP, WebSocket). RPS tăng được; burst do AWS quyết định." },
      { t: "thr", f: "Thứ tự 4 tầng throttling?", b: "<b>Usage plan</b> (per-client) → <b>stage/method</b> → <b>account per Region</b> → <b>AWS Regional</b>." },
      { t: "thr", f: "Client nhận 429 và 504 nghĩa là gì?", b: "<b>429</b> Too Many Requests: bị throttle.<br><b>504</b> Gateway Timeout: back end vượt integration timeout 29 giây." },
      { t: "thr", f: "Usage plan dùng để làm gì?", b: "Cho từng <b>API key</b>: <b>throttling</b> (rate, burst) + <b>quota</b> (request/ngày/tuần/tháng) trên stage/method – bán API theo gói. Chỉ REST API." },
      { t: "thr", f: "Có nên dùng API key để xác thực không?", b: "<b>Không.</b> API key chỉ nhận diện client cho usage plan; xác thực bằng IAM, Lambda authorizer, Cognito.", x: "API key hay bị log trong header." },
      { t: "thr", f: "Có nên dựa vào usage plan để kiểm soát chi phí / chặn truy cập không?", b: "<b>Không</b> – throttle và quota là <b>best-effort</b>. Chi phí ⇒ AWS Budgets; chặn request độc hại ⇒ AWS WAF rate-based rule." },
      { t: "thr", f: "Bảo vệ database hạ nguồn khỏi đột biến qua API ⇒ ?", b: "<b>Stage/method throttling</b> phù hợp sức chịu back end (+ đệm SQS nếu xử lý được bất đồng bộ)." },

      // ---- Caching
      { t: "cache", f: "API caching có ở loại API nào?", b: "<b>Chỉ REST API</b>, bật theo stage." },
      { t: "cache", f: "TTL của API cache?", b: "Mặc định <b>300 giây</b>, tối đa <b>3.600 giây</b>; TTL = 0 là tắt cache." },
      { t: "cache", f: "Khi bật cache, method nào được cache mặc định?", b: "<b>Chỉ GET</b>. Method khác phải override theo method." },
      { t: "cache", f: "Kích thước response tối đa được cache?", b: "<b>1 MB</b> (1.048.576 byte)." },
      { t: "cache", f: "Client muốn lấy dữ liệu mới, bỏ qua cache ⇒ ?", b: "Gửi header <b><code>Cache-Control: max-age=0</code></b>; nên yêu cầu quyền <b><code>execute-api:InvalidateCache</code></b>." },
      { t: "cache", f: "Cache key cấu hình sai gây vấn đề gì?", b: "Thiếu tham số ⇒ client nhận <b>dữ liệu sai</b> của request khác. Quá nhiều tham số ⇒ <b>hit rate thấp</b>." },
      { t: "cache", f: "Đổi cache capacity thì dữ liệu cache ra sao?", b: "Cache cũ bị xóa, tạo cache mới ⇒ <b>mất toàn bộ dữ liệu cache</b>. Tạo/xóa cache mất ~4 phút." },
      { t: "cache", f: "API caching tính phí thế nào?", b: "<b>Theo giờ</b> theo kích thước cache, không thuộc Free Tier. Theo dõi bằng CacheHitCount / CacheMissCount." },

      // ---- Authorizer
      { t: "auth", f: "IAM authorization (AWS_IAM) phù hợp khi nào?", b: "Caller <b>có AWS credentials</b>, ký <b>SigV4</b>: service-to-service, EC2/Lambda có IAM role, <b>cross-account</b> (kèm resource policy), user có credentials từ identity pool." },
      { t: "auth", f: "Cognito user pool authorizer hoạt động thế nào?", b: "Client đăng nhập user pool lấy <b>JWT</b> (ID/access token), gửi trong header Authorization; API Gateway <b>tự xác minh, không cần code</b>." },
      { t: "auth", f: "Lambda authorizer trả về gì?", b: "<b>IAM policy</b> (Allow/Deny execute-api:Invoke) + <b>principal ID</b> (+ context tùy chọn)." },
      { t: "auth", f: "TOKEN và REQUEST authorizer khác nhau thế nào?", b: "<b>TOKEN</b>: danh tính trong bearer token ở một header.<br><b>REQUEST</b>: tổ hợp header, query string, stage variables, $context – tài liệu khuyến nghị." },
      { t: "auth", f: "Lambda authorizer trả Deny hoặc token sai thì client nhận gì?", b: "Deny ⇒ <b>403</b>; token thiếu/không hợp lệ ⇒ <b>401 Unauthorized</b>." },
      { t: "auth", f: "Authorization caching của Lambda authorizer giúp gì?", b: "Cache policy trả về để không gọi lại Lambda cho cùng danh tính ⇒ <b>giảm độ trễ và chi phí</b>." },
      { t: "auth", f: "Resource policy của API Gateway giới hạn được theo gì?", b: "<b>Account khác</b> (cross-account), <b>IP/CIDR</b> (aws:SourceIp), <b>VPC / VPC endpoint</b> (aws:SourceVpc, aws:SourceVpce). Chỉ REST API." },
      { t: "auth", f: "Cognito user pool khác identity pool khi dùng với API Gateway?", b: "<b>User pool</b> cấp <b>JWT</b> ⇒ authorizer COGNITO_USER_POOLS / JWT.<br><b>Identity pool</b> cấp <b>AWS credentials</b> ⇒ AWS_IAM." },
      { t: "auth", f: "Chống SQL injection, XSS, HTTP flood cho REST API ⇒ ?", b: "Gắn <b>AWS WAF web ACL</b> vào stage (rate-based rule chống flood)." },
      { t: "auth", f: "Client certificate do API Gateway sinh dùng để làm gì?", b: "Để <b>back end xác minh</b> request thực sự đến từ API Gateway." },

      // ---- Từ khóa
      { t: "kw", f: "Đề có “<i>expose Lambda functions as a RESTful API</i>”, “<i>serverless back end for a mobile app</i>” ⇒ ?", b: "<b>API Gateway + Lambda (+ DynamoDB)</b>." },
      { t: "kw", f: "Đề có “<i>lowest cost</i>”, “<i>simple proxy to Lambda</i>”, JWT/OIDC sẵn có ⇒ ?", b: "<b>HTTP API</b>." },
      { t: "kw", f: "Đề có “<i>server must push updates to connected clients</i>”, chat, live dashboard ⇒ ?", b: "<b>WebSocket API</b> (GraphQL thì AppSync subscriptions)." },
      { t: "kw", f: "Đề có “<i>different request limits per customer / tiered plans</i>” ⇒ ?", b: "<b>Usage plan + API key</b> (REST API)." },
      { t: "kw", f: "Đề có “<i>API accessible only from within the VPC / over Direct Connect</i>” ⇒ ?", b: "<b>Private REST API</b> + interface endpoint execute-api + resource policy." },
      { t: "kw", f: "Đề có “<i>many identical read requests, data changes infrequently</i>” ⇒ ?", b: "<b>API Gateway caching</b> trên stage với TTL phù hợp." },
      { t: "kw", f: "Đề có “<i>third-party OAuth / SAML identity provider</i>”, “<i>custom authorization logic</i>” ⇒ ?", b: "<b>Lambda authorizer</b> (bật caching)." },
      { t: "kw", f: "Đề có “<i>send API requests directly to SQS / Kinesis without managing compute</i>” ⇒ ?", b: "<b>AWS service integration</b> (type AWS)." },
      { t: "kw", f: "Đề có “<i>long-running request times out after 29 seconds</i>” ⇒ ?", b: "Chuyển <b>bất đồng bộ</b>: SQS / Step Functions, trả job ID, client poll hoặc nhận qua WebSocket.", x: "Không phải tăng timeout Lambda." },
      { t: "kw", f: "Đề có “<i>roll out a new API version to 10% of users</i>” ⇒ ?", b: "<b>Canary release deployment</b> trên stage (REST API)." },
      { t: "kw", f: "Đề có “<i>users around the world, reduce latency, REST API</i>” ⇒ ?", b: "<b>Edge-optimized endpoint</b>; cần tự kiểm soát CloudFront ⇒ Regional + CloudFront riêng." }
    ],
