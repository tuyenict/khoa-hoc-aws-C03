  window.DECK = {
    topics: [
      { id: "overview", name: "Streaming vs queue" },

      { id: "capacity", name: "Provisioned · on-demand · hot shard" },

    ],

    cards: [
      // ---- Tổng quan
      { t: "overview", f: "Ba vai trò trong một pipeline streaming?", b: "<b>Producer</b> (ghi dữ liệu) → <b>stream storage</b> (lưu tạm có thứ tự, chịu tải) → <b>consumer</b> (xử lý, phân tích, ghi xuống kho)." },
      { t: "overview", f: "SQS khác Kinesis Data Streams ở điểm cốt lõi nào?", b: "<b>SQS</b>: consumer nhận rồi <b>xóa</b> message, không replay.<br><b>KDS</b>: log có thứ tự theo shard; consumer <b>chỉ đọc</b>, dữ liệu còn tới hết retention ⇒ nhiều consumer, replay được." },
      { t: "overview", f: "Firehose có cho nhiều consumer đọc lại dữ liệu không?", b: "<b>Không.</b> Firehose là ống dẫn: nhận → buffer → giao tới <b>một đích</b>; không lưu để replay." },
      { t: "overview", f: "Tên cũ của Amazon Data Firehose và Managed Service for Apache Flink?", b: "<b>Kinesis Data Firehose</b> và <b>Kinesis Data Analytics</b>." },
      { t: "overview", f: "Độ trễ điển hình của KDS, Firehose, MSK, SQS?", b: "<b>KDS</b>: &lt; 1 giây (put-to-get).<br><b>Firehose</b>: near real-time theo buffer (mặc định 300 s với S3).<br><b>MSK</b>, <b>SQS</b>: mili-giây." },
      { t: "overview", f: "Amazon Kinesis Video Streams dùng khi nào?", b: "Thu nhận <b>video/âm thanh từ camera, thiết bị</b> để phân tích (vd Rekognition Video), phát lại." },
      { t: "overview", f: "Đề nói “<i>process each message once, delete after processing</i>” ⇒ chọn Kinesis?", b: "<b>Không</b> – vẫn là <b>SQS</b>." },

      // ---- KDS
      { t: "kds", f: "Data stream và shard trong KDS là gì?", b: "<b>Data stream</b>: tập hợp các shard.<br><b>Shard</b>: chuỗi data record, một đơn vị capacity cố định. Capacity stream = tổng capacity các shard." },
      { t: "kds", f: "Thông lượng ghi và đọc của mỗi shard?", b: "Ghi: <b>1 MB/s hoặc 1.000 record/s</b>.<br>Đọc: <b>2 MB/s, 5 giao dịch GetRecords/s</b> (chia chung giữa consumer thường)." },
      { t: "kds", f: "Data record gồm những gì?", b: "<b>Sequence number + partition key + data blob</b> (chuỗi byte bất biến, Kinesis không đọc/sửa)." },
      { t: "kds", f: "Partition key hoạt động thế nào?", b: "Chuỗi Unicode <b>≤ 256 ký tự</b>; Kinesis băm <b>MD5</b> ra số 128-bit để chọn shard theo hash key range. Cùng key ⇒ cùng shard ⇒ <b>giữ thứ tự</b>." },
      { t: "kds", f: "Thứ tự record trong KDS được đảm bảo ở phạm vi nào?", b: "<b>Trong một shard</b> (theo partition key), không phải trên toàn stream." },
      { t: "kds", f: "Sequence number do ai gán, đặc điểm gì?", b: "Kinesis gán sau PutRecord/PutRecords; duy nhất theo partition key trong shard, <b>tăng dần theo thời gian</b>.", x: "Không dùng làm “index” để tách tập dữ liệu." },
      { t: "kds", f: "Retention period của KDS?", b: "Mặc định <b>24 giờ</b>, tăng tới <b>8.760 giờ (365 ngày)</b> bằng IncreaseStreamRetentionPeriod; trên 24 giờ tính thêm phí." },
      { t: "kds", f: "Kinesis có xóa record sau khi consumer đọc không?", b: "<b>Không.</b> Record chỉ hết hạn theo retention; consumer tự checkpoint vị trí (KCL dùng DynamoDB)." },
      { t: "kds", f: "Mã hóa và truy cập riêng tư cho KDS?", b: "<b>Server-side encryption với AWS KMS</b>, TLS khi truyền, IAM + resource-based policy (cross-account), <b>interface VPC endpoint</b> (PrivateLink)." },
      { t: "kds", f: "KDS có tự giao dữ liệu tới S3/Redshift như Firehose không?", b: "Đáp án chuẩn của đề: <b>không</b> – cần consumer (Firehose, Lambda, KCL…). Mẫu chuẩn: <b>KDS → Firehose → S3</b>." },
      { t: "kds", f: "Consumer Lambda/KCL xử lý theo ngữ nghĩa nào? Hệ quả?", b: "<b>At-least-once</b> ⇒ có thể trùng lặp; code consumer nên <b>idempotent</b>." },

      // ---- Capacity
      { t: "capacity", f: "3 capacity mode của KDS?", b: "<b>On-demand Standard</b>, <b>On-demand Advantage</b>, <b>Provisioned</b>. Mọi tính năng (retention, mã hóa, EFO…) có ở cả hai loại." },
      { t: "capacity", f: "Provisioned mode tính phí và scale thế nào?", b: "Phí theo <b>shard-giờ</b> (+ PUT payload unit). Scale thủ công: <b>UpdateShardCount</b> hoặc split/merge – làm được khi đang chạy." },
      { t: "capacity", f: "On-demand Standard: capacity ban đầu và khả năng tự đáp ứng?", b: "Stream mới <b>4 MB/s ghi, 8 MB/s đọc</b>; tự đáp ứng tới <b>2× đỉnh ghi 30 ngày</b> trước. Vượt quá 2× trong 15 phút ⇒ có thể throttle.", x: "Trả tiền theo GB ghi và đọc." },
      { t: "capacity", f: "On-demand Advantage có gì đặc biệt?", b: "Cấp account; <b>warm throughput</b> làm nóng trước sự kiện; không phí cố định/stream; phí thấp hơn ≥ 60%; EFO tới <b>50 consumer</b>. Cam kết tối thiểu 25 MiB/s; bật rồi chờ ≥ 24 giờ mới tắt." },
      { t: "capacity", f: "Công thức tính số shard cho provisioned?", b: "<code>ceiling(max(ghi_KB/1024, đọc_KB/2048))</code>, với đọc = ghi × số consumer." },
      { t: "capacity", f: "5.000 thiết bị × 2 KB/s, 3 consumer dùng chung ⇒ cần bao nhiêu shard?", b: "Ghi 10.000 KB/s ⇒ 9,8; đọc 30.000 KB/s ⇒ 14,6 ⇒ <b>15 shard</b>. Dùng enhanced fan-out ⇒ chỉ cần <b>10 shard</b>." },
      { t: "capacity", f: "Shard split và shard merge?", b: "<b>Split</b>: 1 → 2 (tăng capacity, chi phí). <b>Merge</b>: 2 → 1. Luôn theo <b>cặp</b>; shard bị tác động là parent, shard mới là child. Chỉ provisioned." },
      { t: "capacity", f: "Đổi qua lại on-demand ↔ provisioned được bao nhiêu lần?", b: "Tối đa <b>2 lần trong 24 giờ</b> mỗi stream, không gián đoạn ứng dụng." },
      { t: "capacity", f: "Hot shard là gì, gây lỗi gì?", b: "Partition key phân bổ lệch ⇒ một shard vượt 1 MB/s hoặc 1.000 rec/s ⇒ <b>ProvisionedThroughputExceededException</b> dù tổng stream còn dư." },
      { t: "capacity", f: "Cách xử lý hot shard?", b: "Chọn partition key <b>độ phân tán cao</b> (userId, deviceId, hoặc ngẫu nhiên nếu không cần thứ tự); split hot shard; producer retry <b>exponential backoff</b>.", x: "Chỉ tăng tổng shard mà không đổi key thì không giải quyết được." },
      { t: "capacity", f: "On-demand có cô lập được một partition key quá nóng không?", b: "<b>Không.</b> Tự split shard khi vượt 500 KB/s, nhưng một key không vượt được 1 MB/s · 1.000 rec/s của một shard ⇒ key rất lệch nên dùng provisioned." },
      { t: "capacity", f: "Giới hạn GetRecords và shard iterator?", b: "GetRecords tối đa <b>10 MB / 10.000 record</b> mỗi lần; shard iterator hết hạn sau <b>5 phút</b>." },

      // ---- Producer & consumer
      { t: "consumer", f: "PutRecords ghi tối đa bao nhiêu record một lệnh? Lưu ý gì?", b: "<b>500 record</b>. Mỗi record có thể lỗi riêng ⇒ kiểm tra <b>FailedRecordCount</b> và retry phần lỗi." },
      { t: "consumer", f: "Kinesis Producer Library (KPL) mang lại gì?", b: "Tự <b>batch, aggregation</b> (gộp record nhỏ), <b>retry</b> tự động; đổi lại thêm chút độ trễ." },
      { t: "consumer", f: "Kinesis Agent là gì?", b: "Ứng dụng Java trên server Linux, <b>theo dõi file log</b> và gửi liên tục vào KDS hoặc Firehose." },
      { t: "consumer", f: "Shared throughput và enhanced fan-out khác nhau thế nào?", b: "<b>Shared</b>: 2 MB/s/shard chia chung, pull GetRecords, ~200 ms (1 consumer) → ~1.000 ms (5 consumer).<br><b>EFO</b>: 2 MB/s/shard <b>riêng mỗi consumer</b>, push HTTP/2 (SubscribeToShard), <b>~70 ms</b>." },
      { t: "consumer", f: "Tối đa bao nhiêu consumer enhanced fan-out mỗi stream?", b: "<b>20</b> (50 với On-demand Advantage). Có phí data retrieval + consumer-shard hour." },
      { t: "consumer", f: "KCL lưu metadata ở đâu?", b: "Bảng <b>DynamoDB</b> (lease, checkpoint) – 3 bảng mỗi ứng dụng; tên ứng dụng = tên bảng + namespace metric CloudWatch." },
      { t: "consumer", f: "<i>Parallelization factor</i> của Lambda với Kinesis?", b: "<b>1–10</b> batch đồng thời mỗi shard, <b>vẫn giữ thứ tự</b> theo partition key." },
      { t: "consumer", f: "IteratorAge tăng liên tục nghĩa là gì, xử lý ra sao?", b: "Consumer <b>đang chậm</b>. Tăng <b>parallelization factor</b>, thêm shard, tăng batch size, dùng EFO." },
      { t: "consumer", f: "Một record lỗi chặn cả shard trong Lambda ⇒ cấu hình gì?", b: "<b>Maximum retry attempts, maximum record age, bisect batch on function error</b>, on-failure destination (SQS/SNS/S3)." },
      { t: "consumer", f: "Khi nào chọn KCL app trên EC2/ECS thay vì Lambda?", b: "Cần kiểm soát hoàn toàn, xử lý <b>lâu hơn 15 phút</b>, thư viện đặc thù; KCL lo cân bằng shard, checkpoint, failover." },
      { t: "consumer", f: "Managed Service for Apache Flink dùng khi nào?", b: "Phân tích <b>có trạng thái</b>: aggregate theo cửa sổ thời gian, join stream, <b>phát hiện bất thường</b> (SQL/Java/Python)." },

      // ---- Firehose
      { t: "firehose", f: "Amazon Data Firehose là gì?", b: "Dịch vụ <b>fully managed</b> giao streaming data tới đích; không viết code consumer, <b>tự scale, không có shard</b>." },
      { t: "firehose", f: "3 loại nguồn của Firehose?", b: "<b>Direct PUT</b> (SDK, Agent, CloudWatch Logs, EventBridge, IoT…), <b>Kinesis Data Streams</b>, <b>Amazon MSK</b>." },
      { t: "firehose", f: "Kích thước record và giới hạn PutRecordBatch của Firehose?", b: "Record tối đa <b>1.000 KiB</b>; PutRecordBatch tối đa <b>500 record hoặc 4 MiB</b>." },
      { t: "firehose", f: "Buffer mặc định khi đích là S3?", b: "<b>5 MB hoặc 300 giây</b> – cái nào đạt trước thì giao (dải 1–128 MB, 0–900 s)." },
      { t: "firehose", f: "Firehose giao vào Redshift thế nào?", b: "Ghi vào <b>S3 trung gian</b> trước, rồi chạy lệnh <b>COPY</b> nạp vào Redshift." },
      { t: "firehose", f: "Firehose giữ dữ liệu bao lâu khi đích không sẵn sàng?", b: "Tới <b>24 giờ</b> (nguồn Direct PUT); nguồn KDS thì theo retention của KDS. Lỗi ghi vào S3 error output prefix." },
      { t: "firehose", f: "Lambda transform trong Firehose có giới hạn gì?", b: "Gọi <b>đồng bộ</b>, payload <b>6 MB</b>, Lambda tối đa <b>5 phút</b>; buffer 0,2–3 MB (mặc định 1 MB, 60 s)." },
      { t: "firehose", f: "Record format conversion cần những thành phần nào?", b: "<b>Deserializer</b> (OpenX / Hive JSON SerDe) + <b>schema trong Glue Data Catalog</b> + <b>serializer</b> (Parquet / ORC SerDe).", x: "Dữ liệu CSV ⇒ Lambda đổi sang JSON trước." },
      { t: "firehose", f: "Dynamic partitioning là gì?", b: "Phân vùng liên tục theo khóa trong dữ liệu (vd customer_id) vào các <b>S3 prefix</b> ⇒ Athena quét ít hơn. Mặc định <b>500 active partition</b>." },
      { t: "firehose", f: "Zero buffering có hạn chế gì?", b: "Chỉ cho đích ứng dụng; <b>không cho S3 backup</b>, không dùng với dynamic partitioning. Interval &lt; 60 s với S3 ⇒ multipart upload, tăng phí PUT." },
      { t: "firehose", f: "Firehose KHÔNG có đích nào hay bị bẫy?", b: "<b>DynamoDB, RDS, SQS</b>. Ghi stream vào DynamoDB ⇒ KDS + Lambda." },
      { t: "firehose", f: "Vì sao gửi nhiều record siêu nhỏ vào Firehose tốn tiền?", b: "Phí ingest tính theo record <b>làm tròn lên 5 KB</b> ⇒ nên gom lại." },

      // ---- MSK
      { t: "msk", f: "Amazon MSK là gì?", b: "<b>Apache Kafka được quản lý</b>, mã nguồn mở – ứng dụng, công cụ, plugin Kafka dùng được <b>không sửa code</b>. MSK lo control plane." },
      { t: "msk", f: "KRaft khác ZooKeeper thế nào trong MSK?", b: "<b>KRaft controller</b> thay ZooKeeper quản lý metadata, không tính thêm phí, không phải cấu hình." },
      { t: "msk", f: "MSK Provisioned Standard broker có đặc điểm gì?", b: "Tự chọn instance, số broker, <b>EBS 1 GiB – 16.384 GiB/broker</b>; hỗ trợ <b>tiered storage</b>." },
      { t: "msk", f: "MSK Express broker có ưu điểm gì?", b: "Storage tự scale, pay-as-you-go; tới <b>3× throughput</b>/broker, scale nhanh <b>20×</b>, phục hồi nhanh hơn 90%; không maintenance window; chỉ <b>3 AZ</b>." },
      { t: "msk", f: "MSK Serverless có giới hạn gì?", b: "<b>Bắt buộc IAM access control</b> (không Kafka ACL); 200 MBps ingress, 400 MBps egress, 2.400 partition, message ≤ 8 MiB, retention không giới hạn." },
      { t: "msk", f: "MSK tiered storage dùng để làm gì? Hạn chế?", b: "Tầng lưu trữ <b>giá rẻ, gần như vô hạn</b> – giữ dữ liệu lâu không cần thêm broker.", x: "Chỉ Provisioned Standard; không compacted topic, không t3.small; tối thiểu 3 ngày ở tầng rẻ." },
      { t: "msk", f: "MSK Connect là gì?", b: "<b>Kafka Connect được quản lý</b>: source connector (vd Debezium CDC) và sink connector (S3, OpenSearch…); tự scale worker, tự khởi động lại task lỗi." },
      { t: "msk", f: "MSK Replicator dùng để làm gì?", b: "Sao chép dữ liệu giữa các cluster MSK Provisioned <b>cùng hoặc khác Region</b> (≤ 1 GB/s ingress) – DR / active-active." },
      { t: "msk", f: "Các cách xác thực API Kafka trên MSK?", b: "<b>IAM access control</b>, <b>mutual TLS</b>, <b>SASL/SCRAM</b> (mật khẩu trong Secrets Manager) + Kafka ACLs." },

      // ---- Từ khóa
      { t: "kw", f: "Đề có “<i>multiple applications consume the same data</i>”, “<i>replay</i>”, “<i>ordering per device</i>” ⇒ ?", b: "<b>Kinesis Data Streams</b>." },
      { t: "kw", f: "Đề có “<i>load streaming data into S3/Redshift/OpenSearch</i>”, “<i>no code</i>”, “<i>convert to Parquet</i>” ⇒ ?", b: "<b>Amazon Data Firehose</b>." },
      { t: "kw", f: "Đề có “<i>migrate on-premises Kafka</i>”, “<i>Kafka APIs / Kafka Connect</i>” ⇒ ?", b: "<b>Amazon MSK</b> (không muốn quản lý capacity ⇒ MSK Serverless)." },
      { t: "kw", f: "Đề có “<i>real-time analytics with SQL / sliding windows / anomaly detection</i>” ⇒ ?", b: "<b>Amazon Managed Service for Apache Flink</b>." },
      { t: "kw", f: "Đề có “<i>multiple consumers, increased latency, ReadProvisionedThroughputExceeded</i>” ⇒ ?", b: "Bật <b>enhanced fan-out</b> cho từng consumer." },
      { t: "kw", f: "Đề có “<i>unpredictable / spiky traffic</i>”, “<i>do not want to manage shards</i>” ⇒ ?", b: "KDS <b>on-demand mode</b>." },
      { t: "kw", f: "Đề có “<i>stream database changes (CDC) into Kafka</i>”, “<i>Kafka to S3 without managing Connect workers</i>” ⇒ ?", b: "<b>MSK Connect</b> (Debezium source, S3 sink)." },
      { t: "kw", f: "Đề có “<i>retain Kafka data for a long time cheaply without adding brokers</i>” ⇒ ?", b: "<b>MSK tiered storage</b>." },
      { t: "kw", f: "Đề có “<i>DynamoDB item changes kept &gt; 24 hours / many consumers</i>” ⇒ ?", b: "<b>Kinesis Data Streams for DynamoDB</b> (DynamoDB Streams chỉ 24 giờ)." }
    ],
