  <!-- Dữ liệu trò chơi, rút từ lessons/bai-38-kms-secrets.html (định dạng: xem assets/games.js) -->
  <script>
  window.DECK = {
    topics: [
      { id: "kms", name: "Loại KMS key & vòng đời" },
      { id: "env", name: "Envelope encryption" },
      { id: "perm", name: "Key policy · IAM · Grant" },
      { id: "rot", name: "Rotation & Multi-Region keys" },
      { id: "hsm", name: "CloudHSM & key store" },
      { id: "sec", name: "Secrets Manager & Parameter Store" },
      { id: "acm", name: "ACM & Private CA" },
      { id: "kw", name: "Từ khóa đề ⇒ đáp án" }
    ],

    cards: [
      // ---- Loại KMS key
      { t: "kms", f: "Ba loại KMS key xét theo ai sở hữu/quản lý?", b: "<b>Customer managed key</b> (bạn tạo, toàn quyền)<br><b>AWS managed key</b> (dịch vụ tạo trong account bạn, alias <code>aws/&lt;service&gt;</code>)<br><b>AWS owned key</b> (nằm trong account của dịch vụ AWS)." },
      { t: "kms", f: "Customer managed key: rotation, giá, cross-account?", b: "Rotation <b>tùy chọn, mặc định tắt</b> (90–2560 ngày, mặc định 365)<br>Phí <b>hằng tháng + mỗi request</b><br><b>Share cross-account được</b> qua key policy." },
      { t: "kms", f: "AWS managed key: sửa key policy được không? Rotate thế nào?", b: "<b>Xem được, không sửa được</b>. Rotate <b>bắt buộc mỗi năm</b> (~365 ngày), không đổi lịch được.", x: "Từ 5/2022 lịch rotate đổi từ 3 năm sang mỗi năm." },
      { t: "kms", f: "AWS managed key có chia sẻ cross-account được không?", b: "<b>Không</b> – chỉ dùng trong account đó, cho dịch vụ đó.", x: "Snapshot mã hóa bằng aws/ebs không share sang account khác được." },
      { t: "kms", f: "AWS owned key: audit được không? Tốn phí không?", b: "<b>Không thấy</b> trong account, <b>không audit</b> trong CloudTrail, <b>miễn phí hoàn toàn</b>." },
      { t: "kms", f: "Vì sao AWS managed key được gọi là “legacy”?", b: "Từ <b>2021</b> không còn được tạo cho dịch vụ mới – các dịch vụ chuyển sang <b>AWS owned key</b> cho mã hóa mặc định. AWS managed key luôn <b>single-Region</b>." },
      { t: "kms", f: "Loại KMS key nào là loại duy nhất sinh được data key và dịch vụ AWS dùng để mã hóa dữ liệu?", b: "<b>Symmetric encryption key</b> (AES-256-GCM) – loại mặc định." },
      { t: "kms", f: "Asymmetric key và HMAC key dùng cho việc gì?", b: "<b>Asymmetric</b> (RSA, ECC, ML-DSA…): mã hóa/giải mã RSA, <b>Sign/Verify</b>, thỏa thuận khóa; public key tải xuống được.<br><b>HMAC</b>: <code>GenerateMac</code>/<code>VerifyMac</code> – kiểm tra toàn vẹn, xác thực token." },
      { t: "kms", f: "Các giá trị <i>key material origin</i>?", b: "<b>AWS_KMS</b> (mặc định) · <b>EXTERNAL</b> (BYOK/import) · <b>AWS_CLOUDHSM</b> · <b>EXTERNAL_KEY_STORE</b> (custom key store)." },
      { t: "kms", f: "Imported key material (BYOK) có đặc điểm gì?", b: "Bạn tự chịu <b>độ bền bản gốc</b>; đặt được <b>thời hạn hết hạn</b> hoặc gọi <code>DeleteImportedKeyMaterial</code> để <b>thu hồi ngay</b>; không có automatic rotation." },
      { t: "kms", f: "Alias KMS hữu ích nhất ở điểm nào?", b: "Alias <b>đổi trỏ sang key khác bất cứ lúc nào</b> ⇒ nền tảng của <b>manual rotation</b>.", x: "Tiền tố <code>aws/</code> dành riêng cho AWS managed key." },
      { t: "kms", f: "Waiting period khi xóa KMS key?", b: "<b>7–30 ngày</b> (mặc định <b>30</b>), trạng thái <b>Pending deletion</b>, <b>hủy được</b>.", x: "Trong lúc Pending deletion key không dùng được để mã hóa/giải mã và không được rotate." },
      { t: "kms", f: "Không chắc có nên xóa key không ⇒ làm gì?", b: "<b>Disable key</b> – đảo ngược được bất cứ lúc nào. Xóa là <b>không thể đảo ngược</b>." },
      { t: "kms", f: "Loại KMS key nào xóa được?", b: "Chỉ <b>customer managed key</b>. AWS managed / AWS owned key không xóa được." },
      { t: "kms", f: "Có làm thao tác mã hóa (Encrypt/Decrypt) trên console KMS được không?", b: "<b>Không</b> – chỉ qua SDK, CLI, Tools for PowerShell." },

      // ---- Envelope encryption
      { t: "env", f: "Envelope encryption là gì?", b: "Mã hóa dữ liệu bằng <b>data key</b>, rồi mã hóa data key bằng một key khác; key cuối cùng ở dạng plaintext là <b>root key</b> = <b>KMS key</b>, không rời HSM." },
      { t: "env", f: "<code>GenerateDataKey</code> trả về gì?", b: "Hai bản data key: <b>plaintext</b> (dùng mã hóa ngay rồi xóa khỏi bộ nhớ) và <b>encrypted data key</b> (lưu cạnh dữ liệu)." },
      { t: "env", f: "Khi giải mã theo envelope encryption, gửi gì lên KMS?", b: "Chỉ gửi <b>encrypted data key</b> (rất nhỏ) qua <code>Decrypt</code>; dữ liệu lớn <b>không bao giờ đi qua KMS</b>." },
      { t: "env", f: "KMS có lưu hoặc quản lý data key không?", b: "<b>Không.</b> KMS sinh, mã hóa, giải mã data key nhưng không lưu, không theo dõi, không mã hóa dữ liệu bằng data key." },
      { t: "env", f: "API <code>Encrypt</code> nhận tối đa bao nhiêu dữ liệu?", b: "<b>4 KB</b> ⇒ hợp cho mật khẩu, key nhỏ; dữ liệu lớn phải dùng envelope encryption.", x: "Bẫy: “gửi file 500 MB lên KMS bằng Encrypt” là sai." },
      { t: "env", f: "<code>GenerateDataKeyWithoutPlaintext</code> dùng khi nào?", b: "Chỉ trả về <b>bản đã mã hóa</b> – khi một thành phần chuẩn bị key trước, sẽ <code>Decrypt</code> lúc thật sự cần mã hóa." },
      { t: "env", f: "<code>ReEncrypt</code> làm gì?", b: "Giải mã rồi mã hóa lại bằng <b>KMS key khác ngay bên trong KMS</b>, plaintext không lộ ra ngoài." },
      { t: "env", f: "Rotate KMS key có re-encrypt dữ liệu cũ và rotate data key không?", b: "<b>Không.</b> Data key bị lộ ⇒ rotate KMS key không cứu được, phải mã hóa lại dữ liệu bằng data key mới." },
      { t: "env", f: "<i>ThrottlingException</i> khi đọc/ghi nhiều object SSE-KMS ⇒ xử lý?", b: "<b>S3 Bucket Keys</b>, <b>data key caching</b> (Encryption SDK) hoặc <b>xin tăng quota</b> request.", x: "Quota tính trên mọi request trong account + Region, kể cả request S3/EBS gọi thay bạn." },
      { t: "env", f: "Cross-account: KMS throttle account nào?", b: "<b>Account gửi request</b>, không phải account sở hữu key." },

      // ---- Phân quyền
      { t: "perm", f: "Mỗi KMS key có bao nhiêu key policy?", b: "<b>Đúng một</b>, bắt buộc. Key policy là cách chính để kiểm soát truy cập, và là <b>Regional</b>." },
      { t: "perm", f: "IAM policy allow <code>kms:Decrypt</code> nhưng vẫn AccessDenied ⇒ vì sao?", b: "<b>Key policy không cho phép</b> (thiếu statement bật IAM policy cho account root, hoặc không cho principal đó).", x: "IAM policy một mình không đủ; không ai, kể cả root, có quyền nếu không được cho phép rõ ràng." },
      { t: "perm", f: "Statement cho phép account root trong default key policy có tác dụng gì?", b: "<b>“Bật” IAM policy</b>: từ đó IAM policy trong account cấp được quyền dùng key." },
      { t: "perm", f: "Grant là gì? Đặc điểm?", b: "Ủy quyền <b>tạm thời</b> dùng một KMS key mà không sửa key policy/IAM policy. Mỗi grant <b>một key</b>, <b>chỉ allow</b>, cấp được cho principal account khác.", x: "Tối đa 50.000 grant trên mỗi key." },
      { t: "perm", f: "Grant mới chưa có hiệu lực ngay ⇒ làm gì?", b: "KMS là <b>eventual consistency</b> – dùng <b>grant token</b> để dùng quyền ngay." },
      { t: "perm", f: "Vì sao <code>kms:CreateGrant</code> là quyền nhạy cảm?", b: "Nhạy cảm <b>tương đương kms:PutKeyPolicy</b> – người có nó có thể cho người khác dùng key." },
      { t: "perm", f: "Account B dùng customer managed key của account A cần gì?", b: "Cần <b>CẢ HAI</b>: <b>key policy</b> (account A) cho phép account B + <b>IAM policy</b> (account B) cấp quyền cho role, trỏ tới key ARN." },
      { t: "perm", f: "Condition key <code>kms:ViaService</code> dùng làm gì?", b: "Giới hạn key <b>chỉ được dùng khi request đến qua một dịch vụ cụ thể</b> (vd chỉ qua S3 hoặc RDS)." },
      { t: "perm", f: "<i>Separation of duties</i> trong key policy là gì?", b: "Tách <b>key administrators</b> (alias, policy, rotate, lên lịch xóa) và <b>key users</b> (Encrypt, Decrypt, GenerateDataKey)." },

      // ---- Rotation & MRK
      { t: "rot", f: "Rotate KMS key thì key ID/ARN/policy có đổi không?", b: "<b>Không đổi</b> – chỉ thay key material hiện hành; KMS tự chọn đúng phiên bản cũ để giải mã ⇒ không sửa ứng dụng." },
      { t: "rot", f: "Ba cách xoay vòng KMS key và áp dụng cho loại nào?", b: "<b>Automatic</b>: symmetric, origin AWS_KMS<br><b>On-demand</b>: symmetric AWS_KMS và <b>EXTERNAL</b> (imported)<br><b>Manual</b> (alias): asymmetric, HMAC, custom key store." },
      { t: "rot", f: "Rotation period của automatic rotation?", b: "<b>90–2560 ngày</b>, mặc định <b>365</b>.", x: "“Rotate every 90 days” ⇒ đặt rotation period 90, không cần Lambda tạo key mới." },
      { t: "rot", f: "Manual rotation có giữ nguyên key ID không?", b: "<b>Không</b> – tạo key mới rồi đổi alias; <b>giữ key cũ</b> để giải mã dữ liệu cũ." },
      { t: "rot", f: "Phí khi rotate key material?", b: "Tính thêm phí tháng cho lần rotate <b>thứ nhất và thứ hai</b>; từ lần thứ ba không tính thêm." },
      { t: "rot", f: "Multi-Region keys là gì?", b: "Bộ KMS key ở nhiều Region có <b>cùng key ID (mrk-)</b> và <b>cùng key material</b> ⇒ mã hóa Region này, giải mã Region khác, không re-encrypt, không gọi cross-Region." },
      { t: "rot", f: "Multi-Region key: phần nào đồng bộ, phần nào độc lập?", b: "<b>Shared</b>: key ID, key material, origin, key spec, key usage, rotation.<br><b>Độc lập</b>: description, <b>key policy, grant, alias, tag</b>, enable/disable." },
      { t: "rot", f: "Chuyển key single-Region thành multi-Region được không?", b: "<b>Không.</b> Muốn chuyển phải re-encrypt bằng key mới.", x: "Cũng không tạo được multi-Region key trong custom key store." },
      { t: "rot", f: "AWS khuyến nghị khi nào dùng multi-Region key?", b: "Đa số dùng <b>single-Region</b>; chỉ dùng multi-Region khi cần <b>mã hóa/ký client-side ở nhiều Region</b> (DR, active-active, DynamoDB global tables)." },
      { t: "rot", f: "Muốn xóa primary multi-Region key phải làm gì trước?", b: "<b>Xóa hết replica</b>; waiting period của primary bắt đầu khi replica cuối cùng bị xóa." },

      // ---- CloudHSM
      { t: "hsm", f: "AWS CloudHSM là gì?", b: "HSM <b>single-tenant</b>, FIPS 140-2 / <b>140-3 Level 3</b>, chạy <b>trong VPC của bạn</b>; AWS lo phần cứng, <b>key và user do bạn toàn quyền</b>." },
      { t: "hsm", f: "CloudHSM hỗ trợ những chuẩn API nào?", b: "<b>PKCS #11</b>, <b>JCE</b>, <b>Microsoft CNG/KSP</b> ⇒ di chuyển ứng dụng mật mã on-premises lên cloud ít thay đổi." },
      { t: "hsm", f: "CloudHSM cluster có bao nhiêu HSM? HA thế nào?", b: "<b>1–28 HSM</b>/cluster (quota mặc định 6/account/Region). Trải HSM qua <b>nhiều AZ</b> để HA; thêm HSM để tăng hiệu năng." },
      { t: "hsm", f: "Use case điển hình của CloudHSM?", b: "<b>SSL/TLS offload</b>, <b>Oracle TDE</b> master key, private key của <b>issuing CA</b>, compliance PCI, ký tài liệu." },
      { t: "hsm", f: "CloudHSM key store: hạn chế gì?", b: "<b>Chỉ symmetric</b>; không asymmetric, HMAC, auto rotation, multi-Region, import; <b>1.800 req/s</b> (không tăng được), <b>không SLA</b>." },
      { t: "hsm", f: "External key store (XKS) dùng khi nào?", b: "Khi bắt buộc <b>key không được nằm trong AWS</b> (“hold your own key”) – HSM ngoài AWS qua XKS proxy; TPS thấp nhất, không SLA." },
      { t: "hsm", f: "Custom key store có an toàn hơn standard key store không?", b: "<b>Không.</b> Chỉ khác về <b>chi phí, độ phức tạp, hiệu năng</b>. Không dùng cho tải TPS cao." },
      { t: "hsm", f: "Mất credential user trên CloudHSM thì sao?", b: "AWS <b>không khôi phục</b> được key – user quản lý ngoài IAM, AWS không nhìn thấy." },

      // ---- Secrets Manager & Parameter Store
      { t: "sec", f: "Giới hạn chính của Secrets Manager?", b: "Secret tối đa <b>64 KB</b> · <b>500.000</b> secret/Region · <b>100</b> version/secret · rotate dày nhất <b>mỗi 4 giờ</b>." },
      { t: "sec", f: "Managed rotation áp dụng cho secret nào?", b: "Master user <b>RDS, Aurora, DocumentDB</b>; admin password <b>Redshift</b>; TLS cert ECS Service Connect – <b>không dùng Lambda</b>." },
      { t: "sec", f: "4 bước của Lambda rotation function?", b: "<code>create_secret</code> → <code>set_secret</code> → <code>test_secret</code> → <code>finish_secret</code>." },
      { t: "sec", f: "Ba staging label của secret?", b: "<b>AWSCURRENT</b> (đang dùng) · <b>AWSPENDING</b> (đang tạo) · <b>AWSPREVIOUS</b> (trước đó). Ứng dụng luôn đọc AWSCURRENT." },
      { t: "sec", f: "Single user vs alternating users rotation?", b: "<b>Single user</b>: đổi mật khẩu một user, đơn giản, cần retry with backoff.<br><b>Alternating users</b>: luân phiên hai user ⇒ <b>luôn có credential hợp lệ</b>, cho ứng dụng cần HA." },
      { t: "sec", f: "Rotation Lambda trong private subnet bị timeout khi gọi Secrets Manager ⇒ ?", b: "Thêm <b>VPC interface endpoint</b> cho Secrets Manager (hoặc <b>NAT gateway</b>)." },
      { t: "sec", f: "Replicate secret sang Region khác có đặc điểm gì?", b: "Replica <b>cùng ARN trừ phần Region</b>, rotation trên primary tự lan sang replica; <b>promote</b> thành standalone khi failover." },
      { t: "sec", f: "Ba kiểu parameter của Parameter Store?", b: "<b>String</b> · <b>StringList</b> (phân tách dấu phẩy) · <b>SecureString</b> (mã hóa KMS, đọc cần <code>kms:Decrypt</code> + WithDecryption)." },
      { t: "sec", f: "Standard vs Advanced tier của Parameter Store?", b: "<b>Standard</b>: 10.000 param, <b>4 KB</b>, miễn phí.<br><b>Advanced</b>: 100.000 param, <b>8 KB</b>, parameter policies, shared cross-account, tính phí, <b>không hạ về Standard</b>." },
      { t: "sec", f: "Ba parameter policy (Advanced tier)?", b: "<b>Expiration</b> (tự xóa) · <b>ExpirationNotification</b> · <b>NoChangeNotification</b>.", x: "Đây KHÔNG phải rotation – Parameter Store không có rotation." },
      { t: "sec", f: "Public parameter của Parameter Store dùng để làm gì?", b: "Chứa <b>AMI ID mới nhất</b> do AWS/hãng OS công bố ⇒ Launch Template tham chiếu thay vì hard-code AMI ID." },
      { t: "sec", f: "ECS task không thấy giá trị parameter mới ⇒ vì sao?", b: "Biến môi trường được <b>resolve lúc task khởi động</b> ⇒ phải chạy task mới / force deployment." },
      { t: "sec", f: "Tham chiếu secret của Secrets Manager từ Parameter Store thế nào?", b: "Đường dẫn <code>/aws/reference/secretsmanager/&lt;tên-secret&gt;</code> với GetParameter(s); Parameter Store chỉ là <b>pass-through</b>." },

      // ---- ACM
      { t: "acm", f: "Certificate public do ACM cấp: giá và thời hạn?", b: "<b>Miễn phí</b> ($0) · thời hạn <b>198 ngày</b> (trước đây 395 ngày)." },
      { t: "acm", f: "Certificate ACM là tài nguyên global hay regional?", b: "<b>Regional</b> – không copy giữa Region được; ALB ở nhiều Region ⇒ request certificate ở <b>từng Region</b>." },
      { t: "acm", f: "CloudFront cần certificate ACM ở Region nào?", b: "<b>US East (N. Virginia) – us-east-1</b>.", x: "Certificate không hiện khi sửa distribution ⇒ chưa tạo ở us-east-1." },
      { t: "acm", f: "Điều kiện để ACM tự gia hạn hoàn toàn (managed renewal)?", b: "Certificate ACM cấp, <b>DNS validation</b>, <b>đang gắn vào dịch vụ AWS</b> và CNAME validation <b>còn trên DNS</b>. Bắt đầu kiểm tra <b>45 ngày</b> trước hạn; ARN không đổi." },
      { t: "acm", f: "Imported certificate có được ACM tự gia hạn không?", b: "<b>Không</b> – phải tự gia hạn với CA rồi <b>re-import</b>; giám sát hạn bằng EventBridge/CloudWatch (DaysToExpiry)." },
      { t: "acm", f: "Wildcard <code>*.example.com</code> bảo vệ những gì?", b: "<b>Một cấp</b> subdomain (login.example.com). <b>Không</b> bảo vệ apex example.com và a.b.example.com ⇒ thêm apex vào SAN." },
      { t: "acm", f: "Cài certificate ACM public trực tiếp lên EC2 được không?", b: "<b>Không</b> (trừ Nitro Enclaves). Dùng <b>ACME</b> trên host, hoặc đặt <b>ALB</b> phía trước để terminate TLS." },
      { t: "acm", f: "Khi nào dùng AWS Private CA?", b: "Cấp <b>private certificate</b> cho microservice, thiết bị, IoT, <b>mTLS</b> nội bộ; export dùng được ở bất kỳ đâu trong PKI nội bộ." },

      // ---- Từ khóa
      { t: "kw", f: "Đề có “<i>control key rotation / key policy / audit key usage</i>”, “<i>share encrypted snapshot with another account</i>” ⇒ ?", b: "<b>Customer managed key</b>." },
