      { t: "big", f: "“<i>Security group trông thế nào tuần trước?</i>” ⇒ dịch vụ nào?", b: "<b>AWS Config</b> (configuration history), không phải CloudTrail." },

      { t: "met", f: "Lịch lưu giữ dữ liệu metric CloudWatch?", b: "&lt; 60 s ⇒ <b>3 giờ</b> · 1 phút ⇒ <b>15 ngày</b> · 5 phút ⇒ <b>63 ngày</b> · 1 giờ ⇒ <b>15 tháng</b> (455 ngày)." },
      { t: "met", f: "Đo độ trễ nên dùng statistic nào?", b: "<b>Percentile p99/p95</b>: Average che anomaly, Maximum bị một điểm lệch làm méo." },
      { t: "met", f: "Period hợp lệ của statistic?", b: "<b>1, 5, 10, 30</b> giây hoặc <b>bội của 60</b>; mặc định 60 giây. Dưới 60 s chỉ có ý nghĩa với high-resolution." },
      { t: "met", f: "EC2 basic vs detailed monitoring?", b: "<b>Basic</b>: mặc định, miễn phí, mỗi <b>5 phút</b>.<br><b>Detailed</b>: tính phí, mỗi <b>1 phút</b>.", x: "Cả hai đều không có memory/disk space – cần CloudWatch agent." },
      { t: "met", f: "Metric có xóa được không?", b: "<b>Không xóa được</b>; tự hết hạn sau <b>15 tháng</b> nếu không có dữ liệu mới." },
      { t: "met", f: "CloudWatch có tự gộp metric qua Region không?", b: "<b>Không</b> – metric chỉ ở Region tạo ra nó; gộp bằng <b>metric math</b>." },

      { t: "met", f: "Muốn alarm phát hiện ứng dụng “ngừng gửi metric” ⇒ ?", b: "<b>Publish giá trị 0</b> cho period không có dữ liệu (hoặc treat missing data = breaching)." },

      // ---- Alarms

      { t: "alarm", f: "Metric chỉ phát sinh khi có lỗi (ThrottledRequests) ⇒ treat missing data?", b: "<b>notBreaching</b>." },

      { t: "alarm", f: "Lịch sử alarm được giữ bao lâu? Số alarm tối đa?", b: "Lịch sử <b>30 ngày</b>; <b>không giới hạn</b> số alarm." },
      { t: "alarm", f: "Alarm period 60 s trên metric EC2 basic monitoring ⇒ vấn đề gì?", b: "Hay rơi vào <b>thiếu dữ liệu</b> vì metric chỉ có mỗi 5 phút ⇒ dùng period ≥ 300 s." },

      { t: "logs", f: "Log alarm khác metric filter + alarm thế nào?", b: "<b>Log alarm</b> chạy truy vấn Logs Insights <b>theo lịch</b> (M out of N), không cần metric filter." },
      { t: "logs", f: "Log đã nằm trong S3 muốn truy vấn SQL ⇒ ?", b: "<b>Athena</b>, không phải Logs Insights." },

      { t: "agent", f: "Application Signals, RUM, Container Insights, Lambda Insights?", b: "<b>Application Signals</b>: APM tự động (latency, error, SLO).<br><b>RUM</b>: người dùng thật.<br><b>Container Insights</b>: ECS/EKS.<br><b>Lambda Insights</b>: memory, cold start." },

      // ---- CloudTrail
      { t: "trail", f: "CloudTrail event history có gì?", b: "<b>90 ngày management events</b>, theo Region, chỉ đọc, <b>miễn phí</b>; không có data/Insights event." },

      { t: "trail", f: "CloudTrail Insights phát hiện gì?", b: "Bất thường về <b>API call rate</b> hoặc <b>API error rate</b> so với baseline." },
