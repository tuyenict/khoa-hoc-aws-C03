      { t: "cfn", f: "Các giá trị DeletionPolicy?", b: "<b>Delete</b> (mặc định) · <b>Retain</b> · <b>RetainExceptOnCreate</b> · <b>Snapshot</b> (EBS, RDS, ElastiCache, Redshift, Neptune, DocumentDB)." },

      { t: "cfn", f: "Drift detection là gì?", b: "So sánh property thực tế với template ⇒ phát hiện <b>sửa tay ngoài CloudFormation</b>. Stack: DRIFTED / IN_SYNC / NOT_CHECKED.", x: "Chỉ phát hiện, không tự sửa; không tự kiểm tra nested stack." },

      // ---- Beanstalk
      { t: "eb", f: "Application, application version, environment trong Beanstalk?", b: "<b>Application</b>: nhóm logic.<br><b>Version</b>: code có nhãn, trỏ tới source bundle trên <b>S3</b>.<br><b>Environment</b>: tài nguyên chạy một version." },

      { t: "eb", f: "Traffic splitting deployment?", b: "<b>Canary</b>: chuyển % traffic sang version mới trong thời gian đánh giá; <b>cần ALB</b>." },

      { t: "kw", f: "Đề có “<i>deploy to all accounts in the organization, including future accounts</i>” ⇒ ?", b: "<b>StackSets service-managed</b> + target OU + <b>automatic deployment</b>." },
      { t: "kw", f: "Đề có “<i>developers just upload code, least operational overhead</i>” ⇒ ?", b: "<b>Elastic Beanstalk</b>." },

      { t: "kw", f: "Đề có “<i>patch EC2 and on-premises weekly, report compliance</i>” ⇒ ?", b: "<b>Patch Manager</b> + patch baseline + Maintenance Windows." }
