  <!-- Dữ liệu trò chơi, rút từ lessons/bai-42-disaster-recovery.html (định dạng: xem assets/games.js) -->
  <script>
  window.DECK = {
    topics: [
      { id: "basic", name: "DR & BCP" },
      { id: "rpo", name: "RPO · RTO" },
      { id: "strat", name: "4 chiến lược DR" },
      { id: "data", name: "Sao chép & backup dữ liệu" },
      { id: "fail", name: "Failover · data plane" },
      { id: "drs", name: "AWS Elastic Disaster Recovery" },
      { id: "test", name: "Kiểm thử & drift" },
      { id: "kw", name: "Từ khóa đề ⇒ đáp án" }
    ],

    cards: [
      // ---- DR & BCP
      { t: "basic", f: "Disaster recovery (DR) khác high availability (HA) thế nào?", b: "<b>HA</b>: chịu hỏng hóc thường ngày của một thành phần (một instance, một AZ).<br><b>DR</b>: kế hoạch khi <b>cả một phạm vi lớn bị mất</b> – thường là cả Region hoặc toàn bộ dữ liệu bị hỏng.", x: "Multi-AZ là HA, không phải DR cấp Region." },
      { t: "basic", f: "Kế hoạch DR liên quan thế nào tới BCP?", b: "DR là <b>tập con</b> của <b>business continuity plan (BCP)</b>, không phải tài liệu đứng riêng.", x: "Ví dụ: động đất làm không vận chuyển được hàng – website vẫn chạy nhưng BCP phải tính khâu vận chuyển." },
      { t: "basic", f: "Business impact analysis (BIA) dùng để làm gì?", b: "Định lượng tác động khi workload gián đoạn ⇒ workload phải sẵn sàng lại <b>nhanh đến mức nào</b> và <b>chấp nhận mất bao nhiêu dữ liệu</b>.", x: "Tác động có thể phụ thuộc thời điểm (hệ thống trả lương sập ngay trước ngày trả lương)." },
      { t: "basic", f: "Chi phí khôi phục cao hơn chi phí của sự cố thì sao?", b: "<b>Không nên triển khai</b> – trừ khi có lý do phụ như <b>yêu cầu pháp lý</b>.", x: "Với workload ít quan trọng, không có DR cũng là quyết định hợp lệ nếu được cân nhắc có hiểu biết." },
      { t: "basic", f: "DR trên AWS khác DR truyền thống ở điểm nào về chi phí?", b: "Đổi <b>chi phí vốn cố định</b> của data center dự phòng thành <b>chi phí vận hành biến đổi</b> của môi trường vừa đủ dùng; test đơn giản, lặp lại được, thường xuyên hơn." },
      { t: "basic", f: "Workload Multi-AZ được thiết kế tốt, thảm họa “mất một data center” cần chiến lược gì?", b: "Theo tài liệu, có thể <b>chỉ cần Backup &amp; Restore</b> (thêm continuous backup trong Region để chống lỗi con người)." },
      { t: "basic", f: "Data residency mà quốc gia chỉ có một Region thì làm DR thế nào?", b: "Dùng <b>các AZ như những “địa điểm” tách biệt</b>; các chiến lược DR làm được giữa các AZ thay vì giữa Region." },

      // ---- RPO / RTO
      { t: "rpo", f: "RPO là gì?", b: "<b>Recovery Point Objective</b>: khoảng thời gian tối đa chấp nhận được kể từ <b>điểm khôi phục dữ liệu gần nhất</b> ⇒ “<b>được phép mất bao nhiêu dữ liệu?</b>”", x: "Nhìn về quá khứ tính từ lúc sự cố." },
      { t: "rpo", f: "RTO là gì?", b: "<b>Recovery Time Objective</b>: độ trễ tối đa chấp nhận được <b>từ lúc gián đoạn tới lúc khôi phục dịch vụ</b> ⇒ “<b>được phép ngừng bao lâu?</b>”", x: "Nhìn về tương lai tính từ lúc sự cố." },
      { t: "rpo", f: "Yếu tố nào quyết định RPO?", b: "<b>Tần suất backup</b> hoặc <b>độ trễ sao chép</b>: backup mỗi 24 giờ ⇒ RPO ~24 giờ; sao chép liên tục ⇒ RPO giây." },
      { t: "rpo", f: "Yếu tố nào quyết định RTO?", b: "Lượng hạ tầng <b>đã chạy sẵn</b> ở nơi khôi phục, mức <b>tự động hóa</b>, thời gian restore dữ liệu, thời gian chuyển DNS/traffic." },
      { t: "rpo", f: "Ai đặt RPO/RTO?", b: "<b>Tổ chức tự định nghĩa</b> (từ BIA + risk assessment), không phải thông số AWS áp đặt." },
      { t: "rpo", f: "“<i>Can tolerate losing at most 15 minutes of data</i>” là RPO hay RTO?", b: "<b>RPO</b> = 15 phút.", x: "“Must be back online within 15 minutes” mới là RTO." },
      { t: "rpo", f: "Thứ tự đọc đề DR?", b: "<b>(1) RPO → (2) RTO → (3) cost-effective / least operational overhead</b>. Chọn chiến lược <b>rẻ nhất vẫn đạt</b>, không phải mạnh nhất." },

      // ---- 4 chiến lược
      { t: "strat", f: "Ba chiến lược DR nào là active/passive?", b: "<b>Backup &amp; Restore, Pilot Light, Warm Standby</b>: site thụ động không phục vụ traffic cho đến khi failover." },
      { t: "strat", f: "Backup &amp; Restore: Region DR có gì, RPO/RTO cỡ nào?", b: "Chỉ có <b>bản backup</b> (snapshot, AMI, S3) + <b>template IaC</b>. RPO/RTO tính bằng <b>giờ</b>; chi phí thấp nhất." },
      { t: "strat", f: "Ba thứ phải sao lưu trong Backup &amp; Restore?", b: "<b>Dữ liệu</b> (point-in-time) · <b>hạ tầng</b> (IaC: CloudFormation/CDK) · <b>code và cấu hình</b> (gồm AMI; CodePipeline để deploy lại).", x: "Không có IaC, khôi phục ở Region mới có thể vượt RTO." },
      { t: "strat", f: "Pilot Light: cái gì luôn bật, cái gì “tắt”?", b: "<b>Luôn bật</b>: data store nhận dữ liệu sao chép (DB, object storage), hạ tầng lõi.<br><b>“Tắt”</b>: application server (tốt nhất là <b>chưa deploy</b>, vd ASG desired = 0)." },
      { t: "strat", f: "Pilot Light khác Warm Standby ở điểm cốt lõi nào?", b: "<b>Pilot Light</b>: không xử lý được request nếu chưa bật server rồi scale.<br><b>Warm Standby</b>: <b>xử lý traffic ngay</b> ở capacity giảm, chỉ cần scale up.", x: "Tài liệu khuyên dùng nhu cầu RTO/RPO để chọn giữa hai cách." },
      { t: "strat", f: "Warm Standby là gì?", b: "Bản sao <b>thu nhỏ nhưng đầy đủ chức năng</b> của production <b>luôn chạy</b> ở Region khác; dễ test liên tục." },
      { t: "strat", f: "Hot standby là gì?", b: "Region DR chạy <b>đủ capacity production</b> ngay từ đầu (<b>statically stable</b>) nhưng <b>không nhận traffic</b>; không phụ thuộc Auto Scaling khi failover." },
      { t: "strat", f: "Hot standby khác active/active ở điểm nào?", b: "Chi phí tương đương; khác ở chỗ Region thứ hai <b>có phục vụ người dùng hay không</b> (active/active: có; hot standby: chỉ để DR)." },
      { t: "strat", f: "Multi-site active/active: RTO, chi phí, failover?", b: "RTO <b>gần 0</b>, chi phí <b>cao nhất</b>; mọi Region phục vụ người dùng ⇒ <b>không có khái niệm failover</b>.", x: "Thảm họa dữ liệu (corruption) vẫn phải dựa vào backup ⇒ recovery point ≠ 0." },
      { t: "strat", f: "Vì sao Auto Scaling ở Region DR làm giảm độ bền của chiến lược?", b: "Auto Scaling (tăng desired capacity) là thao tác <b>control plane</b>.", x: "Kiểu lai: deploy đủ cho traffic ban đầu, sau đó để Auto Scaling tăng dần." },
      { t: "strat", f: "Trong Pilot Light, CloudFormation deploy bản thu nhỏ ở Region DR bằng cách nào?", b: "Dùng <b>pseudo parameter</b> (<code>AWS::Region</code>, <code>AWS::AccountId</code>) + <b>Conditions</b> để chỉ deploy bản thu nhỏ/tắt khi template chạy ở Region DR." },
      { t: "strat", f: "Golden AMI cho DR tạo bằng gì?", b: "Pipeline <b>EC2 Image Builder</b>, copy sang cả Region chính lẫn Region DR." },
      { t: "strat", f: "Active/active: ba chiến lược ghi dữ liệu?", b: "<b>Write global</b>: mọi ghi về một Region (Aurora Global Database).<br><b>Write local</b>: ghi vào Region gần nhất (DynamoDB global tables).<br><b>Write partitioned</b>: ghi theo partition key (S3 replication hai chiều)." },
      { t: "strat", f: "DynamoDB global tables giải quyết xung đột ghi đồng thời thế nào?", b: "<b>Last writer wins</b> – bản ghi sau cùng thắng." },

      // ---- Dữ liệu
      { t: "data", f: "Vì sao sao chép liên tục không thay được backup?", b: "Replication <b>sao chép luôn dữ liệu bị hỏng / bị xóa / bị ransomware mã hóa</b> ⇒ vẫn cần <b>point-in-time backup</b>.", x: "Khi đó RPO luôn &gt; 0, điểm khôi phục là trước lúc phát hiện." },
      { t: "data", f: "Cross-account backup chống được loại thảm họa nào?", b: "<b>Insider threat</b> hoặc <b>account bị chiếm quyền</b>: kẻ tấn công không với tới backup ở account khác." },
      { t: "data", f: "Metadata EC2 mà AWS Backup lưu (instance type, SG, IAM role…) dùng được ở đâu?", b: "<b>Chỉ khi restore trong cùng Region</b>." },
      { t: "data", f: "S3 replication: xóa object ở bucket nguồn thì bucket DR sao?", b: "Mặc định xóa ở nguồn <b>chỉ thêm delete marker ở bucket nguồn</b> ⇒ dữ liệu ở Region DR được bảo vệ." },
      { t: "data", f: "AWS Backup có restore theo lịch/tự động không?", b: "Theo whitepaper <b>chưa hỗ trợ</b>. Tự làm: <b>AWS Backup → SNS → Lambda</b> gọi API restore rồi kiểm tra dữ liệu." },
      { t: "data", f: "Vì sao nên restore định kỳ trước, không đợi thảm họa?", b: "<b>Restore là thao tác control plane</b> – có thể không khả dụng đúng lúc thảm họa; restore sẵn ⇒ có data store chạy được từ backup gần đây." },
      { t: "data", f: "Aurora Global Database cho DR: độ trễ và thời gian promote?", b: "Lag sang Region phụ thường <b>dưới 1 giây</b>; promote Region phụ nhận đọc/ghi trong <b>dưới 1 phút</b>." },
      { t: "data", f: "RDS cross-Region read replica khi failover?", b: "<b>Promote</b> replica thành primary; với engine không phải Aurora mất <b>vài phút</b> và có <b>reboot</b>." },
      { t: "data", f: "Kể các dịch vụ sao chép liên tục cross-Region trong bài.", b: "S3 Replication (+ RTC), RDS cross-Region read replica, <b>Aurora Global Database</b>, <b>DynamoDB global tables</b>, DocumentDB global clusters, ElastiCache Global Datastore." },
      { t: "data", f: "Dữ liệu backup chỉ cần lấy về trong vài giờ ⇒ lưu ở đâu cho rẻ?", b: "<b>S3 Glacier / Glacier Deep Archive</b>." },

      // ---- Failover
      { t: "fail", f: "Data plane và control plane khác nhau thế nào? Failover nên dựa vào đâu?", b: "<b>Data plane</b>: phục vụ thời gian thực (trả lời DNS, health check).<br><b>Control plane</b>: cấu hình (sửa record, tạo instance, đổi desired capacity, restore).<br>Failover nên <b>chỉ dùng data plane</b> vì sẵn sàng cao hơn." },
      { t: "fail", f: "Amazon Application Recovery Controller (ARC) routing control là gì?", b: "Route 53 health check <b>không thật sự kiểm tra sức khỏe</b> mà là <b>công tắc bật/tắt</b> bạn điều khiển qua <b>data plane API</b> ⇒ cách tốt nhất cho <b>failover thủ công</b>." },
      { t: "fail", f: "Đổi weight Route 53 hay chỉnh traffic dial Global Accelerator thuộc plane nào?", b: "<b>Control plane</b> – kém bền vững hơn ARC routing control." },
      { t: "fail", f: "Vì sao failover tự động theo alarm cần thận trọng?", b: "RTO/RPO luôn &gt; 0; failover do <b>báo động giả</b> gây mất mát vô ích ⇒ thường <b>khởi động thủ công</b>, nhưng các bước bên trong phải tự động hóa." },
      { t: "fail", f: "Ưu điểm của Global Accelerator so với DNS failover?", b: "<b>Độ trễ thấp hơn</b> (vào backbone AWS tại edge) và <b>không bị ảnh hưởng bởi DNS cache</b> (client giữ IP cũ tới hết TTL)." },
      { t: "fail", f: "CloudFront origin failover hoạt động theo đơn vị nào?", b: "<b>Theo từng request</b>: origin chính lỗi thì gửi request đó tới origin phụ; request sau vẫn tới origin chính trước." },
      { t: "fail", f: "Route 53 failover routing policy tương ứng mô hình nào?", b: "<b>Active-passive</b> (Primary/Secondary). Các policy khác (weighted, latency…) kèm health check = active-active." },

      // ---- DRS
      { t: "drs", f: "AWS Elastic Disaster Recovery (DRS) làm gì?", b: "Sao chép <b>block-level liên tục</b> máy chủ (on-prem, cloud khác, EC2) vào <b>staging area</b> giá rẻ; launch recovery instance trong vài phút.", x: "Kế thừa CloudEndure Disaster Recovery." },
      { t: "drs", f: "DRS dùng được cho workload nào trên AWS?", b: "Chỉ khi gồm ứng dụng và database <b>chạy trên EC2</b> – <b>không cho RDS/Aurora</b>." },
      { t: "drs", f: "DRS áp dụng chiến lược DR nào theo whitepaper?", b: "<b>Pilot Light</b>: dữ liệu + tài nguyên “tắt” ở staging area; failover thì tạo bản full capacity ở VPC đích." },
      { t: "drs", f: "DRS dùng port nào cho dữ liệu và điều khiển?", b: "<b>TCP 1500</b>: dữ liệu block từ source → staging (TLS 1.2, nén, mã hóa).<br><b>TCP 443</b>: tới dịch vụ DRS, S3, EC2 endpoint." },
      { t: "drs", f: "RPO và RTO điển hình của DRS?", b: "RPO <b>giây</b> (crash-consistent, thường &lt; 1 giây) · RTO <b>5–20 phút</b> (phụ thuộc thời gian boot OS: Linux ~5, Windows ~20 phút)." },
      { t: "drs", f: "Lịch PIT snapshot của DRS?", b: "1 / <b>10 phút</b> cho 1 giờ gần nhất · 1 / <b>giờ</b> cho 24 giờ · 1 / <b>ngày</b> cho 7 ngày (mặc định, chỉnh 1–365 ngày).", x: "Chỉ chỉnh được số ngày, không đổi được tần suất." },
      { t: "drs", f: "Ví dụ băng thông DRS: 10 server, mỗi server ghi 10 MB/s?", b: "Cần ít nhất <b>100 MB/s</b>: băng thông trung bình phải lớn hơn tốc độ ghi để giữ RPO giây." },
      { t: "drs", f: "Crash-consistent nghĩa là gì?", b: "Có mọi dữ liệu <b>đã ghi xuống đĩa</b>; dữ liệu chỉ nằm trong RAM thì không được sao chép." },
      { t: "drs", f: "DRS failback thế nào?", b: "Sao chép ngược dữ liệu về site gốc bằng <b>Failback Client</b> (chỉ x86_64); với workload AWS có <b>reverse replication</b> về EC2 gốc." },
      { t: "drs", f: "DRS drill là gì?", b: "Launch thử <b>không gián đoạn</b> production để xác nhận sẵn sàng; DRS tự convert máy để boot native trên AWS." },

      // ---- Test
      { t: "test", f: "Vì sao phải test DR thường xuyên?", b: "“Cách khôi phục duy nhất hoạt động được là con đường bạn <b>kiểm thử thường xuyên</b>” ⇒ ít đường khôi phục, test đều đặn." },
      { t: "test", f: "Lỗi kinh điển khi scale lên ở Region DR?", b: "<b>Service quotas</b> ở Region DR không đủ ⇒ ASG không launch đủ instance." },
      { t: "test", f: "Chống configuration drift ở Region DR bằng gì?", b: "Cùng <b>template IaC / StackSets</b> cho cả hai Region + <b>AWS Config</b> (phát hiện drift, gọi SSM Automation) + CloudFormation drift detection." },
      { t: "test", f: "Dịch vụ theo dõi workload có đạt RTO/RPO không?", b: "<b>AWS Resilience Hub</b>." },

      // ---- Từ khóa
      { t: "kw", f: "“<i>RPO/RTO of hours… lowest cost</i>” ⇒ ?", b: "<b>Backup &amp; Restore</b>: AWS Backup copy cross-Region + AMI copy + CloudFormation template." },
      { t: "kw", f: "“<i>Database replicated to DR Region, app servers launched only during a disaster</i>” ⇒ ?", b: "<b>Pilot Light</b>." },
      { t: "kw", f: "“<i>Scaled-down but fully functional copy always running… handle traffic immediately</i>” ⇒ ?", b: "<b>Warm Standby</b>." },
      { t: "kw", f: "“<i>Cross-Region relational DR, RPO seconds, RTO under a minute</i>” ⇒ ?", b: "<b>Aurora Global Database</b> (không phải RDS cross-Region read replica)." },
      { t: "kw", f: "“<i>Users in every Region can write with low latency</i>” ⇒ ?", b: "<b>DynamoDB global tables</b> (write local)." },
      { t: "kw", f: "“<i>Highly reliable manual failover controlled by operators</i>” ⇒ ?", b: "<b>Route 53 ARC routing control</b>." },
      { t: "kw", f: "“<i>Static IP addresses, fast regional failover not affected by DNS caching</i>” ⇒ ?", b: "<b>AWS Global Accelerator</b>." },
      { t: "kw", f: "“<i>On-premises VMware servers… AWS as DR site… RPO seconds, RTO minutes</i>” ⇒ ?", b: "<b>AWS Elastic Disaster Recovery</b>.", x: "Migrate hẳn (rehost) ⇒ AWS MGN, không phải DRS." },
      { t: "kw", f: "“<i>Recover servers to a point in time before a ransomware attack</i>” ⇒ ?", b: "<b>DRS point-in-time snapshot</b> (hoặc AWS Backup cho dịch vụ được hỗ trợ)." },
      { t: "kw", f: "“<i>Protect backups from a compromised account</i>” ⇒ ?", b: "<b>Copy backup sang account khác</b> (cross-account) + Vault Lock." },
      { t: "kw", f: "“<i>Continuously validate whether workloads meet RTO and RPO</i>” ⇒ ?", b: "<b>AWS Resilience Hub</b>." },
      { t: "kw", f: "“<i>Recover quickly in another Region without manual configuration errors</i>” ⇒ ?", b: "<b>IaC (CloudFormation/CDK)</b>, không phải runbook làm tay." }
    ],

    pairs: [
      ["RPO", "Lượng dữ liệu tối đa được phép mất"],
      ["RTO", "Thời gian ngừng dịch vụ tối đa chấp nhận được"],
      ["BCP", "Kế hoạch kinh doanh liên tục, chứa kế hoạch DR"],
      ["BIA", "Định lượng tác động gián đoạn để đặt RTO/RPO"],
      ["Risk assessment", "Loại thảm họa, phạm vi địa lý, xác suất"],
