  window.DECK = {

    ],

    cards: [
      // ---- Tổng quan
      { t: "over", f: "Ba giai đoạn của một dự án migration lớn?", b: "<b>Assess</b> (lý do kinh doanh, chi phí, mức sẵn sàng) → <b>Mobilize</b> (discovery, phụ thuộc, chọn 7 Rs, landing zone) → <b>Migrate &amp; modernize</b> (theo wave, tối ưu sau)." },
      { t: "over", f: "Ba dịch vụ di chuyển chính trong bài?", b: "<b>MGN</b> cho máy chủ · <b>DMS</b> cho database · <b>Migration Hub / Application Discovery Service</b> cho khám phá và theo dõi." },
      { t: "over", f: "Tên hiện tại của AWS MGN trong tài liệu?", b: "<b>AWS Transform MGN</b> – cùng dịch vụ với AWS Application Migration Service.", x: "MGN kế thừa CloudEndure Migration và thay AWS Server Migration Service (SMS) cũ." },
      { t: "over", f: "Tình trạng Migration Hub và Application Discovery Service?", b: "<b>Không còn mở cho khách hàng mới</b> (Migration Hub từ 7/11/2025); AWS khuyến nghị <b>AWS Transform</b>. Đề vẫn có thể nhắc tới." },
      { t: "over", f: "Wave là gì?", b: "<b>Đợt di chuyển</b>: nhóm ứng dụng được di chuyển cùng nhau (server phụ thuộc chặt đi cùng wave)." },

      // ---- 7 Rs
      { t: "rs", f: "Kể 7 Rs.", b: "<b>Retire, Retain, Rehost, Relocate, Repurchase, Replatform, Refactor</b>.", x: "Retire và Retain là hai quyết định không di chuyển." },
      { t: "rs", f: "Retire dùng khi nào?", b: "Ứng dụng <b>không còn giá trị</b>; giảm rủi ro OS hết hỗ trợ; <b>zombie</b> (CPU/RAM &lt; 5%) hoặc <b>idle</b> (5–20% trong 90 ngày); không có kết nối inbound trong 90 ngày." },
      { t: "rs", f: "Retain (Revisit) dùng khi nào?", b: "Data residency/tuân thủ, rủi ro cao, phụ thuộc ứng dụng khác, <b>vừa nâng cấp</b>, đợi bản SaaS, phần cứng đặc thù, <b>mainframe</b>/Unix không x86." },
      { t: "rs", f: "Rehost còn gọi là gì? Công cụ?", b: "<b>Lift and shift</b> – không đổi ứng dụng. Công cụ: <b>AWS MGN</b>, Cloud Migration Factory, VM Import/Export." },
      { t: "rs", f: "Relocate là gì?", b: "Chuyển nhiều server cùng lúc sang <b>phiên bản cloud của cùng nền tảng</b> (VMware on-prem → VMware trên AWS), hoặc chuyển tài nguyên sang <b>VPC/Region/account khác</b> (vd RDS instance).", x: "Tài liệu gọi đây là cách nhanh nhất vì không ảnh hưởng kiến trúc." },
      { t: "rs", f: "Repurchase còn gọi là gì?", b: "<b>Drop and shop</b> – thay bằng sản phẩm khác, thường là <b>SaaS</b>." },
      { t: "rs", f: "Replatform còn gọi là gì? Ví dụ kinh điển?", b: "<b>Lift, tinker, and shift</b>. Ví dụ: SQL Server tự quản → <b>Amazon RDS for SQL Server</b>; VM → container (App2Container); Windows → Linux; Graviton." },
      { t: "rs", f: "Refactor (re-architect) là gì?", b: "Thiết kế lại theo <b>cloud-native</b> (monolith → microservices/serverless). <b>Phức tạp và tốn kém nhất</b>." },
      { t: "rs", f: "Chiến lược khuyến nghị cho migration lớn?", b: "<b>Rehost / relocate / replatform trước, hiện đại hóa sau</b>; refactor không khuyến nghị trong lúc di chuyển lớn." },
      { t: "rs", f: "Cài lại SQL Server trên EC2 là rehost hay replatform?", b: "<b>Rehost</b> (về bản chất). Chuyển sang <b>RDS</b> mới là replatform.", x: "Bẫy kinh điển." },
      { t: "rs", f: "Replatform khác Refactor ở điểm nào?", b: "<b>Replatform</b> giữ kiến trúc lõi, chỉ “tinker”.<br><b>Refactor</b> đổi kiến trúc (microservices, Lambda + DynamoDB)." },
      { t: "rs", f: "Công cụ đưa VM .NET/Java vào container không sửa code?", b: "<b>AWS App2Container</b> (replatform)." },
      { t: "rs", f: "Công cụ port .NET Framework sang .NET Core?", b: "<b>Porting Assistant for .NET</b> (replatform)." },

      // ---- Discovery
      { t: "disc", f: "AWS Application Discovery Service thu thập gì?", b: "Cấu hình, mức sử dụng CPU/RAM/disk, <b>kết nối mạng</b> giữa server on-prem ⇒ lập kế hoạch, nhóm thành ứng dụng, ước tính chi phí, khuyến nghị EC2." },
      { t: "disc", f: "Agentless Collector triển khai thế nào, thấy gì?", b: "<b>File OVA qua VMware vCenter</b>, không cài agent trên VM. Thu cấu hình tĩnh + CPU/RAM/Disk I/O, kết nối mạng; chu kỳ <b>~60 phút</b>.", x: "Không thấy process đang chạy; chỉ VMware VM, không cho physical server." },
      { t: "disc", f: "Discovery Agent khác Agentless Collector thế nào?", b: "Cài <b>trên từng VM và physical server</b> (Windows/Linux); có <b>process đang chạy</b>, time-series chi tiết, kết nối mạng; chu kỳ <b>~15 giây</b>; export sang <b>Athena</b>/CSV." },
      { t: "disc", f: "Cách thu thập thứ ba (không cần collector/agent)?", b: "<b>File-based import</b>: template Migration Hub hoặc export từ <b>RVTools</b> (chỉ một snapshot)." },
      { t: "disc", f: "Collector nào lấy được thông tin database (Oracle, SQL Server…)?", b: "<b>Agentless Collector</b> (module database &amp; analytics); Discovery Agent thì không." },
      { t: "disc", f: "AWS Migration Hub làm gì?", b: "<b>Một nơi duy nhất</b> xem server đã khám phá, nhóm ứng dụng, theo dõi tiến độ migration; nhận trạng thái từ <b>MGN và DMS</b>." },
      { t: "disc", f: "Home Region của Migration Hub là gì?", b: "Region lưu <b>dữ liệu theo dõi + discovery</b>; phải chọn trước mọi thao tác. Agent/collector/import chỉ dùng ở home Region.", x: "Vẫn di chuyển được vào bất kỳ Region nào – chỉ dữ liệu theo dõi nằm ở home Region." },
      { t: "disc", f: "DMS Fleet Advisor làm gì?", b: "Kiểm kê <b>database on-prem</b> từ vị trí trung tâm, không cài trên từng máy (SQL Server, MySQL, Oracle, PostgreSQL); tạo target recommendations." },
      { t: "disc", f: "Ba thành phần đi kèm Migration Hub?", b: "<b>Strategy Recommendations</b> (gợi ý chiến lược) · <b>Refactor Spaces</b> (refactor dần sang microservices) · <b>Migration Hub Orchestrator</b> (template workflow)." },

      // ---- MGN
      { t: "mgn", f: "AWS MGN di chuyển máy chủ bằng cơ chế nào?", b: "<b>Continuous block-level replication</b> + chuyển đổi để chạy native trên EC2; cutover thường <b>vài phút</b>. Dịch vụ khuyến nghị cho <b>lift-and-shift</b>." },
      { t: "mgn", f: "Port của MGN?", b: "<b>TCP 1500</b>: source → replication server (dữ liệu, TLS 1.2).<br><b>TCP 443</b>: source &amp; staging subnet → MGN API endpoint." },
      { t: "mgn", f: "Replication server của MGN là gì, ở đâu?", b: "EC2 nhỏ (Amazon Linux 2023) trong <b>staging area subnet</b>, ghi dữ liệu vào EBS giá rẻ." },
      { t: "mgn", f: "Conversion server làm gì?", b: "Khi launch test/cutover, <b>chuyển đổi disk</b> (driver, boot) để boot native trên EC2." },
      { t: "mgn", f: "Ba loại template trong MGN?", b: "<b>Replication</b> (staging subnet…) · <b>Launch</b> (EC2 launch template) · <b>Post-launch</b> (vd chạy SSM document)." },
      { t: "mgn", f: "Vòng đời một source server trong MGN?", b: "Cài agent → initial sync → <b>Ready for testing</b> → launch test → Ready for cutover → launch cutover → <b>finalize</b> → archive." },
      { t: "mgn", f: "Nên test bao lâu trước cutover? Tối đa bao nhiêu server mỗi lần launch?", b: "Test <b>≥ 2 tuần</b> trước cutover · tối đa <b>100 source server</b> mỗi thao tác." },
      { t: "mgn", f: "Finalize cutover làm gì?", b: "Dừng sao chép, bỏ dữ liệu sao chép, <b>terminate mọi tài nguyên replication</b> ⇒ Cutover complete." },
      { t: "mgn", f: "Chi phí MGN gồm gì?", b: "Có thời gian miễn phí cho mỗi source server, nhưng vẫn trả <b>replication server EC2, EBS staging</b> và EC2/EBS của test/cutover instance ⇒ <b>finalize sớm</b>." },
      { t: "mgn", f: "MGN khác AWS Elastic Disaster Recovery thế nào?", b: "<b>MGN</b>: migrate hẳn, sao chép tạm thời tới khi finalize.<br><b>DRS</b>: DR liên tục, nguồn vẫn chạy, PIT snapshot, drill, failback.", x: "Cùng kiến trúc agent/staging/TCP 1500 – đừng nhầm mục đích." },
      { t: "mgn", f: "VM Import/Export khác MGN thế nào?", b: "Dựa trên <b>file image</b>, không sao chép liên tục ⇒ downtime dài hơn; hợp với <b>số ít VM</b>." },
      { t: "mgn", f: "Agentless replication của MGN (vCenter Client) còn dùng được không?", b: "<b>Không cho triển khai mới</b>; AWS khuyến nghị agent-based (CDP, cửa sổ cutover ngắn nhất)." },

      // ---- DMS
      { t: "dms", f: "Các thành phần của AWS DMS?", b: "<b>Replication instance</b> (EC2 được quản lý) · <b>source/target endpoint</b> · <b>replication task</b>." },
      { t: "dms", f: "Replication instance của DMS có storage bao nhiêu? HA thế nào?", b: "<b>50 GB hoặc 100 GB</b> tùy instance class; hỗ trợ <b>Multi-AZ</b> (standby đồng bộ ở AZ khác, tự failover)." },
      { t: "dms", f: "Ba kiểu migration của DMS task?", b: "<b>Full load</b> · <b>Full load + CDC</b> (downtime tối thiểu) · <b>CDC only</b>." },
      { t: "dms", f: "Khi nào dùng CDC only?", b: "Bulk load bằng <b>công cụ native</b> (thường nhanh hơn khi homogeneous) rồi DMS đồng bộ thay đổi; hoặc sao chép liên tục sang hệ thống khác." },
      { t: "dms", f: "Ba target table preparation mode?", b: "<b>Do nothing</b> · <b>Drop tables on target</b> · <b>Truncate</b>." },
      { t: "dms", f: "Full LOB mode khác Limited LOB mode thế nào?", b: "<b>Full</b>: migrate LOB đầy đủ theo chunk (chậm hơn).<br><b>Limited</b>: cắt theo Max LOB Size (nhanh hơn)." },
      { t: "dms", f: "Views migrate được bằng loại task nào?", b: "Chỉ <b>full load only</b>; task có CDC chỉ gồm bảng." },
      { t: "dms", f: "DMS Serverless là gì? 1 DCU bằng bao nhiêu?", b: "Tự provision, autoscale giữa min–max <b>DCU</b>, HA tích hợp. <b>1 DCU = 2 GB RAM</b>; min mặc định 1 DCU." },
      { t: "dms", f: "DMS Serverless: storage ban đầu và quy tắc thu hồi?", b: "Storage <b>100 GB</b>, tự tăng khi dùng tới 90%. Dừng mà không resume trong <b>48 giờ</b> ⇒ tài nguyên bị thu hồi.", x: "Không scale down trong lúc full load; lần đầu khởi tạo có thể mất tới 40 phút." },

      // ---- CDC
      { t: "cdc", f: "CDC của DMS lấy thay đổi từ đâu?", b: "Đọc <b>transaction log</b> qua API native của engine ⇒ không query lại bảng, ít ảnh hưởng nguồn." },
      { t: "cdc", f: "Cơ chế CDC cho Oracle, SQL Server, MySQL, PostgreSQL?", b: "Oracle: <b>LogMiner</b>/binary reader (redo log, SCN) · SQL Server: <b>MS-CDC</b>/MS-Replication (LSN) · MySQL: <b>row-based binlog</b> · PostgreSQL: <b>logical replication slot</b> + test_decoding." },
      { t: "cdc", f: "CDC trên RDS MySQL nguồn thất bại ⇒ kiểm tra gì?", b: "Đã bật <b>automated backups</b>, binlog <b>row format</b>, thời gian giữ binlog đủ (<b>~24 giờ</b>)." },
      { t: "cdc", f: "CDCLatencyTarget &gt; CDCLatencySource nghĩa là gì?", b: "Thay đổi tràn xuống <b>Change Cache</b> trên disk ⇒ cần <b>tối ưu phía đích</b> (thiếu primary key/index, thiếu tài nguyên)." },
      { t: "cdc", f: "DMS CDC có phải real-time, có SLA độ trễ không?", b: "<b>Không</b> – độ trễ có thể vài phút hoặc hơn.", x: "Cần sub-second / DR cho Aurora ⇒ Aurora Global Database / read replica." },
      { t: "cdc", f: "Bidirectional replication của DMS có dùng cho multi-master được không?", b: "<b>Không</b>: không phát hiện/giải quyết xung đột; chỉ dùng khi dữ liệu mỗi node tách biệt nghiệp vụ (có loopback prevention)." },
      { t: "cdc", f: "Quy trình cutover database với full load + CDC?", b: "Full load → apply thay đổi đã ghi → trạng thái ổn định → <b>tắt ứng dụng</b>, chờ thay đổi còn lại chảy sang → trỏ ứng dụng vào đích." },

      // ---- SCT
      { t: "sct", f: "Homogeneous và heterogeneous migration khác nhau thế nào?", b: "<b>Homogeneous</b> (MySQL → RDS MySQL): chỉ di chuyển dữ liệu.<br><b>Heterogeneous</b> (Oracle → Aurora PostgreSQL): <b>chuyển schema + code trước</b>, rồi DMS chuyển dữ liệu." },
      { t: "sct", f: "DMS Schema Conversion có chuyển dữ liệu không?", b: "<b>Không</b> – chỉ chuyển schema và code (view, stored procedure, function, trigger)." },
      { t: "sct", f: "DMS Schema Conversion khác AWS SCT thế nào?", b: "<b>DMS Schema Conversion</b>: managed, trên console, không cài đặt – mặc định khi “least operational overhead”.<br><b>AWS SCT</b>: ứng dụng tải về cài trên máy, là engine gốc." },
      { t: "sct", f: "Ba tài nguyên của DMS Schema Conversion?", b: "<b>Instance profile</b> · <b>data provider</b> · <b>migration project</b> (credential trong Secrets Manager)." },
      { t: "sct", f: "Assessment report dùng để làm gì?", b: "Cho biết phần nào chuyển tự động, phần nào làm tay ⇒ <b>ước tính công sức</b> trước khi cam kết." },
      { t: "sct", f: "Extension pack là gì?", b: "Gói giả lập <b>tính năng nguồn mà đích không có</b>." },
      { t: "sct", f: "Oracle chuyển được sang những đích nào với DMS Schema Conversion?", b: "Aurora/RDS for PostgreSQL, Aurora/RDS for MySQL, <b>Amazon Redshift</b>." },

      // ---- Từ khóa
      { t: "kw", f: "“<i>Migrate hundreds of VMware and physical servers to EC2, minimal downtime, no application changes</i>” ⇒ ?", b: "<b>AWS Application Migration Service (MGN)</b>." },
      { t: "kw", f: "“<i>Move self-managed DB to a managed service, minimal code changes</i>” ⇒ chiến lược?", b: "<b>Replatform</b> (→ RDS / Aurora)." },
      { t: "kw", f: "“<i>Break the monolith into microservices / serverless</i>” ⇒ chiến lược?", b: "<b>Refactor</b>." },
      { t: "kw", f: "“<i>Move VMware workloads without converting VMs</i>” / “<i>move an RDS instance to another account</i>” ⇒ ?", b: "<b>Relocate</b>." },
      { t: "kw", f: "“<i>Collect utilization data from VMware, cannot install software on VMs</i>” ⇒ ?", b: "<b>Agentless Collector</b> (OVA trên vCenter)." },
      { t: "kw", f: "“<i>Need running processes and network connections, also physical servers</i>” ⇒ ?", b: "<b>Discovery Agent</b>." },
      { t: "kw", f: "“<i>Single place to track migration progress across tools</i>” ⇒ ?", b: "<b>AWS Migration Hub</b>." },
      { t: "kw", f: "“<i>Migrate on-prem DB to RDS/Aurora with minimal downtime</i>” ⇒ ?", b: "<b>AWS DMS full load + CDC</b>." },
      { t: "kw", f: "“<i>Avoid capacity planning for replication instances</i>” ⇒ ?", b: "<b>DMS Serverless</b>." },
      { t: "kw", f: "“<i>Migrate Oracle to Aurora PostgreSQL</i>” ⇒ ?", b: "<b>DMS Schema Conversion / AWS SCT</b> (schema) + <b>AWS DMS</b> (dữ liệu)." },
      { t: "kw", f: "Ứng dụng 3 tầng: web/app servers + Oracle DB + NFS share ⇒ công cụ?", b: "<b>MGN</b> (server) + <b>DMS</b> (+ SCT nếu đổi engine) + <b>DataSync</b> (file)." },
      { t: "kw", f: "Đề nhắc “<i>AWS Server Migration Service</i>” hay “<i>CloudEndure Migration</i>” ⇒ ?", b: "Dịch vụ cũ; đáp án hiện đại là <b>MGN</b>." }
    ],
